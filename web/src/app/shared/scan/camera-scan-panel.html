<section class="flex flex-col gap-3 p-4" data-testid="camera-scan-panel">
  <header class="flex items-center gap-2">
    <mat-icon aria-hidden="true">photo_camera</mat-icon>
    <h2 class="m-0 flex-1 text-base font-medium">{{ 'scan.camera.title' | translate }}</h2>
    <button
      mat-icon-button
      type="button"
      (click)="dialog.close()"
      [appLabel]="'scan.camera.close' | translate"
      data-testid="camera-close"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <app-camera-view (read)="scans.receive($event, 'camera')" />
</section>
