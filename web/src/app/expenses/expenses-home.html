@if (failed()) {
  <div role="alert" class="flex flex-wrap items-center gap-2" data-testid="home-expenses-error">
    <span class="text-error">{{ 'feedback.panel_failed' | translate }}</span>
    <button mat-button type="button" (click)="retry()" data-testid="home-expenses-retry">
      {{ 'feedback.retry' | translate }}
    </button>
  </div>
} @else if (summary(); as s) {
  @let change = versus();
  <app-kpi-tile
    data-testid="home-expenses"
    [icon]="'receipt_long'"
    [label]="'expenses.home.title' | translate: { month: month() }"
    [figure]="s.month"
    [scale]="s.currencyScale"
    [currency]="s.currency"
    [delta]="
      change
        ? {
            kind: change.kind,
            words:
              'expenses.home.versus.' + change.kind
              | translate: { amount: (change.amount | amount: s.currencyScale) },
          }
        : null
    "
    [caption]="'expenses.home.note' | translate"
    [see]="{ route: '/expenses', label: 'expenses.home.see' | translate }"
  />
}
