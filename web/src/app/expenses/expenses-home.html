@if (summary(); as s) {
  @let change = versus();
  <app-kpi-tile
    data-testid="home-expenses"
    [icon]="'receipt_long'"
    [label]="'expenses.home.title' | translate: { month: month() }"
    [figure]="s.month"
    [scale]="s.currencyScale"
    [currency]="s.currency"
    [delta]="
      change
        ? {
            kind: change.kind,
            words:
              'expenses.home.versus.' + change.kind
              | translate: { amount: (change.amount | amount: s.currencyScale) },
          }
        : null
    "
    [caption]="'expenses.home.note' | translate"
    [see]="{ route: '/expenses', label: 'expenses.home.see' | translate }"
  />
}
