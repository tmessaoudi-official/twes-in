<div class="flex max-w-3xl flex-col gap-4 pt-4">
  <h2 class="text-xl font-semibold">{{ 'design.customer_form.title' | translate }}</h2>

  @if (saved()) {
    <p
      role="status"
      class="rounded-lg bg-primary-container px-4 py-2 text-sm text-on-primary-container"
      data-testid="design-customer-saved"
    >
      {{ 'design.customer_form.saved' | translate }}
    </p>
  }

  <app-descriptor-form
    [descriptor]="descriptor"
    [form]="form"
    testId="design-customer-form"
    (submitted)="save()"
  >
    <div class="flex flex-wrap justify-end gap-2">
      <a mat-button routerLink="..">{{ 'design.customer_form.cancel' | translate }}</a>
      <button mat-flat-button type="submit" data-testid="design-customer-save">
        {{ 'design.customer_form.save' | translate }}
      </button>
    </div>
  </app-descriptor-form>
</div>
