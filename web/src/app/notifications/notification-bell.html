@if (variant() === 'row') {
  <!-- The rail's foot (docs/SPEC.md § 7, 2026-09-25 09:03): a row like the destinations above it, its count beside
       the label; folded to the rail, the icon alone carries the count and the tooltip names it. -->
  <button
    type="button"
    class="twes-rail-row"
    aria-haspopup="dialog"
    (click)="open()"
    [appLabel]="'notifications.bell' | translate: { count: unread() }"
    [matTooltipDisabled]="!folded()"
    matTooltipPosition="right"
    [attr.data-unread]="unread()"
    data-testid="notification-bell"
  >
    <!-- Folded, unread notifications are a dot on the icon, drawn with no text: Material's small badge keeps its count
         as text, which is a label the name does not carry (WCAG 2.5.3). The count is in the button's name. -->
    <span class="twes-bell-mark" aria-hidden="true"
      ><mat-icon>notifications</mat-icon>
      @if (unread() > 0 && folded()) {
        <span class="twes-bell-dot" data-testid="notification-dot"></span>
      }
    </span>
    <span class="twes-rail-label" [class.sr-only]="folded()" aria-hidden="true">{{
      'notifications.title' | translate
    }}</span>
    @if (unread() > 0 && !folded()) {
      <span class="twes-rail-count" aria-hidden="true" [attr.data-glyph]="badge()"></span>
    }
  </button>
} @else {
  <button
    mat-icon-button
    type="button"
    aria-haspopup="dialog"
    (click)="open()"
    [appLabel]="'notifications.bell' | translate: { count: unread() }"
    [attr.data-unread]="unread()"
    data-testid="notification-bell"
  >
    <!-- The count is drawn, « 9+ » above nine, while the name says it exactly: drawn as text it would be a label the
         name does not carry (WCAG 2.5.3). -->
    <span class="twes-bell-mark" aria-hidden="true"
      ><mat-icon>notifications</mat-icon>
      @if (unread() > 0) {
        <span
          class="twes-bell-count"
          [attr.data-glyph]="badge()"
          data-testid="notification-count"
        ></span>
      }
    </span>
  </button>
}
