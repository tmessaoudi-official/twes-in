<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>twes-in</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The "Angle" mark (docs/SPEC.md § 7, 2026-09-20). The SVG is what every current browser takes; the .ico
      stays for the ones that ask for it by that name whatever the markup says, and apple-touch-icon is what
      iOS uses when the app is added to a home screen. All four are rendered from the one SVG.
    -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="/api/web-manifest" />
    <meta name="theme-color" content="#1f6feb" />
    <!--
      The text size this device keeps (Mon compte, Préférences), put on the root before the first paint so the page
      never reflows to it; the customer display keeps its own. ThemeFacade applies the same key again and follows its
      changes (app/shared/theme/text-size.ts). nginx writes the response's nonce in, as for every inline script.
    -->
    <script nonce="**CSP_NONCE**">
      (function () {
        try {
          var size = window.localStorage.getItem('twes.text-size');
          if (
            (size === '112' || size === '125') &&
            !/^\/customer-display(?:[/?#]|$)/.test(location.pathname)
          ) {
            document.documentElement.classList.add('twes-text-' + size);
          }
        } catch (blocked) {
          // Site data blocked: the browser's own size, as the app then reads too.
        }
      })();
    </script>
  </head>
  <body>
    <!-- nginx replaces the placeholder with this response's CSP nonce (infra/web/nginx.conf). -->
    <app-root ngCspNonce="**CSP_NONCE**"></app-root>
  </body>
</html>
