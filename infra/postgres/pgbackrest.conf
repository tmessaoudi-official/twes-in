# SPDX-License-Identifier: AGPL-3.0-or-later
# What every copy of the database follows; where it goes and the keys come from the environment, never from this file:
# one repository, whose kind and path its destination layer names (compose.backup-bucket.yaml, a server's bucket under
# the instance's prefix; compose.backup-local.yaml, a shop's folder), beside restic's.

[global]
# Every base backup and its WAL is encrypted before it leaves; the passphrase is the instance's own.
repo1-cipher-type=aes-256-cbc
# Fourteen days back (docs/SPEC.md § 8 row 58): a full backup is kept while it is younger, with the WAL that replays
# from it, so any moment of the last fortnight can be restored.
repo1-retention-full-type=time
repo1-retention-full=14
compress-type=zst
# The archive queue is pushed from a local spool, so a slow repository never holds a commit. Past this size the oldest WAL is
# dropped rather than let the disk fill and stop the database: the point-in-time window then has a hole, which the
# monitoring of the archive's age is there to make loud.
archive-async=y
archive-push-queue-max=4GiB
spool-path=/var/spool/pgbackrest
start-fast=y
log-level-console=info
log-level-file=off

[twes]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=twes
pg1-database=twes
