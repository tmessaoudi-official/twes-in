; twes-in PHP settings for the production image only (infra/api/Dockerfile, stage prod), over php.ini-production.
; The code never changes under a running production container, so OPcache need not check any file for a change.
opcache.validate_timestamps = 0
; The kernel's preload list, written by the cache warmup at build (https://symfony.com/doc/current/performance.html).
; FrankenPHP runs as root, and PHP refuses to preload as root without a named user.
opcache.preload = /app/config/preload.php
opcache.preload_user = root
