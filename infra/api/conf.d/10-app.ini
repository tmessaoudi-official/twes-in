; twes-in PHP settings for the API image, every mode (copied to $PHP_INI_DIR/conf.d/; the production stage adds 20-app.prod.ini).
; Every timestamp is UTC (docs/SPEC.md § 3 Architecture style); the test suite pins the same in phpunit.dist.xml.
date.timezone = UTC
expose_php = Off
; Uploads (docs/SPEC.md § 7, 2026-09-15): the API refuses an attachment above 10 MiB; these sit just above it so
; that refusal, which names the field, is what a person sees.
upload_max_filesize = 12M
post_max_size = 12M
; Symfony's recommended OPcache and realpath values (https://symfony.com/doc/current/performance.html), in every mode:
; the application and its vendor directory hold more than the default 10 000 files.
opcache.memory_consumption = 256
opcache.max_accelerated_files = 32531
opcache.interned_strings_buffer = 32
realpath_cache_size = 4096K
realpath_cache_ttl = 600
