; Live development only (compose.live.yaml): OPcache checks a file's time on every include, so a worker the watcher
; restarts after an edit compiles the edited file instead of serving the copy it cached a moment before.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; The tools container shares this cache and clears it, and the first request after that compiles the container and every
; resource's metadata while it writes the OpenAPI document the web tier fetches at start: on a loaded machine that one
; request took 35 seconds against a second once warm (its memory is every mode's, 10-app.ini).
max_execution_time = 120
