; DEVELOPMENT overlay, mounted over the production conf.d by compose.dev.yaml. Never present in a built image.

; TIMESTAMP VALIDATION BACK ON. The production config sets `validate_timestamps=0`, so an edited file is NEVER
; recompiled -- meaning that with the dev source mount in place, edits would appear to do nothing at all. That
; failure looks like a broken volume rather than a cache setting, which is the whole reason this file exists.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; No preload in dev: the preload script is built from the PROD container, and loading it while serving `dev` pins
; the wrong compiled container in memory.
opcache.preload=

; The API restriction is lifted so `opcache_get_status()` works from a console command while tuning.
opcache.restrict_api=

; Errors to the response as well as the log. Acceptable ONLY here -- in production this leaks the schema and the
; file layout to whoever triggered the error.
display_errors=On
display_startup_errors=On

; Argument values back in traces. They are what make a stack trace useful, and they are exactly what must never be
; logged in production, because they contain tenant ids and amounts.
zend.exception_ignore_args=Off

; Longer, so a breakpoint or a slow query does not look like a hang.
max_execution_time=120
memory_limit=512M
