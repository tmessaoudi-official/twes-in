; ==============================================================================================================
; PHP runtime — production hardening and application requirements.
; ==============================================================================================================

; ------------------------------------------------------------------------------------------------------------
; ERROR HANDLING. Nothing is displayed, everything is logged.
; ------------------------------------------------------------------------------------------------------------
; A displayed error in a billing product leaks the schema, the file layout, sometimes the connection string — and
; it leaks it to whoever triggered it. Symfony's own `php_errors.log: true` sends these to the framework logger,
; and stderr is where a container's diagnostics belong.
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
error_reporting=E_ALL

; The trace can contain argument VALUES — a tenant id, an amount, an API token passed to a client. Off.
zend.exception_ignore_args=On
zend.exception_string_param_max_len=0

; ------------------------------------------------------------------------------------------------------------
; RESOURCE LIMITS. Each one bounds the damage a single hostile or buggy request can do.
; ------------------------------------------------------------------------------------------------------------
memory_limit=256M

; 30s. A document render (Wave 4) is the longest legitimate request; anything beyond this is a bug or an attack,
; and an unbounded request is how one client's malformed input consumes a worker slot indefinitely.
max_execution_time=30
max_input_time=30

; Upload bounds. Attachments are the only legitimate upload, and 16 MB is generous for a PDF or an image. A large
; limit is not free: each concurrent upload holds that much of `memory_limit`.
upload_max_filesize=16M
post_max_size=20M
max_file_uploads=20

; A DoS vector with a CVE history: a request with tens of thousands of parameters costs quadratic time in the
; parser. 1000 is far above anything a real client sends.
max_input_vars=1000
max_input_nesting_level=64

; ------------------------------------------------------------------------------------------------------------
; DISABLED FUNCTIONS. Defence in depth for the case where PHP execution is achieved.
; ------------------------------------------------------------------------------------------------------------
; None of these is used by this application, its framework or its dependencies, and each one turns a file-write or
; deserialisation bug into command execution. Disabling them costs nothing and removes the most common escalation
; path in a PHP compromise.
;
; NOTE `exec` and `proc_open` are absent from this list ON PURPOSE and it is not an oversight: `symfony/process` is
; how the scheduler and the document renderer invoke subprocesses, and `SchemaTenancyGateTest` shells out to the
; gate. Disabling them would break real functionality, so the mitigation for those is that nothing untrusted
; reaches their arguments.
disable_functions=passthru,shell_exec,system,popen,pcntl_exec,pcntl_fork,dl,php_uname,getmyuid,getmypid,posix_getpwuid,posix_kill,posix_setuid,posix_setgid,posix_setsid

; The bug class this closes: `include`/`require`/`file_get_contents` on an attacker-controlled `http://` or
; `data:` URL. Nothing here loads code or data over a stream wrapper.
allow_url_fopen=Off
allow_url_include=Off

; ------------------------------------------------------------------------------------------------------------
; APPLICATION REQUIREMENTS.
; ------------------------------------------------------------------------------------------------------------
; UTC in the container. Document dates are a DOMAIN concern resolved through `ClockInterface` — never an ambient
; `date_default_timezone_get()` — so this only makes log timestamps comparable across replicas.
date.timezone=UTC

; **THE MOST IMPORTANT LINE IN THIS FILE.** bcmath's default scale governs how many decimal places its operations
; keep, and every bcmath function TRUNCATES rather than rounds. The domain passes an explicit scale to every call
; and does all rounding in `Decimal::applyRounding()`, so this default should never be consulted — but if a future
; call ever omits the scale, a default of 0 would silently turn `0.100 TND` (Tunisia's stamp duty, 100 millimes)
; into `0`. Set high enough that the failure mode of an omitted scale is a long number rather than a wrong one.
bcmath.scale=0

; Multibyte defaults for the FR/AR/EN catalogues. Arabic is a first-class locale here, so a single-byte assumption
; anywhere is a rendering bug.
default_charset=UTF-8
mbstring.language=Neutral

; Serialisation precision. 17 round-trips a double exactly; the default of -1 also does, but stating it prevents a
; future image inheriting a lossy value. Money never goes near a float — this is for everything else.
serialize_precision=17
precision=14

; No fingerprinting. `expose_php` adds an `X-Powered-By` header naming the exact build; the Caddyfile strips it
; too, and defence in depth means both.
expose_php=Off

; Realpath cache. With `validate_timestamps=0` the resolved paths never change, so a large cache with a long TTL
; removes a stat storm on every include.
realpath_cache_size=4096K
realpath_cache_ttl=600
