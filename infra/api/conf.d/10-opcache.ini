; ==============================================================================================================
; OPcache — production settings.
;
; Every value here is a decision, not a copied default. The two that matter most are `validate_timestamps=0` and
; the JIT configuration, and both have a real failure mode if got wrong.
; ==============================================================================================================

opcache.enable=1

; Also enabled for the CLI, which is unusual and deliberate: `bin/console` runs migrations and, later, the Messenger
; worker and the scheduler. Those are long-lived processes in this topology, so they benefit from a warm cache
; exactly as the web process does.
opcache.enable_cli=1

; 256 MB. API Platform plus Doctrine plus the Symfony container is a large class graph, and an undersized cache
; silently starts EVICTING — which shows up as unexplained latency rather than as an error, so it is worth
; over-provisioning. `opcache_get_status()` reports the real high-water mark; infra/README.md records checking it.
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; NEVER stat the filesystem for changes. The code in a production image is immutable — a deploy replaces the
; container — so timestamp validation is a syscall per file per request that can only ever return "unchanged".
;
; THE COROLLARY IS A DEPLOYMENT RULE, not a comment: with this off, editing a file inside a running container has
; NO effect. Anyone who tries to hotfix by `docker exec` and an editor will conclude the process is broken. The
; dev override (`conf.d/dev/`) turns it back on for exactly that reason.
opcache.validate_timestamps=0

; The cache is warmed at BUILD time (see the Dockerfile), so the first real request should never compile anything.
opcache.preload=/app/var/cache/prod/Twes_KernelProdContainer.preload.php
opcache.preload_user=twes

; JIT. `tracing` is the right mode for a long-running web process: it profiles and compiles hot traces rather than
; every function, so the compilation cost is paid once for code that is actually hot.
;
; A caution recorded because it is easy to get wrong: JIT gives a large win on numeric loops and a much smaller one
; on I/O-bound request handling, which is most of what an API does. It is on because the domain does EXACT DECIMAL
; ARITHMETIC over bcmath and the allocator work in `Decimal::applyRounding()` is genuinely hot when a document has
; hundreds of lines. If a JIT bug is ever suspected, `opcache.jit=off` is the single-value rollback.
opcache.jit=tracing
opcache.jit_buffer_size=128M

; Fast shutdown hands memory back to the request allocator in one step instead of freeing object graphs
; individually. Safe with PHP's own allocator and measurably cheaper at end of request.
opcache.fast_shutdown=1

; No timing side channel from cache introspection, and no way for application code to flush the cache. Both are
; reachable from a PHP RCE and neither is needed by anything we run.
opcache.restrict_api=/app
