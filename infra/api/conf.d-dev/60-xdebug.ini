; ==============================================================================================================
; XDEBUG — development only. Copied into the `dev` Dockerfile target and PRESENT IN NO OTHER IMAGE.
;
; The extension itself is not configured here as "on". `xdebug.mode` is read from the XDEBUG_MODE environment
; variable, which the dev image defaults to `off`, so the cost of having Xdebug installed is ~zero until somebody
; asks for it. That default is the difference between a debugger a developer uses and one they disable on the
; second day: `xdebug.mode=debug` costs roughly 2-5x on EVERY request even with no IDE attached, because every
; function entry and exit goes through the debug handler.
;
; `make debug-on` sets XDEBUG_MODE=debug,develop and recreates the container; `make debug-off` puts it back.
; ==============================================================================================================

zend_extension=xdebug

; From the environment, so flipping it is a compose variable rather than an edit to a file inside an image.
; `off`      — installed, inert, no measurable cost.
; `develop`  — better var_dump, real stack traces on errors. Cheap.
; `debug`    — the step debugger. This is the expensive one.
; `coverage` — needed by PHPUnit for coverage; NOT on by default because it slows the suite substantially.
xdebug.mode=${XDEBUG_MODE}

; ==============================================================================================================
; HOW THE DEBUGGER FINDS THE IDE. This is the part that is normally got wrong, and the symptom of getting it
; wrong is silence — no error, no connection, a breakpoint that simply never hits.
; ==============================================================================================================

; `trigger`, not `yes`. With `yes`, EVERY request tries to open a debug connection to the IDE, and when no IDE is
; listening each one waits for the connect to fail — which reads as the whole API being slow for no reason. With
; `trigger`, a request is debugged only when it carries `XDEBUG_TRIGGER` (as a cookie, GET/POST parameter, or the
; `XDEBUG_SESSION` cookie every IDE's browser extension sets). So the default state is fast, and debugging is
; opt-in per request — which also means one developer can debug while the stack keeps serving normally.
xdebug.start_with_request=trigger

; `host.docker.internal` resolves to the machine running Docker. On Linux it is NOT automatic — Docker Desktop
; provides it on macOS and Windows, and on Linux it exists only because `compose.override.yaml` declares
; `extra_hosts: host.docker.internal:host-gateway`. Without that line this value silently resolves to nothing and
; the debugger never connects, which is the single most common cause of "breakpoints do not work in Docker".
xdebug.client_host=host.docker.internal

; 9003 is Xdebug 3's default and what every current IDE listens on by default. Xdebug 2 used 9000, which also
; happens to be php-fpm's port — a collision that wasted a great deal of the world's time and is why it moved.
xdebug.client_port=9003

; So the IDE can match an incoming connection to this project rather than asking every time.
xdebug.idekey=twes

; ==============================================================================================================
; PATH MAPPING is configured in the IDE, not here, but the values it needs are these:
;
;   remote (in the container):  /app
;   local  (on the host):       <repository>/api
;
; The dev overlay bind-mounts the host `api/` tree at `/app`, so the mapping is one entry and the paths otherwise
; correspond exactly. This is also why `api/vendor` must exist ON THE HOST (`make install`): without it the IDE
; has no file to open when execution steps into a Symfony or Doctrine frame, and the debugger appears to jump into
; nothing.
; ==============================================================================================================

; Log ONLY real problems. Level 7 is the default and writes a line for every connection attempt, which on a
; trigger-based setup means a noisy log full of successful no-ops. Level 1 keeps errors, which is what is useful
; when a connection is NOT being made.
xdebug.log_level=1
xdebug.log=/app/var/log/xdebug.log

; The step debugger halts the process while the IDE thinks, so the request time limit must not apply. Without
; this, sitting on a breakpoint for 30 seconds kills the request and the IDE reports a lost connection rather
; than a timeout.
xdebug.var_display_max_children=256
xdebug.var_display_max_data=4096
xdebug.var_display_max_depth=6
max_execution_time=0
