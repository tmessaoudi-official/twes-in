; DEVELOPMENT overlay. Mounted INTO the production conf.d by `compose.override.yaml` — which is the file's real name;
; this line said `compose.dev.yaml` until 2026-08-04 and no such file has ever existed.
;
; It lives in `conf.d-dev/` and NOT in `conf.d/`, so the Dockerfile's wholesale `COPY infra/api/conf.d/` cannot carry
; it into the production image. While it was a subdirectory of `conf.d/` it WAS shipped, and `display_errors=On`
; below is the reason that mattered.
;
; It is mounted as a FLAT FILE ending in `.ini`, never as a directory: PHP selects scan-directory entries by that
; suffix and does not recurse, so a directory mount makes every line here inert — which is what it was until
; 2026-08-04.

; TIMESTAMP VALIDATION BACK ON. The production config sets `validate_timestamps=0`, so an edited file is NEVER
; recompiled -- meaning that with the dev source mount in place, edits would appear to do nothing at all. That
; failure looks like a broken volume rather than a cache setting, which is the whole reason this file exists.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; No preload in dev: the preload script is built from the PROD container, and loading it while serving `dev` pins
; the wrong compiled container in memory.
opcache.preload=

; The API restriction is lifted so `opcache_get_status()` works from a console command while tuning.
opcache.restrict_api=

; Errors to the response as well as the log. Acceptable ONLY here -- in production this leaks the schema and the
; file layout to whoever triggered the error.
display_errors=On
display_startup_errors=On

; Argument values back in traces. They are what make a stack trace useful, and they are exactly what must never be
; logged in production, because they contain tenant ids and amounts.
zend.exception_ignore_args=Off

; Longer than production's 30s so a slow query does not look like a hang, but still BOUNDED -- an unbounded dev
; request means an accidental infinite loop pins a FrankenPHP worker thread forever and the developer's diagnosis
; starts from "the container hangs" rather than from a fatal naming the line.
;
; FROM THE ENVIRONMENT, because the one case that genuinely wants no limit is a HELD BREAKPOINT, and that is
; exactly the case `make debug-on` knows about: it sets `TWES_MAX_EXECUTION_TIME=0` for the session. `60-xdebug.ini`
; used to hardcode 0 unconditionally, which silently overrode this line (`zz-60-` sorts after `zz-50-`) and applied
; the exemption even with the debugger off.
max_execution_time=${TWES_MAX_EXECUTION_TIME}
memory_limit=512M

; ==============================================================================================================
; JIT OFF IN DEV. Not a performance preference — a correctness-of-output one.
;
; `10-opcache.ini` sets `opcache.jit=tracing`, which is right for production: the domain does exact decimal
; arithmetic over bcmath and the allocator work in `Decimal::applyRounding()` is genuinely hot. In DEV it is worth
; nothing (nothing here is throughput-bound) and it actively costs something, because Xdebug overrides
; `zend_execute_ex()` and the two cannot coexist. PHP then prints, on EVERY invocation with Xdebug armed:
;
;   Warning: JIT is incompatible with third party extensions that override zend_execute_ex(). JIT disabled.
;
; Which is not merely noise. `display_errors=On` above sends it to STDOUT, so it lands in the middle of any
; command whose output is captured — it broke `make debug-status`, whose `$(...)` picked up the warning text as
; part of the value it was reading back. Turning JIT off removes the incompatibility rather than the message,
; which is the difference between a fix and a suppression.
opcache.jit=off
opcache.jit_buffer_size=0

; ==============================================================================================================
; `getmypid` BACK ON, WITHOUT WHICH THE TEST SUITE CANNOT RUN A SINGLE TEST IN THIS CONTAINER.
;
; `20-app.ini` disables it as part of a deliberate `disable_functions` list, and that is right for production — but
; PHPUnit's `ShutdownHandler::register()` calls it unconditionally, so `make test` died before the first test with:
;
;   An error occurred inside PHPUnit.
;   Message:  Call to undefined function getmypid()
;   Location: phar:///app/tools/bin/phpunit-12.phar/phpunit/Runner/ShutdownHandler.php:42
;
; [Verified: exactly that, exit 255, zero tests run.] Re-enabling it is a dev-only relaxation of the kind this whole
; file exists for. `disable_functions` is PHP_INI_SYSTEM and cannot be *subtracted* from, so the whole list is
; restated MINUS `getmypid` -- which is a duplication with `20-app.ini` and the reason it is spelled out rather than
; patched. If that list changes there, change it here too; nothing enforces the pairing yet.
disable_functions=passthru,shell_exec,system,popen,pcntl_exec,pcntl_fork,dl,php_uname,getmyuid,posix_getpwuid,posix_kill,posix_setuid,posix_setgid,posix_setsid
