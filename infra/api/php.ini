; twes-in PHP settings for the API image (copied to $PHP_INI_DIR/conf.d/).
; Every timestamp is UTC (docs/SPEC.md § 3 Architecture style); the test suite pins the same in phpunit.dist.xml.
date.timezone = UTC
expose_php = Off
; Uploads (docs/SPEC.md § 7, 2026-09-15): the API refuses an attachment above 10 MiB; these sit just above it so
; that refusal, which names the field, is what a person sees.
upload_max_filesize = 12M
post_max_size = 12M
