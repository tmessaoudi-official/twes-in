# Serves the Angular bundle and proxies the API on the same origin, so the session cookie never crosses an origin.

# The HTML document carries this response's CSP nonce, so it must never be served from a cache: a stored copy would
# pair an old nonce with a new header. Assets and API responses are unaffected (an empty value sends no header).
map $sent_http_content_type $document_cache_control {
    ~^text/html "no-store";
    default     $static_cache_control;
}

# A translation file keeps its name across releases, unlike the hashed bundles, so a browser left to guess kept an old
# one and showed a new key raw after a deploy (2026-09-22). It is revalidated on every load; its ETag makes that a 304.
#
# The build names every bundle and the media it pulls in (the icon font) after its content hash, so that name never
# serves other bytes: a browser keeps it a year without asking (PF-09, 2026-09-25 — each visit revalidated the 3.8 MB
# icon font). The hash is 8 or 9 characters of [A-Za-z0-9_-]; a name without one (/fonts/, the manifest's icons) keeps
# no such promise and is left to the browser's own revalidation.
map $uri $static_cache_control {
    ~^/i18n/ "no-cache";
    "~^/(?:[a-z]+-[A-Za-z0-9_-]{8,9}\.(?:js|css)|media/[a-z0-9-]+-[A-Z0-9]{8}\.[a-z0-9]+)$" "public, max-age=31536000, immutable";
    default  "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Every redirect this server issues is relative, so the browser keeps the origin it asked on. Absolute ones are
    # built from `server_name` and the LISTEN port, which is 80 inside the container: a person opening
    # http://localhost:8090/api was sent to http://localhost/api/, on a port nothing answers on. The redirect in
    # question is nginx's own — a `location` ending in `/` that proxies answers the same URI without the slash with
    # a 301 — so no proxy header can fix it and nothing here asks for it.
    absolute_redirect off;

    # Strict CSP with a nonce per response; no 'unsafe-inline' anywhere. $request_id is 32 hex characters drawn from
    # a random source for every request. index.html carries the placeholder on <app-root ngCspNonce>: the Angular
    # build copies it onto the inlined critical styles and swaps the stylesheet's onload handler for a script that
    # carries it, and at runtime Angular puts it on every component style. sub_filter writes this response's value
    # in (HTML only). API responses pass through here too and carry the same headers, which is harmless.
    sub_filter '**CSP_NONCE**' $request_id;
    sub_filter_once off;
    # 'wasm-unsafe-eval' lets WebAssembly compile, and nothing more: the camera's barcode decoder is a self-hosted wasm
    # (docs/SPEC.md § 7, 2026-09-22 22:38). It does not allow eval() or new Function() in JavaScript.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' 'wasm-unsafe-eval'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $document_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        # Attachments go up to 10 MiB (api: app.files.upload_max_bytes); a little above, so the API's own refusal answers.
        client_max_body_size 12m;
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used; the API compares Origin against scheme, host and port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The API documentation's own stylesheets and scripts, which its page loads from this path and not from under
    # /api/. Without this they fall through to the single-page application's catch-all and every one of them comes
    # back as index.html with `Content-Type: text/html`, which `nosniff` then refuses to run: the documentation
    # renders as unstyled text and reads as a broken page rather than as a missing route.
    location /bundles/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Centrifugo's WebSocket endpoint on the same origin, so connect-src 'self' covers it and the session never
    # needs a cross-origin exception. Its HTTP API is deliberately not proxied: only the api container publishes.
    location = /connection/websocket {
        proxy_pass http://centrifugo:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A quiet connection is still a live one: Centrifugo pings every 25 seconds, well inside this.
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
