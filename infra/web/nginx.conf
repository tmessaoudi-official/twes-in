# Serves the Angular bundle and proxies the API on the same origin, so the session cookie never crosses an origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Strict CSP without nonces: the Angular bundle has no inline script, Material and the CDK inject styles
    # (hence style-src unsafe-inline; a nonce-based policy is recorded as owed in docs/SPEC.md). API responses
    # pass through here too and carry the same headers, which is harmless.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used; the API compares Origin against scheme, host and port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
