# Serves the Angular bundle and proxies the API on the same origin, so the session cookie never crosses an origin.

# The HTML document carries this response's CSP nonce, so it must never be served from a cache: a stored copy would
# pair an old nonce with a new header. Assets and API responses are unaffected (an empty value sends no header).
map $sent_http_content_type $document_cache_control {
    ~^text/html "no-store";
    default     "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Strict CSP with a nonce per response; no 'unsafe-inline' anywhere. $request_id is 32 hex characters drawn from
    # a random source for every request. index.html carries the placeholder on <app-root ngCspNonce>: the Angular
    # build copies it onto the inlined critical styles and swaps the stylesheet's onload handler for a script that
    # carries it, and at runtime Angular puts it on every component style. sub_filter writes this response's value
    # in (HTML only). API responses pass through here too and carry the same headers, which is harmless.
    sub_filter '**CSP_NONCE**' $request_id;
    sub_filter_once off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $document_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        # Attachments go up to 10 MiB (api: app.files.upload_max_bytes); a little above, so the API's own refusal answers.
        client_max_body_size 12m;
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used; the API compares Origin against scheme, host and port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Centrifugo's WebSocket endpoint on the same origin, so connect-src 'self' covers it and the session never
    # needs a cross-origin exception. Its HTTP API is deliberately not proxied: only the api container publishes.
    location = /connection/websocket {
        proxy_pass http://centrifugo:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A quiet connection is still a live one: Centrifugo pings every 25 seconds, well inside this.
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
