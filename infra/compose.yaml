# ==============================================================================================================
# twes-in — the base stack. Shared by dev and prod; each overlays this with its own file.
#
# WRITTEN FROM SCRATCH. `invoiceninja/dockerfiles` is GPL-2.0 — stronger copyleft than the ELv2 the rest of that
# project carries — so copying a compose file from it would make this artifact GPL-2.0 and oblige source disclosure
# for the derivative, killing the commercial branch. Licensing invariant 7 permits reusing the deployment TOPOLOGY,
# which is an idea, and forbids the FILES. The topology below is the industry's; every line here is ours.
#
# ONE APP SERVER, NOT TWO. FrankenPHP *is* Caddy with PHP embedded, so there is no nginx and no php-fpm: one
# process serves the API, the Angular admin and the Flutter web client. That also keeps all three on the SAME
# ORIGIN, which is what preserves the Flutter build's same-origin controls instead of forcing CORS.
#
# Run it with the Makefile at the repository root rather than by hand — `make up` supplies the `-f` chain and the
# project directory, and getting either wrong is how a stack silently reads the wrong `.env`.
# ==============================================================================================================

name: twes-in

# --------------------------------------------------------------------------------------------------------------
# Reusable fragments. YAML anchors rather than repetition, so a change to the PHP image's environment cannot apply
# to the web container and be forgotten on the worker — which is precisely how a queue worker ends up talking to a
# different database than the API.
# --------------------------------------------------------------------------------------------------------------
x-api-image: &api-image
  build:
    context: ..
    dockerfile: infra/api/Dockerfile
    # `target: prod` IS MANDATORY AND ITS ABSENCE WAS A LATENT TRAP THAT WENT LIVE ON 2026-08-05.
    #
    # BuildKit builds the LAST stage in a Dockerfile when no target is named. Until the `dev` stage was added, the
    # last stage happened to BE `runtime`, so every untargeted build produced the production image — correct, but by
    # accident. Appending `FROM base AS dev` silently redirected every one of them.
    #
    # Two consequences, both the exact opposite of what the dev/prod split is for:
    #   1. `make up-prod` tagged the DEBUGGER image as `twes-in/api:${TWES_VERSION}` — Xdebug, Composer, git, psql,
    #      `display_errors=On` and argument values in stack traces, the settings whose own comments say they leak the
    #      schema and log tenant ids and amounts.
    #   2. It could not even start: the `dev` stage never runs `composer install`, and production has no bind mount
    #      to supply `vendor/`, so the entrypoint dies on `autoload_runtime.php` and reports
    #      `the database schema is NOT up to date` — pointing whoever debugs it at the database.
    #
    # `compose.override.yaml` overrides this with `target: dev`, so dev is explicit and prod is explicit, and neither
    # depends on stage ORDER in the Dockerfile ever again.
    target: prod
  image: twes-in/api:${TWES_VERSION:-prod}

x-api-environment: &api-environment
  APP_ENV: '${APP_ENV:-prod}'
  APP_DEBUG: '${APP_DEBUG:-0}'
  APP_SECRET: '${APP_SECRET:?APP_SECRET must be set - generate one with: openssl rand -hex 32}'
  # The RUNTIME credential, and only the runtime credential. `DATABASE_URL_OWNER` is deliberately absent from every
  # serving container: the entrypoint REFUSES to start if it is present, because a runtime process that can reach
  # the owning role can DISABLE ROW LEVEL SECURITY on every tenant table.
  DATABASE_URL: postgresql://${TWES_DB_RUNTIME_ROLE:-twes}:${TWES_DB_RUNTIME_PASSWORD:?TWES_DB_RUNTIME_PASSWORD must be set}@database:5432/${POSTGRES_DB:-twes}?serverVersion=18&charset=utf8
  MESSENGER_TRANSPORT_DSN: '${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=false}'
  LOCK_DSN: '${LOCK_DSN:-redis://valkey:6379}'
  DEFAULT_LOCALE: '${DEFAULT_LOCALE:-en}'
  TRUSTED_PROXIES: '${TRUSTED_PROXIES:-REMOTE_ADDR}'
  APP_RUNTIME: '${APP_RUNTIME:-Symfony\Component\Runtime\SymfonyRuntime}'
  # THE CAPABILITY ASSERTIONS, WHICH RAN NOWHERE UNTIL ROUND 3. `infra/.env` has set this to 1 since the tier landed,
  # with a comment saying "TRUE for the containerised stack" — but it was absent from this anchor, from every
  # Dockerfile and from the entrypoint, so it was only a compose INTERPOLATION variable and never entered a container.
  # With it unset, `api/.env`'s 0 won, and `assertConnectionCannotCreateTemporaryObjects()` and
  # `assertConnectionCannotCreateLargeObjects()` — whose docblock says "this is the only place they can run at all" —
  # ran in no place at all.
  #
  # It could not simply be plumbed: `infra/database/init/10-roles.sh` performed no large-object revocation, so the
  # assertion would have refused every connection on a database provisioned exactly as we provision it. That
  # revocation landed in the same change as this line.
  TWES_ASSERT_REVOKED_CAPABILITIES: '${TWES_ASSERT_REVOKED_CAPABILITIES:-1}'
  # THE FORGEABLE-TENANCY KNOB, WIRED 2026-08-23 (round 4, R4S-1) — and it was `R3S-4`'s exact shape, on the line
  # immediately below the one R3S-4 fixed, in the same file. `infra/.env` has carried `TWES_TRUST_TENANT_HEADER=0`
  # since the tier landed, with a comment calling it one of "three independent controls"; it was absent from this
  # anchor, from every Dockerfile and from the entrypoint, so it was a compose INTERPOLATION variable that never
  # entered a container and `api/.env`'s `0` decided by accident. Three of three was two of three.
  #
  # **A LITERAL `0`, NOT `${TWES_TRUST_TENANT_HEADER:-0}`, and that is deliberate on two counts.** The obvious
  # spelling — matching the line above — is REFUSED by `scripts/gates/no-forgeable-tenancy-in-production.sh`
  # [Verified 2026-08-23: `violations=1`], because that gate's polarity rewrite requires an assignment to carry the
  # single permitted value rather than merely avoid `1`, and a value assembled from two files is exactly what it
  # exists to close. And the refusal is right: an interpolation here would make `infra/.env` AUTHORITATIVE, so an
  # operator editing the deployment's own dotenv would silently switch on a header that lets any caller act as any
  # tenant. There is no legitimate deployment where this varies before Wave 7 writes authentication, so it does not
  # interpolate. Deleted in Wave 7 with the resolver.
  TWES_TRUST_TENANT_HEADER: '0'

x-api-depends: &api-depends
  database:
    condition: service_healthy
  valkey:
    condition: service_healthy

services:
  # ------------------------------------------------------------------------------------------------------------
  # PostgreSQL. Tenancy is row-level security, so this is not a swappable component.
  # ------------------------------------------------------------------------------------------------------------
  database:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-twes}'
      POSTGRES_USER: '${POSTGRES_USER:-postgres}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}'
      # `scram-sha-256` explicitly. The image would default to it, but stating it means a future base-image change
      # cannot quietly downgrade to md5, which is broken.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      # Consumed by the init script below, which creates the owner/runtime split. Neither is defaulted there: a
      # default password for the role that reads tenant data is a published credential.
      TWES_DB_RUNTIME_ROLE: '${TWES_DB_RUNTIME_ROLE:-twes}'
      TWES_DB_RUNTIME_PASSWORD: '${TWES_DB_RUNTIME_PASSWORD:?TWES_DB_RUNTIME_PASSWORD must be set}'
      TWES_DB_OWNER_ROLE: '${TWES_DB_OWNER_ROLE:-twes_owner}'
      TWES_DB_OWNER_PASSWORD: '${TWES_DB_OWNER_PASSWORD:?TWES_DB_OWNER_PASSWORD must be set}'
    volumes:
      # `/var/lib/postgresql` — the PARENT, not `/var/lib/postgresql/data`. This is a PostgreSQL 18 change and it is
      # not cosmetic: from 18 the official image stores data in a MAJOR-VERSION-SPECIFIC subdirectory
      # (`/var/lib/postgresql/18/docker`) so that `pg_upgrade --link` can run without crossing a mount boundary, and
      # it REFUSES TO START when it finds a volume at the old path:
      #
      #   Error: in 18+, these Docker images are configured to store database data in a format which is compatible
      #   with "pg_ctlcluster" ... there appears to be PostgreSQL data in: /var/lib/postgresql/data (unused
      #   mount/volume) ... The suggested container configuration for 18+ is to place a single mount at
      #   /var/lib/postgresql
      #
      # [Verified: with the mount at `/var/lib/postgresql/data` the container exits with that message and every
      # dependent service fails with `dependency failed to start: container twes-in-database-1 is unhealthy`, so the
      # whole stack could never come up.] Mounting the parent is what the image itself prescribes, and it is also
      # what keeps a future major-version upgrade a `pg_upgrade` rather than a dump-and-restore.
      - database-data:/var/lib/postgresql
      # First-boot provisioning: the owner/runtime role split and the default privileges the migration relies on.
      # Read-only, because the container has no business modifying its own provisioning.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` against the real database and user, not just the port. A listening socket during initdb would
      # otherwise satisfy a port check and let the API start against a cluster that has no roles yet.
      test: ['CMD-SHELL', 'pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-twes}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    # NOT PUBLISHED. The database is reachable only on the internal network; the dev overlay publishes it
    # deliberately for a local client, which is a decision that belongs in dev and nowhere else.
    networks: [internal]

  # ------------------------------------------------------------------------------------------------------------
  # VALKEY, not Redis — and this is a LICENSING decision, not a preference.
  #
  # Redis relicensed in 2024 to RSALv2/SSPLv1. Neither is permissive, and SSPL specifically bites offering the
  # software as a service, which is exactly the commercial branch twes-in is licensed for. Valkey is the Linux
  # Foundation fork of Redis 7.2.4 under BSD-3-Clause — same protocol, same clients, and on the permitted list in
  # licensing invariant 8(a). Using Redis here would have needed a developer ruling; Valkey needs none.
  # ------------------------------------------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:9.1.1-alpine3.24
    command:
      - valkey-server
      # No RDB snapshots and no AOF. Everything here is a QUEUE and a LOCK, both of which are reconstructible:
      # Messenger's failure transport is the durable store, and persisting a lock would resurrect a stale one
      # across a restart, which is worse than losing it.
      - --save
      - ''
      - --appendonly
      - 'no'
      # Bounded memory with an explicit eviction policy. Unbounded, a queue backlog becomes an OOM kill of the
      # whole container; `allkeys-lru` is wrong for a queue, so `noeviction` makes a full queue fail loudly at the
      # producer instead of silently dropping messages.
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  # ------------------------------------------------------------------------------------------------------------
  # MIGRATIONS — a one-shot container with the OWNER credential, run before the API serves.
  #
  # This is the only place the owning role's password exists, and that is the entire point of the role split. A
  # serving replica must never hold it: `FORCE ROW LEVEL SECURITY` stops an owner SKIPPING policies, not REMOVING
  # them, so an owner credential in a web container is one statement from every tenant's data.
  #
  # It is also why the API entrypoint does not migrate. With more than one replica, N containers starting together
  # would migrate concurrently, and Doctrine takes no cross-process lock — a race whose outcome is a half-applied
  # schema.
  # ------------------------------------------------------------------------------------------------------------
  migrate:
    <<: *api-image
    environment:
      <<: *api-environment
      DATABASE_URL_OWNER: postgresql://${TWES_DB_OWNER_ROLE:-twes_owner}:${TWES_DB_OWNER_PASSWORD:?TWES_DB_OWNER_PASSWORD must be set}@database:5432/${POSTGRES_DB:-twes}?serverVersion=18&charset=utf8
      # The entrypoint refuses an owner credential unless a container declares itself the migrator. This is that
      # declaration, and it exists so the refusal is opt-OUT rather than advisory.
      TWES_ALLOW_OWNER_CREDENTIAL: '1'
      TWES_SKIP_MIGRATION_CHECK: '1'
    # `--all-or-nothing` so a failing migration leaves the schema untouched rather than half-applied. The tenant
    # tables carry RLS statements, and a half-applied migration is how an unpoliced tenant table gets created.
    command: ['php', 'bin/console', 'doctrine:migrations:migrate', '--no-interaction', '--all-or-nothing']
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  # ------------------------------------------------------------------------------------------------------------
  # THE API — FrankenPHP. Serves /api, /health, /admin and /app.
  # ------------------------------------------------------------------------------------------------------------
  api:
    <<: *api-image
    environment:
      <<: *api-environment
      SERVER_NAME: '${SERVER_NAME:-:80}'
    depends_on:
      <<: *api-depends
      migrate:
        # The API waits for migrations to COMPLETE SUCCESSFULLY. Without this the first request can hit a schema
        # that does not exist yet, and the entrypoint's own up-to-date check would crash-loop the container instead
        # of waiting — noisy, and it makes a normal cold start look like a failure.
        condition: service_completed_successfully
    volumes:
      # The front-end bundles, built by their own stages and mounted read-only. Read-only matters: a compromised
      # PHP process must not be able to rewrite the JavaScript every admin user then executes.
      - admin-bundle:/srv/admin:ro
      - flutter-bundle:/srv/flutter:ro
    healthcheck:
      # LIVENESS, never readiness — see the Dockerfile. Docker restarts an unhealthy container, and pointing this
      # at readiness would turn a brief database blip into a restart storm across every replica.
      test: ['CMD-SHELL', 'curl -fsS --max-time 2 http://127.0.0.1:80/health || exit 1']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [internal, edge]

  # ------------------------------------------------------------------------------------------------------------
  # THE QUEUE WORKER — Symfony Messenger.
  #
  # HONEST STATE: Messenger is installed and configured, and NOTHING DISPATCHES A MESSAGE YET. This service is
  # here because the developer asked for the full topology, and because a worker added later tends to be added
  # wrong. It is not idle-by-oversight: `infra/README.md` records which wave gives it work (Wave 10), and the
  # `--limit`/`--memory-limit` flags below are what stop a long-lived PHP process leaking until it is OOM-killed.
  # ------------------------------------------------------------------------------------------------------------
  worker:
    <<: *api-image
    environment:
      <<: *api-environment
    command:
      - php
      - bin/console
      - messenger:consume
      - async
      - '--time-limit=3600'
      - '--memory-limit=192M'
      # A failed message is retried and then parked, never dropped: the failure transport is the durable record.
      - '--failure-limit=10'
      - '-vv'
    depends_on:
      <<: *api-depends
      migrate:
        condition: service_completed_successfully
    # `stop_grace_period` longer than the default 10s so a message in flight can finish. Messenger stops
    # gracefully on SIGTERM; killing it mid-handler is what produces a half-processed document.
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [internal]

  # ------------------------------------------------------------------------------------------------------------
  # THE SCHEDULER — Symfony Scheduler, for recurring work (recurring invoices, reminders, retention sweeps).
  #
  # Same honest state as the worker: wired, with nothing scheduled yet. ONE replica only, and that is not a
  # convenience — two schedulers issue every recurring invoice twice, which in a billing product means charging a
  # customer twice. `symfony/lock` is installed against a Valkey store so the constraint survives a future
  # multi-host deploy rather than depending on this file.
  # ------------------------------------------------------------------------------------------------------------
  scheduler:
    <<: *api-image
    environment:
      <<: *api-environment
    command:
      - php
      - bin/console
      - messenger:consume
      - scheduler_default
      - '--time-limit=3600'
      - '--memory-limit=192M'
      - '-vv'
    depends_on:
      <<: *api-depends
      migrate:
        condition: service_completed_successfully
    # SINGLE INSTANCE. Two of these double-bill. Stated as configuration rather than as a comment alone.
    deploy:
      replicas: 1
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [internal]

  # ------------------------------------------------------------------------------------------------------------
  # GOTENBERG — HTML/URL to PDF, for Wave 4's document rendering.
  #
  # Chosen over running headless Chrome inside the API image for two reasons. Security: a browser is a large
  # attack surface and it would then share a container with the credential that reads tenant data. And blast
  # radius: a renderer that crashes takes down only rendering, not the API.
  #
  # Apache-2.0, so it satisfies licensing invariant 8(a). No work reaches it until Wave 4 -- see infra/README.md.
  # ------------------------------------------------------------------------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8.35.0-libreoffice
    command:
      - gotenberg
      # NO NETWORK ACCESS FROM THE RENDERER. A PDF template that can fetch a URL is a server-side request forgery
      # primitive pointed at the internal network — and this container sits on the same network as the database.
      # Templates render from posted HTML and vendored assets only.
      #
      # **`--chromium-deny-list=.*` WAS HERE UNTIL 2026-08-05 AND IT REFUSED EVERY CONVERSION, INCLUDING THE LOCAL
      # ONES.** Gotenberg applies the two lists as a CONJUNCTION and a deny match is ABSOLUTE, so the allow-list below
      # could never override `.*` — the renderer was configured to render nothing at all. Wave 4's PDF pipeline would
      # have landed on a service that cannot produce a document. [Verified: with both flags, a local
      # `/forms/chromium/convert/html` of a trivial `index.html` returned nothing usable; with only the allow-list it
      # returns `200` and a body starting `%PDF-`.]
      #
      # THE ALLOW-LIST ALONE IS THE WHOLE CONTROL, and that is verified rather than assumed — the point of removing a
      # security flag is worthless if the property goes with it:
      #   - converting a URL is REFUSED: `POST /forms/chromium/convert/url` with `http://srv:8000/` returns
      #     `403 Forbidden`, because an `http://` URL is not in the allow-list.
      #   - a LOCAL template that EMBEDS a remote resource still renders (`200`, `%PDF-`) and **the remote server is
      #     never contacted** — verified against a listener on the same docker network, whose log stayed empty.
      # So local rendering works, egress does not happen, and the failure mode is a blocked subresource rather than a
      # refused document.
      #
      # Gotenberg's own DEFAULT deny-list — which denies `file://` outside `/tmp` — is left in force by not naming the
      # flag at all, so path traversal off the temp directory is still covered by the tool's own rule.
      #
      # `compose-config.sh` asserts this shape, because "the flag that was supposed to harden it disabled it" is not a
      # mistake worth being able to make twice.
      - --chromium-allow-list=^file:///tmp/.*
      # Bounded: an unbounded render is how one malformed document occupies the renderer indefinitely.
      - --chromium-max-queue-size=20
      - --api-timeout=30s
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '2', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    # `internal` only, and never `edge`: nothing outside the stack may post HTML to the renderer.
    networks: [internal]

  # ------------------------------------------------------------------------------------------------------------
  # FRONT-END BUILDERS. One-shot containers that populate the bundle volumes the API serves.
  #
  # BOTH ARE BEHIND THE `build` PROFILE, which is not tidiness — without it `docker compose up` starts them like
  # any other service, and the Flutter stage downloads a ~1 GB SDK and runs `flutter precache` before the stack is
  # usable. There is no official Flutter image, so that cost is inherent; making it OPT-IN is what keeps `make up`
  # a couple of minutes instead of fifteen. `docker compose run` enables a service's own profiles automatically,
  # so `make build-front` needs no extra flag.
  #
  # The consequence is honest and stated in infra/README.md: until `make build-front` has run, `/admin/` and
  # `/app/` return 404 rather than a broken page.
  # ------------------------------------------------------------------------------------------------------------
  admin-build:
    profiles: ['build']
    build:
      context: ..
      dockerfile: infra/admin/Dockerfile
      target: build
      # DEV OR PROD BUNDLE, from one Dockerfile. `make build-front` sets this to `development`;
      # `make build-front-dev` passes `development`, which keeps source maps so a browser stack trace names our file
      # and line instead of `main-4f2a91.js:1:88231`. There is no security delta between the two bundles — only
      # optimisation — which is why an argument is right here where the API tier needed a separate image for Xdebug.
      args:
        NG_CONFIGURATION: '${NG_CONFIGURATION:-production}'
        # MUST match the path the Caddyfile serves this bundle at (`handle_path /admin/*`). A mismatch is a blank
        # page with a 200 status — see the Dockerfile.
        NG_BASE_HREF: '${NG_BASE_HREF:-/admin/}'
    # THE TAG CARRIES THE CONFIGURATION. Without this a dev bundle and a prod bundle share one tag, so `make
    # build-front` after `make build-front-dev` is a cache hit that silently serves the unminified bundle with source
    # maps — shipping our TypeScript. Distinct tags make the two artefacts distinguishable, which is the same
    # reasoning as `twes-in/api:dev-local`.
    image: twes-in/admin-build:${NG_CONFIGURATION:-production}-${TWES_VERSION:-prod}
    # Copies the built bundle into the shared volume. `sh -c` with an explicit clear first, so a stale bundle from
    # a previous version cannot survive alongside the new one and be served by hash.
    command: ['sh', '-c', 'rm -rf /out/* && cp -a /build/dist/admin/browser/. /out/']
    volumes:
      - admin-bundle:/out
    restart: 'no'
    networks: [internal]

  flutter-build:
    profiles: ['build']
    build:
      context: ..
      dockerfile: infra/mobile/Dockerfile
      target: build
      # `release` for a shipped bundle, `profile` for a debuggable one. NOT `debug`: Flutter's web debug build uses
      # DDC rather than dart2js and so can behave differently from what ships.
      args:
        FLUTTER_BUILD_MODE: '${FLUTTER_BUILD_MODE:-release}'
        # Must match `handle_path /app/*` in the Caddyfile.
        FLUTTER_BASE_HREF: '${FLUTTER_BASE_HREF:-/app/}'
    image: twes-in/flutter-build:${FLUTTER_BUILD_MODE:-release}-${TWES_VERSION:-prod}
    command: ['sh', '-c', 'rm -rf /out/* && cp -a /build/build/web/. /out/']
    volumes:
      - flutter-bundle:/out
    restart: 'no'
    networks: [internal]

# --------------------------------------------------------------------------------------------------------------
# NETWORKS. Two, so that "reachable from outside" is a property a service must be granted rather than inherit.
# --------------------------------------------------------------------------------------------------------------
networks:
  # Everything talks here. `internal: true` means no route to the outside world at all — so a compromised worker
  # cannot exfiltrate over the network, and the renderer cannot be used to reach the internet.
  internal:
    internal: true
  # Only the API is on this one. It is the single ingress point for the whole stack.
  edge:
    driver: bridge

volumes:
  database-data:
  admin-bundle:
  flutter-bundle:
