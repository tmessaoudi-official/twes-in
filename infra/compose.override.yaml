# ==============================================================================================================
# DEVELOPMENT overlay. AUTO-LOADED by `docker compose` because of its name.
#
# Everything here trades production hardening for a usable local loop, and each trade is named. Nothing in this
# file should ever be applied to a deployment: it publishes the database, mounts the source tree over the image,
# relaxes OPcache so an edit is visible without a rebuild, and builds an image CONTAINING A DEBUGGER.
#
# THE GOVERNING DISTINCTION (developer instruction, 2026-08-04): *"dev should be an easy env to debug and test and
# prod should be very optimized and closed and secure"*. So dev optimises the DEVELOPER'S LOOP and prod optimises
# THE REQUEST, and where the two want different things they get different artefacts rather than one artefact with a
# flag — because a shared artefact is how a dev convenience reaches production. See
# `docs/plans/dev-prod-separation.plan.md`.
# ==============================================================================================================

# --------------------------------------------------------------------------------------------------------------
# The dev PHP image, shared by all four PHP services.
#
# A DIFFERENT BUILD TARGET, not the production image with flags flipped, and the decisive reason is Xdebug: a
# debugger in a production image is a remote-code-execution amplifier — `xdebug.mode` is settable from any `.ini` a
# compromised process can write, and Xdebug can be told to connect OUT to an attacker's host — so the only safe way
# not to have it there is not to build it there.
#
# A DISTINCT TAG for the same reason. Sharing `twes-in/api:${TWES_VERSION}` between the two targets is how somebody
# eventually deploys the image with the debugger in it, because the tag would not tell them apart.
#
# `extra_hosts` IS REQUIRED ON LINUX AND ITS ABSENCE IS SILENT. `xdebug.client_host=host.docker.internal` is what
# Xdebug dials back to. Docker Desktop supplies that name on macOS and Windows; on Linux NOTHING does unless it is
# mapped to the host gateway here. Without it the name does not resolve, no connection is attempted, no error is
# raised, and a breakpoint simply never hits — the most common cause of "Xdebug does not work in Docker".
# --------------------------------------------------------------------------------------------------------------
x-api-dev: &api-dev
  build:
    target: dev
    # THE HOST DEVELOPER'S OWN ids, so files the container creates in the bind-mounted `api/` tree are owned by the
    # person running it. The Makefile exports the real `id -u`/`id -g`; 1000 is the fallback for a direct
    # `docker compose` invocation. See the `dev` stage in infra/api/Dockerfile for the two failure modes this avoids.
    args:
      TWES_UID: '${TWES_UID:-1000}'
      TWES_GID: '${TWES_GID:-1000}'
  image: twes-in/api:dev-local
  extra_hosts:
    - 'host.docker.internal:host-gateway'

x-api-dev-environment: &api-dev-environment
  APP_ENV: dev
  APP_DEBUG: '1'
  # OFF unless asked for: `make debug-on` / `make debug-off`. `xdebug.mode=debug` costs roughly 2-5x on EVERY
  # request even with no IDE attached, so an always-on debugger is one a developer disables on the second day and
  # never re-enables. See infra/api/conf.d-dev/60-xdebug.ini.
  XDEBUG_MODE: '${XDEBUG_MODE:-off}'
  # The trigger secret. An EMPTY `xdebug.trigger_value` means any value of `XDEBUG_TRIGGER` arms a session, so any
  # page the developer visits can open a debugger into this container while `make debug-on` is in force. Set
  # `TWES_XDEBUG_TRIGGER` in `infra/.env.local` to something private to this machine.
  TWES_XDEBUG_TRIGGER: '${TWES_XDEBUG_TRIGGER:-twes-local-trigger}'
  # 120 normally, 0 while `make debug-on` is in force so a held breakpoint is not killed mid-inspection.
  TWES_MAX_EXECUTION_TIME: '${TWES_MAX_EXECUTION_TIME:-120}'

# --------------------------------------------------------------------------------------------------------------
# The dev source mounts, shared by all four PHP services.
#
# THE WHOLE `api/` TREE, READ-WRITE, INCLUDING `vendor/`. This replaced five read-only per-directory mounts on
# 2026-08-04, in answer to *"developing and debugging with an ide should work flawlessly"*.
#
# The old arrangement mounted `src`, `config`, `public`, `migrations` and `templates` individually and deliberately
# left `vendor/` as the image built it, reasoning that a host vendor tree would mean "the container runs whatever
# PHP version resolved on the host". That reasoning is right about the INSTALL and wrong about the MOUNT, and the
# cost was the entire IDE experience: `api/vendor` does not exist on the host at all, so nothing resolves
# `Symfony\...` or `Doctrine\...`, autocomplete is dead, and a breakpoint in a vendor frame has no file for the IDE
# to open — execution appears to step into nothing.
#
# The divergence objection is answered by WHERE THE INSTALL RUNS, not by hiding the directory: `make install` runs
# Composer INSIDE this container, so the container's PHP resolves the platform requirements and the host merely
# holds the resulting bytes for an IDE to read.
#
# NOT A NAMED VOLUME — which is what "vendor in a volume" would literally mean, and which cannot achieve the goal:
# an IDE indexes the project directory on the host, and a named volume lives in root-owned
# `/var/lib/docker/volumes/` where no IDE will ever look.
#
# READ-WRITE rather than `:ro`, because Composer, `bin/console make:*` and the framework all write here.
# --------------------------------------------------------------------------------------------------------------
x-api-dev-volumes: &api-dev-volumes
  - ../api:/app
  # `docs/spec/` READ-ONLY, because the test suite reaches OUTSIDE `api/` for it. `DocumentTotalsTest` and
  # `PricingVectorsTest` load `__DIR__ . '/../../../../docs/spec/pricing-vectors.json'` — the CROSS-TIER VAT vectors
  # that CLAUDE.md names as what stops Angular and Flutter each inventing a third rounding rule. With only `api/`
  # mounted the file does not exist in the container and both classes error out, so `make test` could not pass.
  # [Verified: `file_get_contents(... /docs/spec/pricing-vectors.json): Failed to open stream`.] Read-only: tests
  # consume these vectors, they never write them.
  - ../docs/spec:/docs/spec:ro
  # `var/` LAYERED BACK OVER the bind mount, so cache and log stay CONTAINER-SIDE. This is the one thing that
  # genuinely wants a named volume rather than a host directory: it is regenerated on demand, it is large, and on a
  # bind mount it litters the developer's working tree with files owned by the container's uid.
  #
  # THE NESTING DECIDES, NOT THE LIST ORDER. This previously said "a later mount wins over an earlier one, which is why
  # the order here matters", and that mechanism is wrong: Docker sorts mounts by DESTINATION PATH DEPTH, so `/app/var`
  # is applied after `/app` however the two are ordered. [Verified: with the volume listed FIRST and the bind mount
  # second — the reverse of the order below — the volume still wins.] Reordering these lines changes nothing.
  - api-dev-var:/app/var
  # The dev OPcache overlay, ALSO baked into the dev image — mounted as well so it can be tuned without a rebuild.
  #
  # MOUNTED AS A FILE, ENDING IN `.ini`. It was mounted as a DIRECTORY (`conf.d/dev` at `conf.d/zz-dev`) until
  # 2026-08-04 and PHP never read a byte of it: the scan directory is matched on the `.ini` suffix and is NOT walked
  # recursively. Every setting in the overlay was inert, so the source mount could not hot-reload and errors were
  # not displayed. `zz-` sorts it after `10-`/`20-`; PHP reads the directory in filename order.
  - ./api/conf.d-dev/50-dev.ini:/usr/local/etc/php/conf.d/zz-50-dev.ini:ro
  - ./api/conf.d-dev/60-xdebug.ini:/usr/local/etc/php/conf.d/zz-60-xdebug.ini:ro

services:
  database:
    # PUBLISHED, so a local `psql`, a GUI client and the test suites on the host can reach it. Bound to 127.0.0.1
    # explicitly rather than `5432:5432` — the short form binds 0.0.0.0 and would expose the database to the local
    # network, which on a laptop on a café wifi is a real exposure rather than a theoretical one.
    #
    # NOTE it collides with a PostgreSQL already running on the host, including the cluster the integration suite
    # provisions. Set `DATABASE_PORT=5433` in `infra/.env.local` to run both at once.
    ports:
      - '127.0.0.1:${DATABASE_PORT:-5432}:5432'

  valkey:
    ports:
      - '127.0.0.1:${VALKEY_PORT:-6379}:6379'

  api:
    <<: *api-dev
    environment:
      <<: *api-dev-environment
      # `SERVER_NAME` without a scheme keeps FrankenPHP on plain HTTP locally. With a hostname it would try to
      # obtain a certificate, and ACME against `localhost` fails in a way that reads like the container being broken.
      SERVER_NAME: '${SERVER_NAME:-:80}'
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    volumes: *api-dev-volumes
    # The migration gate is kept ON in dev deliberately: it is the same check production runs, and a local
    # environment that skips it is a local environment that cannot reproduce a deploy failure.

  worker:
    <<: *api-dev
    environment: *api-dev-environment
    volumes: *api-dev-volumes

  scheduler:
    <<: *api-dev
    environment: *api-dev-environment
    volumes: *api-dev-volumes

  migrate:
    <<: *api-dev
    environment: *api-dev-environment
    volumes: *api-dev-volumes

volumes:
  api-dev-var:
