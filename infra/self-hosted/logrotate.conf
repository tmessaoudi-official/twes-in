# twes-in API logs on a host without containers (docs/SPEC.md § 7, 2026-09-17). With LOG_DIRECTORY set, production
# writes one JSON file per channel there: request.log, security.log, doctrine.log, realtime.log, mailer.log,
# deprecation.log, php.log, app.log and any other channel that logs. Install this file as /etc/logrotate.d/twes-in
# and change the path below to that directory.
#
# copytruncate, not a rename: the API's long-running PHP workers keep each log file open, and would go on writing to
# the renamed file. Truncating in place loses at most the lines written during the copy.
/var/log/twes-in/*.log {
    daily
    rotate 14
    maxsize 100M
    dateext
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
