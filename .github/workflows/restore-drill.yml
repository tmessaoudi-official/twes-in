# The restore drill (scripts/backup/restore-drill.sh, docs/START.md § 13): a backup nobody restored is a hope, not a
# backup. Weekly, so drift in an image, a package or the bucket's protocol shows within a week; by hand; and on any push
# that changes how backups are made (docs/SPEC.md § 7, 2026-10-12). Not one of ci.yml's required checks: it does not
# run on every push.
name: restore-drill

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - compose.prod.yaml
      - compose.backup.yaml
      - compose.backup-bucket.yaml
      - compose.backup-local.yaml
      - compose.backup-offsite.yaml
      - infra/postgres/**
      - scripts/backup/**
      - .github/workflows/restore-drill.yml

# Every job reads the checkout and nothing more (security map F9: the default token's rights depend on a repository setting).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The images are built as the version git says each part is, which counts the day's changes.
        with:
          fetch-depth: 0
      - run: bash scripts/build-version.sh --env >> "$GITHUB_ENV"
      - run: make backup-drill
      - run: make backup-drill DRILL=local
