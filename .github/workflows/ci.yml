# twes-in CI. Four jobs, each with the reason it exists; "done" in docs/SPEC.md § 5 means all four are green.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHY: one copyleft or unlicensed package in a lock file kills the commercial licence, and nothing else
  # checks it. Also runs the gates' own tests, so a gate that stopped detecting cannot stay green.
  # executable-bits is here too: a core.fileMode=false clone stages every script as 100644, which works on
  # the developer's disk and failed this job's sibling with "bin/console: Permission denied" (run 1).
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: bash scripts/gates/tests/dependency-licences.test.sh
      - run: bash scripts/gates/tests/spdx-headers.test.sh
      - run: bash scripts/gates/tests/executable-bits.test.sh
      - run: bash scripts/gates/tests/icon-buttons-named.test.sh
      - run: bash scripts/gates/tests/outcomes-as-toasts.test.sh
      - run: bash scripts/gates/tests/compose-log-rotation.test.sh
      - run: bash scripts/gates/tests/version-pins.test.sh
      - run: bash scripts/gates/tests/design-tokens.test.sh
      - run: bash scripts/gates/tests/permission-labels.test.sh
      - run: bash scripts/gates/tests/planned-module-labels.test.sh
      - run: bash scripts/gates/tests/setting-labels.test.sh
      - run: bash scripts/gates/tests/presentation-settings-parity.test.sh
      - run: bash scripts/gates/tests/tour-anchors.test.sh
      # The self-hosted logrotate configuration, rotated for real (docs/SPEC.md § 7, 2026-09-17).
      - run: command -v logrotate || (sudo apt-get update && sudo apt-get install -y logrotate)
      - run: bash infra/self-hosted/tests/logrotate.test.sh
      - run: php scripts/gates/dependency-licences.php
      - run: bash scripts/gates/spdx-headers.sh
      - run: bash scripts/gates/executable-bits.sh
      - run: bash scripts/gates/icon-buttons-named.sh
      - run: bash scripts/gates/outcomes-as-toasts.sh
      - run: bash scripts/gates/compose-log-rotation.sh
      # Every copy of a version pin agrees: a bump that moves one copy builds one thing and tests another (docs/UPDATE.md).
      - run: bash scripts/gates/version-pins.sh
      - run: bash scripts/gates/design-tokens.sh
      # Every permission a role may be given has a label a person can read, in both languages (row 104).
      - run: bash scripts/gates/permission-labels.sh
      - run: bash scripts/gates/planned-module-labels.sh
      - run: bash scripts/gates/setting-labels.sh
      # A preference the SPA writes but the API never declares is silently lost on reload (docs/SPEC.md § 7, 2026-09-22).
      - run: bash scripts/gates/presentation-settings-parity.sh
      - run: bash scripts/gates/tour-anchors.sh

  # WHY: the API tier's gate — code style, PHPStan at level max, PHPUnit against a REAL PostgreSQL 18,
  # because money and tenancy bugs live in SQL and a mocked database cannot show them.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: twes_test
          POSTGRES_USER: twes
          POSTGRES_PASSWORD: twes
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U twes -d twes_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: "postgresql://twes:twes@127.0.0.1:5433/twes?serverVersion=18&charset=utf8"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, zip, opcache, bcmath
          ini-values: date.timezone=UTC
          coverage: none
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer gate
      # The OpenAPI document is the contract the web job generates its TypeScript types from.
      - run: bin/console api:openapi:export --output=var/openapi.json
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: api/var/openapi.json
          retention-days: 7

  # WHY: lint, formatting, the component tests, and the production build the web image is made from. Needs
  # the api job's OpenAPI artifact: the gate starts by generating the TypeScript types from it.
  web:
    runs-on: ubuntu-latest
    needs: [api]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: openapi
          path: api/var
      - run: npm ci --no-audit --no-fund
      - run: npm run gate

  # WHY: the parts passing says nothing about the whole. This boots the compose stack (nginx → FrankenPHP →
  # PostgreSQL) from the committed Dockerfiles and drives a real browser through it.
  # WHY sharded: the serial suite took 25 minutes on one runner and every push waited on it (docs/SPEC.md § 7,
  # 2026-09-25 22:16, row 136). Each shard is its own runner with its own compose stack and database, so the
  # scenarios stay serial within a shard and cannot see another shard's rows; the setup project that signs the
  # operator in runs in every shard (Playwright runs a project's dependencies wherever it is needed).
  e2e:
    runs-on: ubuntu-latest
    needs: [licences, api, web]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      # The api image migrates at start (infra/api/docker-entrypoint.sh) and --wait holds until it is healthy;
      # the seed is data, not schema, so it stays a step: the operator the scenarios sign in as.
      - run: docker compose up -d --build --wait
      # The operator must carry a second factor; the scenarios compute its codes from this known dev secret.
      - run: docker compose exec -T api bin/console app:seed --operator-password=twes-operator-dev --operator-totp-secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # WHY: --with-deps runs apt-get update over every source on the runner, and the preinstalled Google Chrome
      # source answered "Hash Sum mismatch" twice in a row on 2026-09-09 (run 34384052255 and its re-run),
      # failing the job before a test ran. Playwright brings its own Chromium; that source is never needed here.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test --shard=${{ matrix.shard }}/3
        working-directory: web
      - if: failure()
        run: docker compose logs --no-color
      # WHY: the dot reporter CI uses writes no HTML report, so web/playwright-report alone uploaded nothing and a
      # failure left no evidence (run 34797116869). test-results holds each failure's trace and error context.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
