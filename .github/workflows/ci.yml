# twes-in CI. Five jobs, each with the reason it exists; "done" in docs/SPEC.md § 5 means all five are green.
name: ci

on:
  push:
    branches: [master]
    # A push that touches only these runs nothing (docs/SPEC.md § 7, 2026-10-04 10:40). Not `docs/**`: the pricing
    # vectors under docs/spec are a test fixture, and START.md and UPDATE.md are read by the version-pin gate.
    paths-ignore:
      - docs/SPEC.md
      - docs/research/**
      - docs/plans/**
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHY: one copyleft or unlicensed package in a lock file kills the commercial licence, and nothing else
  # checks it. Also runs the gates' own tests, so a gate that stopped detecting cannot stay green.
  # executable-bits is here too: a core.fileMode=false clone stages every script as 100644, which works on
  # the developer's disk and failed this job's sibling with "bin/console: Permission denied" (run 1).
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Everything runs in the project's own containers (docs/SPEC.md § 7): the runner needs Docker and nothing else.
      # The Makefile hands the services the runner's uid and the checkout's path; docs/START.md § 1.
      - run: make gate-licences

  # WHY: the API tier's gate — code style, PHPStan at level max, PHPUnit against a REAL PostgreSQL 18,
  # because money and tenancy bugs live in SQL and a mocked database cannot show them.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Starts the compose postgres service and runs the gate in the tools image: the same PostgreSQL 18 and PHP 8.5 as
      # the stack, never the runner's.
      - run: make gate-api

  # WHY: lint, formatting, the component tests, and the production build the web image is made from. Needs
  # the api job's OpenAPI artifact: the gate starts by generating the TypeScript types from it.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The gate starts by generating the TypeScript types from the OpenAPI document, which `make gate-web` exports
      # itself, from the same tools image the api job uses, so the two jobs cannot read different contracts.
      - run: make gate-web

  # WHY: the production image (infra/api/Dockerfile, stage prod) is what a deployment runs, and nothing else here
  # builds it: e2e runs the development stage. Each thing it promises can go quietly, a stage left in dev mode, the
  # wrong ini, dev packages installed, a preload list never warmed, and every request would still be answered. This
  # boots the stack on it with secrets of its own and checks it from inside (scripts/gates/production-image.php).
  prod-image:
    runs-on: ubuntu-latest
    needs: [licences]
    env:
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
    steps:
      - uses: actions/checkout@v7
      # Production refuses the committed development keys, so this instance gets random ones.
      - run: |
          for name in APP_SECRET REALTIME_TOKEN_KEY REALTIME_API_KEY; do
            value=$(openssl rand -hex 24); echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          value=$(openssl rand -base64 32); echo "::add-mask::$value"; echo "APP_MFA_KEY=$value" >> "$GITHUB_ENV"
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T api php < scripts/gates/production-image.php
      # Through nginx, as a browser reaches it: the health answer, and a refusal answered as JSON, not a debug page.
      - run: curl -fsS http://localhost:8090/api/health | grep -q '"status":"ok"'
      - run: test "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' http://localhost:8090/api/auth/me)" = '401 application/json'
      - if: failure()
        run: docker compose logs --no-color

  # WHY: the parts passing says nothing about the whole. This boots the compose stack (nginx → FrankenPHP →
  # PostgreSQL) from the committed Dockerfiles and drives a real browser through it.
  # WHY sharded: the serial suite took 25 minutes on one runner and every push waited on it (docs/SPEC.md § 7,
  # 2026-09-25 22:16, row 136). Each shard is its own runner with its own compose stack and database, so the
  # scenarios stay serial within a shard and cannot see another shard's rows; the setup project that signs the
  # operator in runs in every shard (Playwright runs a project's dependencies wherever it is needed).
  e2e:
    runs-on: ubuntu-latest
    needs: [licences, api, web]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      # The api image migrates at start (infra/api/docker-entrypoint.sh) and --wait holds until it is healthy;
      # the seed is data, not schema, so it stays a step: the operator the scenarios sign in as.
      - run: docker compose up -d --build --wait
      # The operator must carry a second factor; the scenarios compute its codes from this known dev secret.
      - run: docker compose exec -T api bin/console app:seed --operator-password=twes-operator-dev --operator-totp-secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      # Playwright and its Chromium run in the web-tools container on the host's network (docs/START.md § 1), so
      # 127.0.0.1:8090 is the stack's published port, as on a developer's machine.
      - run: make e2e E2E_ARGS=--shard=${{ matrix.shard }}/3
      - if: failure()
        run: docker compose logs --no-color
      # WHY: the dot reporter CI uses writes no HTML report, so web/playwright-report alone uploaded nothing and a
      # failure left no evidence (run 34797116869). test-results holds each failure's trace and error context.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
