# twes-in CI. Five jobs, each with the reason it exists; "done" in docs/SPEC.md § 5 means all five are green.
name: ci

on:
  push:
    branches: [master]
    # A push that touches only these runs none of these jobs (docs/SPEC.md § 7, 2026-10-04 10:40); one touching
    # docs/SPEC.md still has its Decisions Log stamps checked, by decision-stamps.yml. Not `docs/**`: the pricing
    # vectors under docs/spec are a test fixture.
    paths-ignore:
      - docs/SPEC.md
      - docs/research/**
      - docs/plans/**
  pull_request:

# Every job reads the checkout and nothing more, but publish, which pushes the images and asks for packages: write
# itself (security map F9: the default token's rights depend on a repository setting).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHY: one copyleft or unlicensed package in a lock file kills the commercial licence, and nothing else
  # checks it; nor does anything else read a dependency's published vulnerabilities. Also runs the gates' own tests, so a gate that stopped detecting cannot stay green.
  # executable-bits is here too: a core.fileMode=false clone stages every script as 100644, which works on
  # the developer's disk and failed this job's sibling with "bin/console: Permission denied" (run 1).
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The whole history: decision-stamps compares each Decisions Log stamp with the commit that wrote it.
        with:
          fetch-depth: 0
      # Everything runs in the project's own containers (docs/SPEC.md § 7): the runner needs Docker and nothing else.
      # The Makefile hands the services the runner's uid and the checkout's path; docs/START.md § 1.
      # The Windows installer's check image installs PSScriptAnalyzer from PowerShell Gallery, which fails now and then
      # and held the publish back: it is built once per Dockerfile and kept in the cache, saved as soon as it is built.
      - id: ps-tools
        run: echo "image=$(make -s ps-tools-tag)" >> "$GITHUB_OUTPUT"
      - id: ps-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/ps-tools.tar
          key: ps-tools-${{ hashFiles('infra/powershell/Dockerfile') }}
      - if: steps.ps-tools-cache.outputs.cache-hit == 'true'
        run: docker load -i var/ps-tools.tar
      - if: steps.ps-tools-cache.outputs.cache-hit != 'true'
        run: make ps-tools-image && docker save -o var/ps-tools.tar "${{ steps.ps-tools.outputs.image }}"
      - if: steps.ps-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/ps-tools.tar
          key: ps-tools-${{ hashFiles('infra/powershell/Dockerfile') }}
      - run: make gate-licences
      # A dependency with a published vulnerability: the API's Composer packages and the web's production npm packages.
      # A new advisory can red a commit that changed nothing; that is the point, it is read the day it appears.
      - run: make audit

  # WHY: the API tier's gate — code style, PHPStan at level max, PHPUnit against a REAL PostgreSQL 18,
  # because money and tenancy bugs live in SQL and a mocked database cannot show them.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Starts the compose postgres service and runs the gate in the tools image: the same PostgreSQL 18 and PHP 8.5 as
      # the stack, never the runner's.
      - run: make gate-api

  # WHY: lint, formatting, the component tests, and the production build the web image is made from. Needs
  # the api job's OpenAPI artifact: the gate starts by generating the TypeScript types from it.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The gate starts by generating the TypeScript types from the OpenAPI document, which `make gate-web` exports
      # itself, from the same tools image the api job uses, so the two jobs cannot read different contracts.
      - run: make gate-web

  # WHY: the production image (infra/api/Dockerfile, stage prod) is what a deployment runs, and nothing else here
  # builds it: e2e runs the development stage. Each thing it promises can go quietly, a stage left in dev mode, the
  # wrong ini, dev packages installed, a preload list never warmed, and every request would still be answered. This
  # boots the stack on it with secrets of its own and checks it from inside (scripts/gates/production-image.php).
  prod-image:
    runs-on: ubuntu-latest
    needs: [licences]
    env:
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
    steps:
      # The images are built as the version git says each part is (scripts/build-version.sh), which counts the day's
      # changes: the whole history, not the one commit a checkout fetches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/build-version.sh --env >> "$GITHUB_ENV"
      # Production refuses the committed development keys, so this instance gets random ones.
      - run: |
          for name in APP_SECRET REALTIME_TOKEN_KEY REALTIME_API_KEY POSTGRES_PASSWORD POSTGRES_APP_PASSWORD; do
            value=$(openssl rand -hex 24); echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          value=$(openssl rand -base64 32); echo "::add-mask::$value"; echo "APP_MFA_KEY=$value" >> "$GITHUB_ENV"
          # Development's mail catcher, handed as the secret a relay's address would be.
          echo "MAILER_DSN=smtp://mailpit:1025" >> "$GITHUB_ENV"
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T api php < scripts/gates/production-image.php
      # The api reaches the database as the application's role, which the one-shot migrate service made and granted.
      - run: test "$(docker compose exec -T api bin/console dbal:run-sql --force-fetch 'SELECT current_user' | grep -c twes_app)" -ge 1
      - run: test "$(docker compose ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}' migrate)" = 'migrate exited 0'
      # Through nginx, as a browser reaches it: the health answer, and a refusal answered as JSON, not a debug page.
      - run: curl -fsS http://localhost:8090/api/health | grep -q '"status":"ok"'
      # The API says which build it is, and that it runs as production, which the footer then leaves unsaid.
      - run: curl -fsS http://localhost:8090/api/health | grep -q "\"version\":\"$API_BUILD_VERSION\""
      - run: curl -fsS http://localhost:8090/version.json | grep -q "\"version\":\"$WEB_BUILD_VERSION\""
      - run: test "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' http://localhost:8090/api/auth/me)" = '401 application/json'
      - if: failure()
        run: docker compose logs --no-color

  # WHY: the parts passing says nothing about the whole. This boots the compose stack (nginx → FrankenPHP →
  # PostgreSQL) from the committed Dockerfiles and drives a real browser through it.
  # WHY sharded: the serial suite took 25 minutes on one runner and every push waited on it (docs/SPEC.md § 7,
  # 2026-09-25 22:16, row 136). Each shard is its own runner with its own compose stack and database, so the
  # scenarios stay serial within a shard and cannot see another shard's rows; the setup project that signs the
  # operator in runs in every shard (Playwright runs a project's dependencies wherever it is needed).
  e2e:
    runs-on: ubuntu-latest
    needs: [licences, api, web]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # WHY: the shop's iPhones run Safari's engine, which sends no `Secure` cookie over plain http, so the @phone
    # scenarios run on WebKit through the stack's HTTPS door (the `lan` service), as `make up` starts it on a
    # developer's machine. The door is named by this runner's own address, the same three values the Makefile derives.
    env:
      COMPOSE_PROFILES: lan
      LAN_HOST: 127.0.0.1
      LAN_ORIGIN: https://127.0.0.1:8443
    steps:
      # The images are built as the version git says each part is (scripts/build-version.sh), which counts the day's
      # changes: the whole history, not the one commit a checkout fetches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/build-version.sh --env >> "$GITHUB_ENV"
      # The one-shot migrate service migrates before the api starts (infra/api/migrate.sh) and --wait holds until it is healthy;
      # the seed is data, not schema, so it stays a step: the operator the scenarios sign in as.
      - run: docker compose up -d --build --wait
      # The operator must carry a second factor; the scenarios compute its codes from this known dev secret.
      - run: docker compose exec -T api bin/console app:seed --operator-password=twes-operator-dev --operator-totp-secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      # A second one for the scenarios that sign in with a code: the first one's five in five minutes go to the proofs.
      - run: docker compose exec -T api bin/console app:seed --operator-email=codes@twes.local --operator-name='Operator Codes' --operator-password=twes-operator-dev --operator-totp-secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      # Playwright and its Chromium run in the web-tools container on the host's network (docs/START.md § 1), so
      # 127.0.0.1:8090 is the stack's published port, as on a developer's machine.
      - run: make e2e E2E_ARGS=--shard=${{ matrix.shard }}/3
      # WHY: a request once waited with no answer until its scenario timed out, and nothing said on what. A request
      # held on a lock is still waiting when the job fails, so every connection's state, what it waits on and who
      # blocks it, and the locks a request can hold across another's (the session's advisory lock, a row's
      # transaction) are read here, while the stack is up.
      - if: failure()
        run: >-
          docker compose exec -T postgres psql -U twes -d twes
          -c "SELECT a.pid, a.application_name, a.state, date_trunc('second', now() - a.state_change) AS since, a.wait_event_type, a.wait_event, pg_blocking_pids(a.pid) AS blocked_by, left(a.query, 100) AS last_query FROM pg_stat_activity a WHERE a.datname = current_database() AND a.pid <> pg_backend_pid() ORDER BY a.pid"
          -c "SELECT l.pid, l.locktype, l.mode, l.granted, l.relation::regclass AS relation FROM pg_locks l WHERE l.locktype IN ('advisory', 'transactionid', 'tuple') OR NOT l.granted ORDER BY l.pid"
      - if: failure()
        run: docker compose logs --no-color
      # WHY: the dot reporter CI uses writes no HTML report, so web/playwright-report alone uploaded nothing and a
      # failure left no evidence (run 34797116869). test-results holds each failure's trace and error context.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # Staging and production run the images published here, by their digests, never a build of their own checkout
  # (docs/START.md § 14, scripts/release/publish.sh): only once every other job is green, for master only, and only
  # while the repository variable PUBLISH_IMAGES is « true », which the developer sets after approving the first publish.
  publish:
    runs-on: ubuntu-latest
    needs: [licences, api, web, prod-image, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.PUBLISH_IMAGES == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: bash scripts/release/publish.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" release.env
      # What staging follows and a release tag records: the three images by their digests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: release.env
          retention-days: 90
