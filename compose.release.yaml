# Deploying by digest, over the five deployment files (docs/START.md § 14):
#   docker compose --env-file <values> -f compose.yaml -f compose.prod.yaml -f compose.backup.yaml -f compose.backup-bucket.yaml -f compose.deploy.yaml \
#     -f compose.release.yaml up -d --no-build --wait
# Every service that runs an image twes-in builds runs the one CI published instead, named by its digest, so what a
# server runs is byte for byte what staging ran, and nothing is built from the server's checkout. scripts/deploy/deploy.sh
# writes the three values; scripts/gates/release-overlay.sh holds every built service to them.
services:
  api:
    image: "${TWES_API_IMAGE:?set TWES_API_IMAGE, the api image by its digest}"
    build: !reset null
  worker:
    image: "${TWES_API_IMAGE:?set TWES_API_IMAGE, the api image by its digest}"
    build: !reset null
  migrate:
    image: "${TWES_API_IMAGE:?set TWES_API_IMAGE, the api image by its digest}"
    build: !reset null
  web:
    image: "${TWES_WEB_IMAGE:?set TWES_WEB_IMAGE, the web image by its digest}"
    build: !reset null
  postgres:
    image: "${TWES_DATABASE_IMAGE:?set TWES_DATABASE_IMAGE, the database image by its digest}"
    build: !reset null
  backup:
    image: "${TWES_DATABASE_IMAGE:?set TWES_DATABASE_IMAGE, the database image by its digest}"
  restore:
    image: "${TWES_DATABASE_IMAGE:?set TWES_DATABASE_IMAGE, the database image by its digest}"
