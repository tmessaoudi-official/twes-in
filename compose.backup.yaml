# Backups, over compose.yaml and compose.prod.yaml (docs/START.md § 13): what archives, never where to. A destination
# layer follows it, always:
#   compose.backup-bucket.yaml   a server's S3-compatible bucket (a deployment, the drill, the checks)
#   compose.backup-local.yaml    a shop's own folder (an installation on premises, docs/START.md § 16), which
#                                compose.backup-offsite.yaml copies to a bucket when it is switched on
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.backup.yaml -f compose.backup-bucket.yaml up -d --build --wait
# The database archives its WAL as it writes, so any moment of the last 14 days can be restored; the backup service
# takes the base backups it replays from, the nightly pg_dump and a copy of the files volume, each encrypted under a
# passphrase of the instance's own, handed as a compose secret (compose.prod.yaml says how): compose stops before
# starting anything while one is unset. pgBackRest reads its passphrase from the environment only, so the database and
# the backup service run through infra/postgres/twes-secrets, which twes-backup also re-runs through when started by
# `docker compose exec`; restic reads its own file through RESTIC_PASSWORD_FILE.
# scripts/backup/restore-drill.sh proves the whole round trip on these very files.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Kept apart from the server: without them no backup can be read.
x-database-passphrase: &database-passphrase
  source: backup_database_passphrase
  target: /run/secrets/pgbackrest_repo1_cipher_pass

services:
  postgres:
    restart: unless-stopped
    build:
      context: infra/postgres
    image: twes-in-postgres-backup
    # Every commit reaches the archive within archive_timeout even on a quiet day: what the ruled 15 minutes rest on.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=pgbackrest --stanza=twes archive-push %p
    # The archiving runs inside the server, which must hold the passphrase in its own environment.
    entrypoint: [twes-secrets, docker-entrypoint.sh]
    secrets:
      - *database-passphrase
    volumes:
      - pgbackrest-spool:/var/spool/pgbackrest
      # The backup service reaches the server through its socket, as the server's own user.
      - postgres-socket:/var/run/postgresql

  # The API's deep health (docs/START.md § 15) then fails while the server does not archive its write-ahead log.
  api:
    environment:
      BACKUP_EXPECTED: "1"

  backup:
    logging: *logging
    restart: unless-stopped
    # The secrets' digest, as compose.prod.yaml says why; the restore takes it through extends.
    labels:
      twes.secrets-digest: "${TWES_SECRETS_DIGEST:-}"
    image: twes-in-postgres-backup
    entrypoint: [twes-secrets, docker-entrypoint.sh]
    command: [twes-backup, run]
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - *database-passphrase
      - source: backup_files_passphrase
        target: /run/secrets/restic_password
    environment:
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      # Where each step's heartbeat goes (twes-backup); a deployment requires it and hands the token as a secret
      # (compose.deploy.yaml), the drill and a shop may have no monitor.
      MONITOR_URL: "${MONITOR_URL:-}"
      # How long a step may take before it is stopped and fails, in seconds, blank for twes-backup's own: four hours,
      # twelve for the off-site copy, whose first one sends the whole folder over the shop's upload.
      BACKUP_STEP_LIMIT: "${BACKUP_STEP_LIMIT:-}"
      BACKUP_OFFSITE_LIMIT: "${BACKUP_OFFSITE_LIMIT:-}"
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql:ro
      - postgres-socket:/var/run/postgresql
      - api-files:/files:ro
      - backup-dump:/var/lib/twes-backup/dump
      # How each step last ended and when it last worked: what a shop's schedule runs by and its twes tick alerts on.
      - backup-outcome:/var/lib/twes-backup/outcome

  # What a restore runs in (docs/START.md § 13), only when asked for: the backup service's image, keys and repositories,
  # writing the database's volume, which pgBackRest fills only when it is empty, and the files volume, which restic
  # overwrites. A destination layer names its repositories to it as to the backup service: `extends` is read within this
  # file, before any layer above it.
  restore:
    extends:
      service: backup
    profiles: [restore]
    restart: "no"
    command: []
    # The server stays down while its data is written.
    depends_on: !reset {}
    volumes: !override
      - postgres-data:/var/lib/postgresql
      - api-files:/files

volumes:
  pgbackrest-spool:
  postgres-socket:
  backup-dump:
  backup-outcome:

secrets:
  backup_database_passphrase:
    environment: BACKUP_DATABASE_PASSPHRASE
  backup_files_passphrase:
    environment: BACKUP_FILES_PASSPHRASE
