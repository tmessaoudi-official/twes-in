# The stack on the production API image (infra/api/Dockerfile, stage prod), over compose.yaml:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build --wait
# What CI's prod-image job boots, and how to measure the API as it will run. Not a deployment: that brings its own
# database, mail and addresses. Production refuses to start on the development keys compose.yaml defaults to
# (api/src/Shared/Infrastructure/DevelopmentKeys.php), so each secret comes from the environment compose is run in (a
# deployment's values file, CI's variables) and reaches its container as a compose secret, a file under /run/secrets,
# never as its environment, where `docker inspect` and `docker compose config` would show it (docs/SPEC.md § 7, Docker
# secrets). compose stops before starting anything when one is unset; scripts/deploy/deploy.sh refuses one left empty,
# which would mount nothing. The api image reads the files into its environment in every PHP process
# (api/src/Shared/Infrastructure/Secrets/ContainerSecrets.php), the database's addresses made from templates whose
# placeholders take their passwords; centrifugo through infra/postgres/twes-secrets, PostgreSQL through
# POSTGRES_PASSWORD_FILE. compose.yaml's development values are reset, and so is every variable the api image sets from
# a secret: FrankenPHP's workers read a variable the environment holds over what was set at boot, even an empty one.
# The production stack's MAILER_DSN, development's catcher, is a secret like a relay's. scripts/gates/secrets-overlay.sh
# holds it.
# Every service comes back by itself after a crash or a reboot, unless stopped on purpose
# (api/tests/Architecture/ProductionRestartTest.php).
# What every container of the api image is told. The variables a secret sets are reset in each service's own block, never
# here: Compose 2.38, CI's runners, drops a `!reset` reached through an alias or a merge, and the workers and migrate then
# kept the values CI exports for the secrets, which ContainerSecrets refuses (scripts/gates/secrets-overlay.sh holds it).
x-api-environment: &api-environment
  APP_ENV: prod
  DEPLOY_ENV: "${DEPLOY_ENV:-prod}"
  # The application's role, its password the secret postgres_app_password, which ContainerSecrets sets in it.
  DATABASE_URL_TEMPLATE: "postgresql://twes_app:{postgres_app_password}@postgres:5432/twes?serverVersion=18&charset=utf8"

# Every service mounting a secret carries the digest of the secrets' values, which scripts/deploy/deploy.sh hands
# compose: Compose keeps a running container whose secret's value alone changed, reading the old one, so a rotated key
# must change the service to reach it (scripts/gates/secrets-overlay.sh holds every such service to it).
x-secrets-digest: &secrets-digest
  twes.secrets-digest: "${TWES_SECRETS_DIGEST:-}"

services:
  api:
    labels: *secrets-digest
    restart: unless-stopped
    build:
      target: prod
    environment:
      <<: *api-environment
      APP_MFA_KEY: !reset null
      REALTIME_TOKEN_KEY: !reset null
      REALTIME_API_KEY: !reset null
      MAILER_DSN: !reset null
      DATABASE_URL: !reset null
    secrets: &api-secrets [app_secret, app_mfa_key, realtime_token_key, realtime_api_key, postgres_app_password, mailer_dsn]
  # The migrations, on the same production image: its kernel refuses to start without the same secrets. Left down once
  # it has run (api/tests/Architecture/ProductionRestartTest.php). It alone holds the owner's password, and gives the
  # application's role its own, which the api and the workers connect with.
  migrate:
    labels: *secrets-digest
    build:
      target: prod
    environment:
      <<: *api-environment
      APP_MFA_KEY: !reset null
      REALTIME_TOKEN_KEY: !reset null
      REALTIME_API_KEY: !reset null
      MAILER_DSN: !reset null
      DATABASE_URL: !reset null
      DATABASE_MIGRATION_URL: !reset null
      DATABASE_MIGRATION_URL_TEMPLATE: "postgresql://twes:{postgres_password}@postgres:5432/twes?serverVersion=18&charset=utf8"
      POSTGRES_APP_PASSWORD: !reset null
    secrets: [app_secret, app_mfa_key, realtime_token_key, realtime_api_key, postgres_app_password, mailer_dsn, postgres_password]
  # The workers run the same production image with the same secrets.
  worker:
    labels: *secrets-digest
    restart: unless-stopped
    build:
      target: prod
    environment:
      <<: *api-environment
      APP_MFA_KEY: !reset null
      REALTIME_TOKEN_KEY: !reset null
      REALTIME_API_KEY: !reset null
      MAILER_DSN: !reset null
      DATABASE_URL: !reset null
    secrets: *api-secrets
  demo-worker:
    labels: *secrets-digest
    restart: unless-stopped
    build:
      target: prod
    environment:
      <<: *api-environment
      APP_MFA_KEY: !reset null
      REALTIME_TOKEN_KEY: !reset null
      REALTIME_API_KEY: !reset null
      MAILER_DSN: !reset null
      DATABASE_URL: !reset null
    secrets: *api-secrets
  postgres:
    labels: *secrets-digest
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
  # Its two realtime keys, under the names its own configuration reads, through the shim mounted from the checkout.
  centrifugo:
    labels: *secrets-digest
    restart: unless-stopped
    entrypoint: [sh, /twes-secrets, centrifugo]
    volumes:
      - ./infra/postgres/twes-secrets:/twes-secrets:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: !reset null
      CENTRIFUGO_HTTP_API_KEY: !reset null
    secrets:
      - source: realtime_token_key
        target: /run/secrets/centrifugo_client_token_hmac_secret_key
      - source: realtime_api_key
        target: /run/secrets/centrifugo_http_api_key
  web:
    restart: unless-stopped
  gotenberg:
    restart: unless-stopped
  mailpit:
    restart: unless-stopped

# Each from the variable of its name in the environment compose is run in.
secrets:
  app_secret:
    environment: APP_SECRET
  app_mfa_key:
    environment: APP_MFA_KEY
  realtime_token_key:
    environment: REALTIME_TOKEN_KEY
  realtime_api_key:
    environment: REALTIME_API_KEY
  postgres_password:
    environment: POSTGRES_PASSWORD
  postgres_app_password:
    environment: POSTGRES_APP_PASSWORD
  mailer_dsn:
    environment: MAILER_DSN
