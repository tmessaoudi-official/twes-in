name: twes_in
description: "twes-in — invoicing and billing client"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ROBOTO IS BUNDLED, NOT FETCHED — and this is a compliance decision, not a packaging preference.
  #
  # Flutter web's CanvasKit renderer downloads Roboto from `fonts.gstatic.com` at runtime when the app
  # declares no font asset. [Verified 2026-07-29: a headless Chromium load of the release web build issued
  # exactly one external request, to https://fonts.gstatic.com/s/roboto/v32/…woff2.] Three problems with
  # that, in descending order of seriousness:
  #
  #   1. GDPR. Every load sends the visitor's IP to Google. A German court (LG München I, 3 O 17493/20) held
  #      that embedding Google Fonts this way without consent is an unlawful transfer of personal data. This
  #      product targets EU invoicing — EN 16931, Factur-X, Peppol — so leaking client IPs to a third party
  #      on every page load is not a defensible default for its own client.
  #   2. Availability. No network, no text. Everything else still works: the theme surface paints and the
  #      widget tree builds, so `flutter test` and `flutter build web` both stay green while the user sees a
  #      blank page. That is exactly the failure CLAUDE.md's visual-evidence rule exists to catch, and it is
  #      how this was actually found — by screenshotting the build, not by running the tests.
  #   3. It never settles. Playwright's `networkidle` does not fire on the CDN build, so any
  #      screenshot-based test is flaky by construction.
  #
  # Apache-2.0. The licence text sits beside the files as Roboto-LICENSE.txt and is recorded in
  # THIRD-PARTY-NOTICES.md. Three weights rather than all seventeen: Material 3 uses regular, medium and
  # bold, and the rest would be ~2 MB of unused binary in every build.
  # NOTO SANS ARABIC IS BUNDLED FOR THE SAME REASON, AND ONE MORE.
  #
  # Roboto covers no Arabic. When the engine meets a glyph its fonts do not have, Flutter Web downloads a
  # Noto fallback from `fonts.gstatic.com` — the same GDPR transfer as above, for the locale where it matters
  # most, since `ar` is a first-class locale here and already has a committed catalogue. Pinning
  # `fontFallbackBaseUrl` same-origin in web/flutter_bootstrap.js stopped the transfer, but a pin with no
  # font behind it is not a fix: the engine then retries a 404 for the page's lifetime and renders no Arabic
  # at all. Bundling the family means the fallback path is never taken for Arabic in the first place, on every
  # target rather than only on the web — a Linux desktop with no Arabic system font would fail the same way.
  #
  # OFL-1.1, which is NOT on the ordinary permissive list: it is permitted for a vendored font asset only
  # (developer ruling 2026-07-29, CLAUDE.md invariant 8(a)). Vendored unmodified, so the Reserved Font Name
  # clause is not engaged. Two weights, matching the Material 3 pairing Roboto uses. Provenance, sha256 and
  # the name-table evidence are in THIRD-PARTY-NOTICES.md, and
  # scripts/gates/dependency-licences.php verifies every one of those claims against the binary itself.
  #
  # Declared as a FAMILY here and referenced by ThemeData.fontFamilyFallback in lib/main.dart. A font that is
  # bundled but never referenced is dead weight that still ships, so the two must move together.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

  # THE FONT LICENCES SHIP WITH THE FONTS. This is a compliance requirement, not tidiness.
  #
  # `fonts:` above bundles the .ttf files and nothing beside them, and Flutter's generated assets/NOTICES
  # aggregates LICENSE files from *packages*, not from app assets — so the built bundle contained both
  # families and mentioned neither licence. [Verified 2026-07-30 on a release web build:
  # `grep -c "SIL Open Font License" build/web/assets/NOTICES` → 0, with both families present under
  # build/web/assets/assets/fonts/.] Apache-2.0 section 4(a) and OFL-1.1 section 2 each require the licence to
  # accompany the redistributed files, and a web bundle served to a browser is redistribution.
  #
  # Keeping the text beside the binary in the repository is necessary but not sufficient: the repository is
  # not the artifact anyone receives. scripts/gates/dependency-licences.php checks both — that the text sits
  # beside the font AND that it is declared here, so it actually ships.
  # MaterialIcons-LICENSE.txt covers a font we do NOT vendor. `uses-material-design: true` above injects
  # MaterialIcons-Regular.otf into the artifact, so we distribute it — and for two commits we distributed it
  # with no licence notice anywhere in the bundle, invisible to every walk over our own directories because
  # the file is not in this repository and no lock file records a manifest flag.
  #
  # Its position was unclear (the SDK ships a CC-BY-4.0 text beside it; Google's icon repository states
  # Apache-2.0 — this comment said "unverifiable from this container" and that was false; it is verifiable and
  # the claim is retracted, without disturbing the ruling, whose grounds are the SDK's own sidecar and the
  # tree-shaking), so per licensing invariant 10 it was put to the developer
  # and the ruling was to comply with the STRICTER reading — which satisfies both. That notice carries the
  # attribution, the licence URI and the statement of modification the tree-shaking requires. It records a
  # DISCHARGED OBLIGATION, not a new permission: CC-BY-4.0 is still refused on any package.
  assets:
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/NotoSansArabic-LICENSE.txt
    - assets/fonts/MaterialIcons-LICENSE.txt

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
