<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="twes-in — invoicing and billing client">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="twes_in">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>twes_in</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    THE ENGINE'S FONT FALLBACK IS PINNED TO OUR OWN ORIGIN, and that is a GDPR control, not a tuning knob.
    Vendoring Roboto closed the Roboto fetch and nothing more: Flutter Web's engine downloads NOTO fallback
    fonts for any script the bundled fonts do not cover, from a base URL compiled into the shipped bundle
    whose default is `https://fonts.gstatic.com/s/`. Roboto carries no Arabic, and `ar` is a first-class
    locale here (see api/translations/messages.ar.xlf) — so rendering one Arabic string reintroduces exactly
    the third-party transfer the vendoring was supposed to end. Certification round 6 measured it: 0 gstatic
    requests with Latin text, 13 with Arabic, from the same build.
    Setting the base URL to a same-origin path means the engine 404s locally instead of reaching Google.
    ARABIC IS DONE (2026-07-30): OFL-1.1 was ruled permitted for a vendored font asset, so Noto Sans Arabic is
    bundled and named in ThemeData.fontFamilyFallback, and this fallback path is never taken for it.
    STILL OWED: every other uncovered script — CJK, Hebrew, emoji — resolves here and finds nothing, which
    measures as 3328 same-origin 404s in a 40-second load, uncapped. No external transfer, but not a finished
    state either. See mobile/web/flutter_bootstrap.js, which holds the full measurement and the two options.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
