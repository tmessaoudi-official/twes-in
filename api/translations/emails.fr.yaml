# Subjects and body strings of the mail the API sends. The SPA’s own strings live in web/public/i18n.
invitation:
    subject: 'Rejoignez %company% sur %product%'
    heading: 'Vous êtes invité à rejoindre %company%'
    invited_by: '%name% vous a invité.'
    role: 'Votre rôle sera : %role%.'
    call_to_action: 'Accepter l’invitation'
    expires: 'Ce lien expire le %date%.'
    ignore: "Si vous n’attendiez pas cette invitation, ignorez ce message."
signup:
    subject: 'Créez votre compte %product%'
    heading: 'Terminez votre inscription'
    intro: "Quelqu’un, sans doute vous, a demandé à ouvrir un compte %product% avec cette adresse."
    call_to_action: "Terminer l’inscription"
    expires: "Ce lien est valable %hours% heures et ne sert qu’une fois."
    ignore: "Si vous n’avez rien demandé, ignorez ce message : aucun compte n’est créé."
    account_exists:
        subject: 'Votre compte %product%'
        heading: 'Vous avez déjà un compte'
        intro: "Quelqu’un a demandé à ouvrir un compte %product% avec cette adresse, qui en a déjà un."
        call_to_action: 'Se connecter'
        ignore: "Si ce n’était pas vous, ignorez ce message : rien n’a changé."
password_reset:
    subject: 'Réinitialisez votre mot de passe %product%'
    heading: 'Choisissez un nouveau mot de passe'
    intro: 'Quelqu’un, sans doute vous, a demandé à réinitialiser le mot de passe de votre compte %product%.'
    call_to_action: 'Choisir un nouveau mot de passe'
    expires: 'Ce lien est valable %minutes% minutes et ne sert qu’une fois.'
    ignore: 'Si vous n’êtes pas à l’origine de cette demande, ignorez ce message : votre mot de passe n’a pas changé.'
company_approved:
    subject: '%company% est ouverte sur %product%'
    heading: '%company% est approuvée'
    intro: "L’équipe %product% a approuvé %company%. Vous et votre équipe pouvez vous connecter et commencer."
    call_to_action: 'Se connecter'
company_restored:
    subject: 'L’accès à %company% est rétabli sur %product%'
    heading: 'L’accès à %company% est rétabli'
    intro: "L’équipe %product% a rétabli l’accès à %company%. Vous et votre équipe pouvez de nouveau vous connecter, et vos données sont telles que vous les avez laissées."
    call_to_action: 'Se connecter'
company_suspended:
    subject: 'L’accès à %company% est suspendu sur %product%'
    heading: 'L’accès à %company% est suspendu'
    intro: "L’équipe %product% a suspendu l’accès à %company% : ni vous ni votre équipe ne pouvez vous y connecter pour l’instant."
    data: 'Vos données sont conservées intactes et vous les retrouverez dès que l’accès sera rétabli.'
company_refused:
    subject: '%company% n’a pas été acceptée sur %product%'
    heading: '%company% n’a pas été acceptée'
    intro: "L’équipe %product% n’a pas accepté l’ouverture de %company%."
    data: 'Ce que vous avez saisi est conservé : si l’équipe revient sur sa décision, vous le retrouverez.'
company_decision:
    reason: 'Motif :'
    no_reason: 'L’équipe %product% l’a décidé sans en préciser le motif.'
    contact: 'Pour en savoir plus, contactez l’équipe %product% :'
    no_channel: 'L’équipe %product% n’a pas encore indiqué comment la joindre, et ce courrier ne peut pas recevoir de réponse.'
    channels:
        phone: 'Téléphone :'
        whatsapp: 'WhatsApp :'
        email: 'E-mail :'
payment_declared:
    subject: '%company% a déclaré un règlement de %amount% %currency%'
    heading: '%company% déclare avoir payé'
    intro: "%company% a déclaré %amount% %currency% réglés le %date%."
    method: 'Moyen : %method%.'
    methods:
        cash: 'espèces'
        transfer: 'virement'
        cheque: 'chèque'
        other: 'autre'
    reference: 'Référence : %reference%.'
    call_to_action: 'Ouvrir la page plateforme'
    sign_in_first: "La décision se prend connecté : ce lien ouvre la page, il ne confirme rien par lui-même."
payment_decided:
    confirmed_subject: 'Votre règlement pour %company% a été confirmé'
    rejected_subject: "Votre règlement pour %company% n’a pas pu être confirmé"
    confirmed_heading: 'Règlement de %amount% %currency% confirmé'
    rejected_heading: 'Règlement de %amount% %currency% non confirmé'
    rejected_intro: "Nous n’avons pas pu confirmer le règlement déclaré pour %company%. Vous pouvez déclarer un autre règlement."
    paid_through: '%company% est réglée jusqu’au %date%.'
    note: 'Note : %note%'
    call_to_action: 'Ouvrir %product%'
notification:
    kinds:
        invitation_accepted: 'Nouveau membre'
        stock_delivery_note_lines_left_out: 'Bon de livraison : lignes sans sortie de stock'
        stock_delivery_note_moved_no_stock: 'Bon de livraison : stock non mis à jour'
        stock_invoice_lines_left_out: 'Facture : lignes sans sortie de stock'
        stock_invoice_moved_no_stock: 'Facture : stock non mis à jour'
        stock_credit_lines_not_returned: 'Avoir : marchandises non revenues en stock'
        stock_credit_moved_no_stock: 'Avoir : stock non mis à jour'
        stock_count_difference: 'Écart de comptage'
        stock_imported: 'Écarts d’un import de stock'
        stock_low: 'Stock sous le seuil de réapprovisionnement'
        invoice_credit_limit_passed: 'Limite de crédit dépassée'
        invoice_reminder_due: 'Relance à faire'
        invoice_late_fee_drafted: 'Frais de retard préparés'
        invoice_recurring_drafted: 'Facture récurrente prête à émettre'
        invoice_recurring_stopped: 'Facture récurrente mise en pause'
        expense_recurring_drafted: 'Dépense récurrente à vérifier'
        expense_recurring_stopped: 'Dépense récurrente mise en pause'
        module_arrived: 'Module arrivé'
        data_check_failed: 'Contrôle des données en échec'
        support_access_granted: 'Accès du support ouvert'
        support_access_ended: 'Accès du support fermé'
        membership_role_changed: 'Rôle changé'
        membership_removed: 'Retrait d’une entreprise'
        invitation_expired: 'Invitation expirée'
        signup_awaiting_approval: 'Entreprise en attente d’approbation'
    types:
        invitation_accepted: '%display_name% a rejoint l’entreprise.'
        stock_delivery_note_lines_left_out: 'Le bon de livraison %number% est validé, mais certaines de ses lignes n’ont pas sorti de stock (unité différente ou quantité absente).'
        stock_delivery_note_moved_no_stock: 'Le stock du bon de livraison %number% n’a pas pu être mis à jour. Rien n’a bougé : remettez-le à jour depuis « À surveiller ».'
        stock_invoice_lines_left_out: 'La facture %number% est émise, mais certaines de ses lignes n’ont pas sorti de stock (unité différente, ou pas de quantité).'
        stock_invoice_moved_no_stock: 'Le stock de la facture %number% n’a pas pu être mis à jour. Rien n’a bougé : remettez-le à jour depuis « À surveiller ».'
        stock_credit_lines_not_returned: 'L’avoir %number% est émis, mais une partie des marchandises qu’il marque comme retournées n’est pas revenue en stock (ni vendue par cette facture ni livrée par ses bons de livraison, ou déjà retournée).'
        stock_credit_moved_no_stock: 'Les marchandises de l’avoir %number% n’ont pas pu être remises en stock. Rien n’a bougé : remettez le stock à jour depuis « À surveiller ».'
        stock_count_difference: 'Le comptage de %product% (%reference%) à %location% a trouvé un écart de %difference%.'
        stock_imported: 'Un import de stock a trouvé des écarts (écarts : %differences%, comptages : %counted%).'
        stock_low: '%product% (%reference%) est tombé à %on_hand% à %establishment%, au niveau ou sous son seuil de réapprovisionnement de %point%.'
        invoice_credit_limit_passed: '%customer% dépasse sa limite de crédit : %owed% %currency% dus pour %limit% après la facture %number%.'
        invoice_reminder_due: 'Relance %stage% à faire : la facture %number% de %customer%, %amount_due% %currency%, a %days_late% jours de retard.'
        invoice_late_fee_drafted: 'Relance %stage% à faire : la facture %number% de %customer%, %amount_due% %currency%, a %days_late% jours de retard. Frais de retard de %late_fee% %currency% préparés en brouillon.'
        invoice_recurring_drafted: 'Facture récurrente de %customer% : un brouillon copié de la facture %number% attend d’être émis.'
        invoice_recurring_stopped: 'Facture récurrente de %customer% mise en pause : la facture %number% qu’elle copie ne peut plus l’être.'
        expense_recurring_drafted: 'Dépense récurrente « %description% » : un brouillon du %dueOn% attend d’être vérifié et enregistré.'
        expense_recurring_stopped: 'Dépense récurrente « %description% » mise en pause : la dépense qu’elle copie ne peut plus l’être.'
        module_arrived: 'Le module « %label% », que vous attendiez, est arrivé : vous pouvez l’activer pour %company% dans Modules.'
        data_check_failed: 'Le contrôle « %label% » a trouvé des anomalies dans les données de %company% (nombre d’anomalies : %count%). Le détail est dans les journaux du serveur.'
        support_access_granted: '%by% a ouvert %company% au support de la plateforme, en lecture seule, jusqu’au %until%.'
        support_access_ended: '%by% a fermé l’accès du support de la plateforme à %company%.'
        membership_role_changed: 'Votre rôle dans %company% est maintenant « %label% » : ce que vous pouvez y voir et y faire a changé.'
        membership_removed: 'Vous ne faites plus partie de %company% : vous n’y avez plus accès. Pour y revenir, demandez à l’un de ses propriétaires de vous inviter à nouveau.'
        invitation_expired: 'L’invitation envoyée à %email% pour rejoindre %company% a expiré sans être utilisée. Vous pouvez l’envoyer à nouveau depuis « Membres ».'
        signup_awaiting_approval: '%company% (%email%) s’est inscrite et attend votre approbation dans la page de la plateforme.'
    open: 'Ouvrir %product%'
    why: 'Vous recevez cet e-mail parce que « %kind% » vous est aussi envoyé par e-mail.'
    stop: 'Ne plus recevoir « %kind% » par e-mail'
data_checks:
    references_company: 'Références entre sociétés'
    invoices_chain: 'Chaîne des factures'
    invoices_arithmetic: 'Calculs des factures'
    invoices_numbering: 'Numérotation des factures'
    customers_contact_rules: 'Coordonnées des clients'
    vendors_contact_rules: 'Coordonnées des fournisseurs'
    tenancy_contact_rules: 'Coordonnées de la société'
account_deletion:
    subject: 'Votre compte %product% sera supprimé'
    heading: 'Votre compte est fermé'
    intro: 'Vous avez demandé la suppression de votre compte %product%. Il est fermé dès maintenant et toutes vos sessions sont terminées.'
    final: 'La suppression sera définitive dans %days% jours, le %date% : votre compte et vos préférences seront alors effacés, et votre adresse retirée du journal.'
    cancel: 'Pour garder votre compte, reconnectez-vous avant cette date : la suppression sera annulée.'
    not_you: 'Si vous n’êtes pas à l’origine de cette demande, reconnectez-vous et changez votre mot de passe.'
security_notice:
    subject: 'Sécurité de votre compte %product% : %change%'
    authenticator_added:
        heading: 'Vérification en deux étapes activée'
        body: 'Une application d’authentification a été ajoutée à votre compte : elle vous sera demandée à chaque connexion.'
    authenticator_replaced:
        heading: 'Application d’authentification remplacée'
        body: 'L’application d’authentification de votre compte a été remplacée par une nouvelle : l’ancienne ne permet plus de se connecter, de nouveaux codes de secours ont été créés et vos autres sessions ont été fermées.'
    authenticator_removed:
        heading: 'Application d’authentification retirée'
        body: 'L’application d’authentification de votre compte a été retirée : elle ne vous sera plus demandée à la connexion.'
    passkey_added:
        heading: 'Clé d’accès ajoutée'
        body: 'Une clé d’accès a été ajoutée à votre compte : elle permet de confirmer que c’est bien vous.'
    passkey_removed:
        heading: 'Clé d’accès retirée'
        body: 'Une clé d’accès a été retirée de votre compte : elle ne permet plus de vous connecter.'
    password_changed:
        heading: 'Mot de passe changé'
        body: 'Le mot de passe de votre compte a été changé.'
    password_reset:
        heading: 'Mot de passe réinitialisé'
        body: 'Le mot de passe de votre compte a été réinitialisé par le lien envoyé à cette adresse.'
    recovery_codes_renewed:
        heading: 'Nouveaux codes de secours'
        body: 'De nouveaux codes de secours ont été créés pour votre compte : les précédents ne fonctionnent plus.'
    account_locked:
        heading: 'Compte verrouillé'
        body: 'Votre compte a été verrouillé après plusieurs mots de passe ou codes erronés : personne ne peut s’y connecter pour l’instant, pas même avec le bon mot de passe.'
    locked_until: 'Il reste verrouillé jusqu’au %moment% (fuseau horaire %zone%).'
    unlock: 'Pour le déverrouiller tout de suite, choisissez un nouveau mot de passe avec « Mot de passe oublié » : le lien est envoyé à cette adresse.'
    locked_not_you: 'Si ce n’est pas vous qui avez essayé, quelqu’un tente de deviner votre mot de passe : choisissez-en un que vous n’utilisez nulle part ailleurs, et activez la vérification en deux étapes.'
    code_locked_not_you: 'Si ce n’est pas vous qui avez essayé, votre mot de passe est connu de quelqu’un d’autre : changez-le dès maintenant avec « Mot de passe oublié », et ne le réutilisez nulle part ailleurs.'
    second_factor_locked:
        heading: 'Compte verrouillé après des codes erronés'
        body: 'Votre compte a été verrouillé après plusieurs codes de vérification erronés, saisis après le bon mot de passe : personne ne peut s’y connecter pour l’instant.'
    factors_replaced:
        heading: 'Facteurs de connexion réinitialisés'
        body: 'La personne qui gère votre installation a retiré les seconds facteurs de votre compte (application d’authentification, codes de secours et, le cas échéant, clés d’accès) et fermé toutes vos sessions. À votre prochaine connexion avec votre mot de passe, vous en configurerez un nouveau.'
    operator_deactivated:
        heading: 'Compte désactivé'
        body: 'La personne qui gère votre installation a désactivé votre compte et fermé toutes vos sessions : il ne permet plus de se connecter. Si vous pensez que c’est une erreur, adressez-vous à elle.'
    operator_reactivated:
        heading: 'Compte réactivé'
        body: 'La personne qui gère votre installation a réactivé votre compte : vous pouvez de nouveau vous connecter avec votre mot de passe.'
    operator_ended_sessions:
        heading: 'Sessions fermées'
        body: 'La personne qui gère votre installation a fermé toutes vos sessions : reconnectez-vous pour continuer.'
    passkey: 'Clé concernée :'
    if_you: 'Si c’est vous, il n’y a rien à faire.'
    not_you: 'Si ce n’est pas vous et que vous pouvez encore vous connecter, changez votre mot de passe dans « Mon compte », puis vérifiez « Vérification en deux étapes ».'
    locked_out: 'Si vous ne pouvez plus vous connecter, utilisez « Mot de passe oublié » ou un code de secours, ou demandez à la personne qui gère votre installation.'
