# The « À vérifier » note an import leaves on a record whose doubtful cells it set aside (docs/SPEC.md § 7, 2026-10-22 18:09).
set_aside:
    line: '%label% in the file: “%value%”, set aside: %why%.'
    with_example: '%why% (example: %example%)'
    why:
        identifier_shape: 'its shape does not match'
        identifier_part: 'its shape does not match'
        identifier_part_rule: 'its parts do not go together'
        identifier_reversed: 'it is written the other way round'
        identifier_checksum: 'its check digits are wrong'
        invalid_iban: 'its shape or its check digits are wrong'
        invalid_bic: 'it is not a BIC of 8 or 11 characters (example: BIATTNTT)'
        invalid_phone: 'it is not a phone number'
        invalid_email: 'it is not an e-mail address'
        invalid_barcode: 'its check digit does not match'
        phone_length: 'it does not have the number of digits of a phone in its country'
        phone_country: 'with no country, a phone starts with + and its country code'
column:
    email: 'E-mail address'
    phone: 'Phone'
    iban: 'IBAN'
    bic: 'BIC'
    barcode: 'Barcode'
    pack_barcode: 'Pack barcode'
    supplier_code: 'Supplier code'
# The « À vérifier » line a record carries for a phone of the right length outside the numbers handed out (row 207).
doubt:
    phone: 'Phone “%value%”: the length is right, but this number is not among those handed out in its country. To check.'
# The « À vérifier » line the night leaves on a record keeping an e-mail or a phone today's rule refuses (row 208).
kept:
    line: '%label% “%value%” no longer follows the rule: %why%. To correct.'
    contact: '%label% of the contact %name% “%value%” no longer follows the rule: %why%. To correct.'
    unnamed_contact: '%label% of a contact “%value%” no longer follows the rule: %why%. To correct.'
