# Subjects and body strings of the mail the API sends, in Arabic (docs/i18n/ar-glossary.md). A count is said beside
# its label (« عدد الأيام: %days% »), never before a noun it would have to agree with.
invitation:
    subject: 'انضمّ إلى %company% على %product%'
    heading: 'أنت مدعوّ للانضمام إلى %company%'
    invited_by: 'دعاك %name%.'
    role: 'سيكون دورك: %role%.'
    call_to_action: 'قبول الدعوة'
    expires: 'تنتهي صلاحية هذا الرابط في %date%.'
    ignore: 'إن لم تكن تنتظر هذه الدعوة، فتجاهل هذه الرسالة.'
signup:
    subject: 'أنشئ حسابك على %product%'
    heading: 'أكمل تسجيلك'
    intro: 'طلب أحدهم، وأنت على الأرجح، فتح حساب على %product% بهذا العنوان.'
    call_to_action: 'إكمال التسجيل'
    expires: 'يصلح هذا الرابط لمرة واحدة، ومدة صلاحيته بالساعات: %hours%.'
    ignore: 'إن لم تطلب شيئًا، فتجاهل هذه الرسالة: لن يُنشأ أي حساب.'
    account_exists:
        subject: 'حسابك على %product%'
        heading: 'لديك حساب بالفعل'
        intro: 'طلب أحدهم فتح حساب على %product% بهذا العنوان، وله حساب بالفعل.'
        call_to_action: 'تسجيل الدخول'
        ignore: 'إن لم تكن أنت، فتجاهل هذه الرسالة: لم يتغيّر شيء.'
password_reset:
    subject: 'إعادة تعيين كلمة المرور على %product%'
    heading: 'اختر كلمة مرور جديدة'
    intro: 'طلب أحدهم، وأنت على الأرجح، إعادة تعيين كلمة مرور حسابك على %product%.'
    call_to_action: 'اختيار كلمة مرور جديدة'
    expires: 'يصلح هذا الرابط لمرة واحدة، ومدة صلاحيته بالدقائق: %minutes%.'
    ignore: 'إن لم تكن صاحب هذا الطلب، فتجاهل هذه الرسالة: كلمة مرورك لم تتغيّر.'
company_approved:
    subject: '%company% مفتوحة على %product%'
    heading: 'تمّت الموافقة على %company%'
    intro: 'وافق فريق %product% على %company%. يمكنك أنت وفريقك تسجيل الدخول والبدء.'
    call_to_action: 'تسجيل الدخول'
payment_declared:
    subject: 'صرّحت %company% بدفع %amount% %currency%'
    heading: 'تصرّح %company% بأنها دفعت'
    intro: 'صرّحت %company% بدفع %amount% %currency% بتاريخ %date%.'
    method: 'الطريقة: %method%.'
    methods:
        cash: 'نقدًا'
        transfer: 'تحويل'
        cheque: 'صكّ'
        other: 'أخرى'
    reference: 'المرجع: %reference%.'
    call_to_action: 'فتح صفحة المنصّة'
    sign_in_first: 'يُتّخذ القرار بعد تسجيل الدخول: هذا الرابط يفتح الصفحة ولا يؤكّد شيئًا بنفسه.'
payment_decided:
    confirmed_subject: 'تمّ تأكيد دفعتك'
    rejected_subject: 'تعذّر تأكيد دفعتك'
    confirmed_heading: 'تأكيد دفع %amount% %currency%'
    rejected_heading: 'عدم تأكيد دفع %amount% %currency%'
    rejected_intro: 'تعذّر علينا تأكيد الدفعة المصرّح بها لـ %company%.'
    paid_through: 'اشتراك %company% خالص إلى غاية %date%.'
    note: 'ملاحظة: %note%'
    call_to_action: 'فتح %product%'
notification:
    kinds:
        invitation_accepted: 'عضو جديد'
        stock_delivery_note_lines_left_out: 'وصل تسليم: أسطر دون خروج من المخزون'
        stock_delivery_note_moved_no_stock: 'وصل تسليم: لم يُحدَّث المخزون'
        stock_invoice_lines_left_out: 'فاتورة: أسطر دون خروج من المخزون'
        stock_invoice_moved_no_stock: 'فاتورة: لم يُحدَّث المخزون'
        stock_credit_lines_not_returned: 'فاتورة تعديلية: سلع لم تعد إلى المخزون'
        stock_credit_moved_no_stock: 'فاتورة تعديلية: لم يُحدَّث المخزون'
        stock_count_difference: 'فارق في العدّ'
        stock_imported: 'فوارق استيراد للمخزون'
        stock_low: 'مخزون تحت عتبة إعادة التزوّد'
        invoice_credit_limit_passed: 'تجاوز حدّ الائتمان'
        invoice_reminder_due: 'تذكير يجب إرساله'
        invoice_late_fee_drafted: 'مصاريف تأخير جاهزة'
        invoice_recurring_drafted: 'فاتورة دورية جاهزة للإصدار'
        invoice_recurring_stopped: 'فاتورة دورية موقوفة مؤقتًا'
        expense_recurring_drafted: 'مصروف دوري يجب التثبّت منه'
        expense_recurring_stopped: 'مصروف دوري موقوف مؤقتًا'
        module_arrived: 'وصلت وحدة'
        data_check_failed: 'فشل التثبّت من البيانات'
        support_access_granted: 'فُتح وصول الدعم'
        support_access_ended: 'أُغلق وصول الدعم'
        signup_awaiting_approval: 'شركة في انتظار الموافقة'
    types:
        invitation_accepted: 'انضمّ %display_name% إلى الشركة.'
        stock_delivery_note_lines_left_out: 'صودق على وصل التسليم %number%، لكن بعض أسطره لم تُخرج من المخزون (وحدة مختلفة أو كمية غائبة).'
        stock_delivery_note_moved_no_stock: 'تعذّر تحديث مخزون وصل التسليم %number%. لم يتحرك شيء: حدّثه من « للمتابعة ».'
        stock_invoice_lines_left_out: 'صدرت الفاتورة %number%، لكن بعض أسطرها لم تُخرج من المخزون (وحدة مختلفة، أو دون كمية).'
        stock_invoice_moved_no_stock: 'تعذّر تحديث مخزون الفاتورة %number%. لم يتحرك شيء: حدّثه من « للمتابعة ».'
        stock_credit_lines_not_returned: 'صدرت الفاتورة التعديلية %number%، لكن جزءًا من السلع التي تعدّها مرتجعة لم يعد إلى المخزون (لم تبعه هذه الفاتورة ولم تسلّمه وصولات تسليمها، أو أُرجع من قبل).'
        stock_credit_moved_no_stock: 'تعذّرت إعادة بضائع الفاتورة التعديلية %number% إلى المخزون. لم يتحرك شيء: حدّث المخزون من « للمتابعة ».'
        stock_count_difference: 'وجد عدّ %product% (%reference%) في %location% فارقًا قدره %difference%.'
        stock_imported: 'وجد استيراد للمخزون فوارق (الفوارق: %differences%، العدّات: %counted%).'
        stock_low: 'نزل %product% (%reference%) إلى %on_hand% في %establishment%، أي عند عتبة إعادة التزوّد %point% أو دونها.'
        invoice_credit_limit_passed: 'تجاوز %customer% حدّ ائتمانه: المستحق %owed% %currency% والحدّ %limit% بعد الفاتورة %number%.'
        invoice_reminder_due: 'التذكير %stage% يجب إرساله: الفاتورة %number% لـ %customer%، بمبلغ %amount_due% %currency%، أيام التأخير: %days_late%.'
        invoice_late_fee_drafted: 'التذكير %stage% يجب إرساله: الفاتورة %number% لـ %customer%، بمبلغ %amount_due% %currency%، أيام التأخير: %days_late%. أُعدّت مصاريف تأخير بمبلغ %late_fee% %currency% في مسودة.'
        invoice_recurring_drafted: 'فاتورة دورية لـ %customer%: مسودة منسوخة من الفاتورة %number% تنتظر الإصدار.'
        invoice_recurring_stopped: 'أُوقفت مؤقتًا الفاتورة الدورية لـ %customer%: لم يعد بالإمكان نسخ الفاتورة %number% التي تنسخها.'
        expense_recurring_drafted: 'مصروف دوري « %description% »: مسودة بتاريخ %dueOn% تنتظر التثبّت والتسجيل.'
        expense_recurring_stopped: 'أُوقف مؤقتًا المصروف الدوري « %description% »: لم يعد بالإمكان نسخ المصروف الذي ينسخه.'
        module_arrived: 'وصلت وحدة كنت تنتظرها: يمكنك تفعيلها لـ %company% من « الوحدات ».'
        data_check_failed: 'وجد التثبّت « %label% » خللًا في بيانات %company% (عدد حالات الخلل: %count%). التفاصيل في سجلات الخادم.'
        support_access_granted: 'فتح %by% شركة %company% لدعم المنصّة، للقراءة فقط، إلى غاية %until%.'
        support_access_ended: 'أغلق %by% وصول دعم المنصّة إلى %company%.'
        signup_awaiting_approval: 'سجّلت %company% (%email%) وهي في انتظار موافقتك في صفحة المنصّة.'
    open: 'فتح %product%'
    why: 'تصلك هذه الرسالة لأن « %kind% » يُرسل إليك أيضًا بالبريد الإلكتروني.'
    stop: 'إيقاف تلقّي « %kind% » بالبريد الإلكتروني'
data_checks:
    references_company: 'المراجع بين الشركات'
    invoices_chain: 'سلسلة الفواتير'
    invoices_arithmetic: 'حسابات الفواتير'
    invoices_numbering: 'ترقيم الفواتير'
account_deletion:
    subject: 'سيُحذف حسابك على %product%'
    heading: 'أُغلق حسابك'
    intro: 'طلبت حذف حسابك على %product%. أُغلق الحساب ابتداءً من الآن وانتهت كل جلساتك.'
    final: 'يصبح الحذف نهائيًا بتاريخ %date% (بعد عدد الأيام التالي: %days%): يُمحى عندها حسابك وتفضيلاتك، ويُسحب عنوانك من السجلّ.'
    cancel: 'للاحتفاظ بحسابك، سجّل الدخول من جديد قبل هذا التاريخ: يُتراجع عن الحذف.'
    not_you: 'إن لم تكن صاحب هذا الطلب، فسجّل الدخول من جديد وغيّر كلمة مرورك.'
security_notice:
    subject: 'أمان حسابك على %product%: %change%'
    authenticator_added:
        heading: 'تفعيل التحقق بخطوتين'
        body: 'أُضيف تطبيق مصادقة إلى حسابك: سيُطلب منك عند كل تسجيل دخول.'
    authenticator_replaced:
        heading: 'استبدال تطبيق المصادقة'
        body: 'استُبدل تطبيق المصادقة في حسابك بتطبيق جديد: لم يعد القديم يتيح تسجيل الدخول، وأُنشئت رموز استرداد جديدة وأُنهيت جلساتك الأخرى.'
    authenticator_removed:
        heading: 'إزالة تطبيق المصادقة'
        body: 'أُزيل تطبيق المصادقة من حسابك: لن يُطلب منك بعد الآن عند تسجيل الدخول.'
    passkey_added:
        heading: 'إضافة مفتاح مرور'
        body: 'أُضيف مفتاح مرور إلى حسابك: يؤكّد أنك أنت فعلًا.'
    passkey_removed:
        heading: 'إزالة مفتاح مرور'
        body: 'أُزيل مفتاح مرور من حسابك: لم يعد يتيح لك تسجيل الدخول.'
    password_changed:
        heading: 'تغيير كلمة المرور'
        body: 'غُيّرت كلمة مرور حسابك.'
    password_reset:
        heading: 'إعادة تعيين كلمة المرور'
        body: 'أُعيد تعيين كلمة مرور حسابك عبر الرابط المرسل إلى هذا العنوان.'
    recovery_codes_renewed:
        heading: 'رموز استرداد جديدة'
        body: 'أُنشئت رموز استرداد جديدة لحسابك: لم تعد الرموز السابقة صالحة.'
    factors_replaced:
        heading: 'إعادة تعيين عوامل تسجيل الدخول'
        body: 'أزال المسؤول عن تثبيتك عوامل التحقق الثانية من حسابك (تطبيق المصادقة ورموز الاسترداد، ومفاتيح المرور عند الاقتضاء) وأنهى كل جلساتك. عند تسجيل دخولك التالي بكلمة مرورك، ستضبط عاملًا جديدًا.'
    account_locked:
        heading: 'الحساب مقفل'
        body: 'أُقفل حسابك بعد عدة كلمات مرور أو رموز خاطئة: لا يمكن لأحد تسجيل الدخول إليه الآن، ولا حتى بكلمة المرور الصحيحة.'
    locked_until: 'يبقى مقفلًا حتى %moment% (المنطقة الزمنية %zone%).'
    unlock: 'لفتحه الآن، اختر كلمة مرور جديدة عبر «نسيت كلمة المرور»: يُرسَل الرابط إلى هذا العنوان.'
    locked_not_you: 'إن لم تكن أنت من حاول، فهناك من يحاول تخمين كلمة مرورك: اختر كلمة لا تستعملها في أي مكان آخر، وفعّل التحقق بخطوتين.'
    passkey: 'المفتاح المعني:'
    if_you: 'إن كنت أنت صاحب هذا التغيير، فلا شيء عليك فعله.'
    not_you: 'إن لم تكن أنت وما زلت تستطيع تسجيل الدخول، فغيّر كلمة مرورك في «حسابي»، ثم تحقّق من «التحقق بخطوتين».'
    locked_out: 'إن لم تعد تستطيع تسجيل الدخول، فاستعمل «نسيت كلمة المرور» أو رمز استرداد، أو اطلب ذلك من المسؤول عن تثبيتك.'
