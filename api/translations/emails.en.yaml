invitation:
    subject: 'Join %company% on %product%'
    heading: 'You are invited to join %company%'
    invited_by: '%name% invited you.'
    role: 'Your role will be: %role%.'
    call_to_action: 'Accept the invitation'
    expires: 'This link expires on %date%.'
    ignore: "If you were not expecting this invitation, ignore this message."
signup:
    subject: 'Create your %product% account'
    heading: 'Finish signing up'
    intro: 'Someone, most likely you, asked to open a %product% account with this address.'
    call_to_action: 'Finish signing up'
    expires: 'This link is valid for %hours% hours and works once.'
    ignore: 'If you did not ask for this, ignore this message: no account is created.'
    account_exists:
        subject: 'Your %product% account'
        heading: 'You already have an account'
        intro: 'Someone asked to open a %product% account with this address, which already has one.'
        call_to_action: 'Sign in'
        ignore: 'If that was not you, ignore this message: nothing has changed.'
password_reset:
    subject: 'Reset your %product% password'
    heading: 'Choose a new password'
    intro: 'Someone, most likely you, asked to reset the password of your %product% account.'
    call_to_action: 'Choose a new password'
    expires: 'This link is valid for %minutes% minutes and works once.'
    ignore: 'If you did not ask for this, ignore this message: your password has not changed.'
company_approved:
    subject: '%company% is open on %product%'
    heading: '%company% is approved'
    intro: 'The %product% team approved %company%. You and your team can sign in and start now.'
    call_to_action: 'Sign in'
payment_declared:
    subject: '%company% declared a payment of %amount% %currency%'
    heading: '%company% says it paid'
    intro: '%company% declared %amount% %currency% paid on %date%.'
    method: 'Method: %method%.'
    methods:
        cash: 'cash'
        transfer: 'bank transfer'
        cheque: 'cheque'
        other: 'other'
    reference: 'Reference: %reference%.'
    call_to_action: 'Open the platform page'
    sign_in_first: 'You decide on it signed in: this link opens the page, it confirms nothing by itself.'
payment_decided:
    confirmed_subject: 'Your payment has been confirmed'
    rejected_subject: 'Your payment could not be confirmed'
    confirmed_heading: 'Payment of %amount% %currency% confirmed'
    rejected_heading: 'Payment of %amount% %currency% not confirmed'
    rejected_intro: 'We could not confirm the payment declared for %company%.'
    paid_through: '%company% is paid through %date%.'
    note: 'Note: %note%'
    call_to_action: 'Open %product%'
notification:
    kinds:
        invitation_accepted: 'New member'
        stock_delivery_note_lines_left_out: 'Delivery note: lines that moved no stock'
        stock_delivery_note_moved_no_stock: 'Delivery note: stock not updated'
        stock_invoice_lines_left_out: 'Invoice: lines that moved no stock'
        stock_invoice_moved_no_stock: 'Invoice: stock not updated'
        stock_credit_lines_not_returned: 'Credit note: goods not back in stock'
        stock_credit_moved_no_stock: 'Credit note: stock not updated'
        stock_count_difference: 'Count difference'
        stock_imported: 'Stock import differences'
        stock_low: 'Stock under its reorder point'
        invoice_credit_limit_passed: 'Credit limit passed'
        invoice_reminder_due: 'Reminder to send'
        invoice_late_fee_drafted: 'Late fee drafted'
        invoice_recurring_drafted: 'Recurring invoice ready to issue'
        invoice_recurring_stopped: 'Recurring invoice paused'
        expense_recurring_drafted: 'Recurring expense to check'
        expense_recurring_stopped: 'Recurring expense paused'
        module_arrived: 'Module arrived'
        data_check_failed: 'Data check failed'
        support_access_granted: 'Support access opened'
        support_access_ended: 'Support access closed'
        signup_awaiting_approval: 'Company waiting for approval'
    types:
        invitation_accepted: '%display_name% joined the company.'
        stock_delivery_note_lines_left_out: 'Delivery note %number% is validated, but some of its lines moved no stock (another unit, or no quantity).'
        stock_delivery_note_moved_no_stock: 'The stock of delivery note %number% could not be updated. Nothing moved: tell the platform administrator, who can replay it.'
        stock_invoice_lines_left_out: 'Invoice %number% is issued, but some of its lines moved no stock (another unit, or no quantity).'
        stock_invoice_moved_no_stock: 'The stock of invoice %number% could not be updated. Nothing moved: record a stock adjustment, or tell the platform administrator.'
        stock_credit_lines_not_returned: 'Credit note %number% is issued, but some of the goods it marks as returned did not come back to stock (neither sold by that invoice nor delivered by its delivery notes, or already returned).'
        stock_credit_moved_no_stock: 'The goods of credit note %number% could not be returned to stock. Nothing moved: record a receipt, or tell the platform administrator.'
        stock_count_difference: 'The count of %product% (%reference%) at %location% found a difference of %difference%.'
        stock_imported: 'A stock import found differences (differences: %differences%, counts: %counted%).'
        stock_low: '%product% (%reference%) is down to %on_hand% at %establishment%, at or under its reorder point of %point%.'
        invoice_credit_limit_passed: '%customer% is over their credit limit: %owed% %currency% owed against %limit% after invoice %number%.'
        invoice_reminder_due: 'Reminder %stage% to send: invoice %number% of %customer%, %amount_due% %currency%, is %days_late% days late.'
        invoice_late_fee_drafted: 'Reminder %stage% to send: invoice %number% of %customer%, %amount_due% %currency%, is %days_late% days late. A late fee of %late_fee% %currency% is prepared as a draft.'
        invoice_recurring_drafted: 'Recurring invoice for %customer%: a draft copied from invoice %number% is waiting to be issued.'
        invoice_recurring_stopped: 'Recurring invoice for %customer% paused: invoice %number%, which it copies, can no longer be copied.'
        expense_recurring_drafted: 'Recurring expense “%description%”: a draft dated %dueOn% is waiting to be checked and recorded.'
        expense_recurring_stopped: 'Recurring expense “%description%” paused: the expense it copies can no longer be copied.'
        module_arrived: 'A module you were waiting for has arrived: you can switch it on for %company% in Modules.'
        data_check_failed: 'The check “%label%” found something wrong in the data of %company% (problems found: %count%). The detail is in the server’s logs.'
        support_access_granted: '%by% opened %company% to the platform’s support, read-only, until %until%.'
        support_access_ended: '%by% closed the platform support’s access to %company%.'
        signup_awaiting_approval: '%company% (%email%) signed up and waits for your approval on the platform page.'
    open: 'Open %product%'
    why: 'You receive this e-mail because « %kind% » is also sent to you by e-mail.'
    stop: 'Stop receiving « %kind% » by e-mail'
data_checks:
    references_company: 'References across companies'
    invoices_chain: 'Invoice chain'
    invoices_arithmetic: 'Invoice figures'
    invoices_numbering: 'Invoice numbering'
account_deletion:
    subject: 'Your %product% account will be deleted'
    heading: 'Your account is closed'
    intro: 'You asked for your %product% account to be deleted. It is closed from now on and all your sessions have ended.'
    final: 'The deletion becomes final in %days% days, on %date%: your account and preferences will then be erased, and your address taken out of the journal.'
    cancel: 'To keep your account, sign in again before that date: the deletion will be cancelled.'
    not_you: 'If you did not ask for this, sign in and change your password.'
security_notice:
    subject: 'Security of your %product% account: %change%'
    authenticator_added:
        heading: 'Two-step verification turned on'
        body: 'An authenticator app was added to your account: it will be asked for at every sign-in.'
    authenticator_replaced:
        heading: 'Authenticator app replaced'
        body: 'Your account’s authenticator app was replaced by a new one: the old one no longer signs in, new recovery codes were made and your other sessions were ended.'
    authenticator_removed:
        heading: 'Authenticator app removed'
        body: 'Your account’s authenticator app was removed: it will no longer be asked for at sign-in.'
    passkey_added:
        heading: 'Passkey added'
        body: 'A passkey was added to your account: it confirms it is really you.'
    passkey_removed:
        heading: 'Passkey removed'
        body: 'A passkey was removed from your account: it no longer signs you in.'
    password_changed:
        heading: 'Password changed'
        body: 'Your account’s password was changed.'
    password_reset:
        heading: 'Password reset'
        body: 'Your account’s password was reset through the link sent to this address.'
    recovery_codes_renewed:
        heading: 'New recovery codes'
        body: 'New recovery codes were made for your account: the previous ones no longer work.'
    factors_replaced:
        heading: 'Sign-in factors reset'
        body: 'Whoever runs your installation removed your account’s second factors (authenticator app, recovery codes and, where asked, passkeys) and ended all your sessions. At your next sign-in with your password, you will set up a new one.'
    account_locked:
        heading: 'Account locked'
        body: 'Your account was locked after several wrong passwords or codes: nobody can sign in to it for now, not even with the right password.'
    locked_until: 'It stays locked until %moment% (time zone %zone%).'
    unlock: 'To unlock it now, choose a new password with “Forgot password”: the link is sent to this address.'
    locked_not_you: 'If this was not you trying, someone is guessing your password: choose one you use nowhere else, and turn on two-step verification.'
    passkey: 'Passkey:'
    if_you: 'If this was you, there is nothing to do.'
    not_you: 'If this was not you and you can still sign in, change your password in “My account”, then check “Two-step verification”.'
    locked_out: 'If you can no longer sign in, use “Forgot password” or a recovery code, or ask whoever runs your installation.'
