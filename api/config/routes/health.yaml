# The health probes, loaded from attributes on the controller.
#
# NOT an `#[ApiResource]`, and that is deliberate: a container's liveness probe must not depend on the
# serialization stack, the negotiation layer or the OpenAPI metadata being healthy. It is the one endpoint whose
# job is to answer when other things are broken, so it goes through the thinnest possible path.
health:
    resource:
        path: '../../src/UI/Http/Controller/'
        namespace: Twes\UI\Http\Controller
    type: attribute
