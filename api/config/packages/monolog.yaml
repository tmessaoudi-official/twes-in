# Logs by channel, as Symfony's logging guide and Monolog recommend (docs/SPEC.md § 7, 2026-09-17). The channels are
# Symfony's own (request, security, doctrine, mailer, php, deprecation…) and the application's below; run
# bin/console debug:autowiring logger to list them all. A service writes to one with #[WithMonologChannel].
monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - realtime # What the API pushes to Centrifugo

when@dev:
    monolog:
        handlers:
            # One file per channel and per day under var/log, kept 14 days.
            request:
                type: rotating_file
                path: "%kernel.logs_dir%/request.log"
                max_files: 14
                level: debug
                channels: [request]
            security:
                type: rotating_file
                path: "%kernel.logs_dir%/security.log"
                max_files: 14
                level: debug
                channels: [security]
            doctrine:
                type: rotating_file
                path: "%kernel.logs_dir%/doctrine.log"
                max_files: 14
                level: debug
                channels: [doctrine]
            realtime:
                type: rotating_file
                path: "%kernel.logs_dir%/realtime.log"
                max_files: 14
                level: debug
                channels: [realtime]
            mailer:
                type: rotating_file
                path: "%kernel.logs_dir%/mailer.log"
                max_files: 14
                level: debug
                channels: [mailer]
            deprecation:
                type: rotating_file
                path: "%kernel.logs_dir%/deprecation.log"
                max_files: 14
                level: debug
                channels: [deprecation]
            php:
                type: rotating_file
                path: "%kernel.logs_dir%/php.log"
                max_files: 14
                level: debug
                channels: [php]
            # Every other channel, the application's own "app" first.
            app:
                type: rotating_file
                path: "%kernel.logs_dir%/app.log"
                max_files: 14
                level: debug
                channels: ["!event", "!request", "!security", "!doctrine", "!realtime", "!mailer", "!deprecation", "!php"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            # Errors only, with what led to them.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Nothing is written until a record reaches "error"; then the whole buffer is, every channel included, so
            # the failure comes with its context.
            main:
                type: fingers_crossed
                action_level: error
                handler: streams
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # JSON on STDERR, or one JSON file per channel under LOG_DIRECTORY.
            streams:
                type: service
                id: App\Shared\Infrastructure\Logging\ChannelStreams
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: service
                id: App\Shared\Infrastructure\Logging\ChannelStreams
                channels: [deprecation]
