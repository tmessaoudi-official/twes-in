# Each limiter's budget, how many over how long, is a parameter of config/services.yaml (`app.rate_limit.<name>.limit`
# and `.interval`), set there for every environment and raised by one where it runs (everything parametrized); what each
# limiter guards, and why it counts per client, per address or per person, is said here.
framework:
    rate_limiter:
        # The second factor is six digits with one step of leeway either way, which is a small space to guess
        # in: three valid codes per million, and a patient attacker who already has the password. Keyed on the
        # pending user rather than the IP, so a botnet does not get one budget per address. Shared by every answer to
        # who is at the screen (the sign-in's second step, recovery codes, a step-up, a company's entry proof, a password
        # change): each spends one before it is checked, and one that holds gives the budget back, so it counts guesses,
        # never the entries of a person going about their day.
        mfa_verify:
            policy: 'fixed_window'
            limit: '%app.rate_limit.mfa_verify.limit%'
            interval: '%app.rate_limit.mfa_verify.interval%'
        # Setting up an app, or moving to a new one, checks a code against a secret just handed to this session: as
        # few guesses as at sign-in, on a budget of its own, so a mistyped first code never holds back the sign-in or the
        # proof of who is there.
        # A sign-in with a passkey alone names no account until the passkey is proved, so its tries are counted per client:
        # as many as the password sign-in allows one address across all its accounts, so an office behind one address is
        # not held back, while a script guessing at credentials is.
        passkey_sign_in:
            policy: 'fixed_window'
            limit: '%app.rate_limit.passkey_sign_in.limit%'
            interval: '%app.rate_limit.passkey_sign_in.interval%'
        mfa_confirm:
            policy: 'fixed_window'
            limit: '%app.rate_limit.mfa_confirm.limit%'
            interval: '%app.rate_limit.mfa_confirm.interval%'
        # Public signup mails whoever asks, so both ends are budgeted. Per client, five asks an hour answer 429 past that;
        # per address, one mail in fifteen minutes, and a second ask gets the same 202 with nothing sent.
        signup_client:
            policy: 'fixed_window'
            limit: '%app.rate_limit.signup_client.limit%'
            interval: '%app.rate_limit.signup_client.interval%'
        signup_address:
            policy: 'fixed_window'
            limit: '%app.rate_limit.signup_address.limit%'
            interval: '%app.rate_limit.signup_address.interval%'
        # Finishing a signup: a refused finish leaves the link usable, so without a budget one link could ask without end
        # which company names are taken. Ten tries a quarter of an hour per client, then 429.
        signup_complete:
            policy: 'fixed_window'
            limit: '%app.rate_limit.signup_complete.limit%'
            interval: '%app.rate_limit.signup_complete.interval%'
        # Forgot password mails whoever asks, so both ends are budgeted like signup: per client five asks an hour, then 429;
        # per address one mail in fifteen minutes, and a second ask gets the same answer with nothing sent. Choosing the
        # new password is budgeted per client too: the link is 256 random bits, so this only keeps the table from being hammered.
        password_reset_client:
            policy: 'fixed_window'
            limit: '%app.rate_limit.password_reset_client.limit%'
            interval: '%app.rate_limit.password_reset_client.interval%'
        password_reset_address:
            policy: 'fixed_window'
            limit: '%app.rate_limit.password_reset_address.limit%'
            interval: '%app.rate_limit.password_reset_address.interval%'
        password_reset_use:
            policy: 'fixed_window'
            limit: '%app.rate_limit.password_reset_use.limit%'
            interval: '%app.rate_limit.password_reset_use.interval%'
        # An invitation link is read and accepted with no session. The token is 256 random bits, so the budget is not what
        # protects it; it keeps a client from hammering the table, reading and accepting from one budget.
        invitation_link:
            policy: 'fixed_window'
            limit: '%app.rate_limit.invitation_link.limit%'
            interval: '%app.rate_limit.invitation_link.interval%'
        # A phone pairing link is claimed with no session (docs/SPEC.md § 7, 2026-09-23 09:45, slice 4). Links are 256
        # random bits, so the budget is not what protects them; it keeps a client from hammering the table.
        scan_pairing_claim:
            policy: 'fixed_window'
            limit: '%app.rate_limit.scan_pairing_claim.limit%'
            interval: '%app.rate_limit.scan_pairing_claim.interval%'
        # A paired phone's scans, choices and token renewals, per pairing: a till's fastest pace with room to spare.
        scan_pairing_phone:
            policy: 'sliding_window'
            limit: '%app.rate_limit.scan_pairing_phone.limit%'
            interval: '%app.rate_limit.scan_pairing_phone.interval%'
        # A paired phone's photos, per pairing: each is up to a product photo's size, so far fewer than its scans.
        scan_pairing_photo:
            policy: 'sliding_window'
            limit: '%app.rate_limit.scan_pairing_photo.limit%'
            interval: '%app.rate_limit.scan_pairing_photo.interval%'
        # A notification mail's stop link, confirmed with no session. Its token is an HMAC, so the budget is not what
        # protects it; it keeps a client from hammering the table, with room for a person clearing a full inbox.
        notification_mail_stop:
            policy: 'fixed_window'
            limit: '%app.rate_limit.notification_mail_stop.limit%'
            interval: '%app.rate_limit.notification_mail_stop.interval%'
        # A browser's error reports, posted by anyone, signed in or not. The page itself sends at most five per load, so
        # this only keeps a client from flooding the error tracker through the API.
        client_errors:
            policy: 'fixed_window'
            limit: '%app.rate_limit.client_errors.limit%'
            interval: '%app.rate_limit.client_errors.interval%'
        # « Essayer la démo » signs a visitor in with no account, and every entry spends a whole sandbox the worker then
        # builds again: per client, ten an hour, then 429.
        demo_entry:
            policy: 'fixed_window'
            limit: '%app.rate_limit.demo_entry.limit%'
            interval: '%app.rate_limit.demo_entry.interval%'
