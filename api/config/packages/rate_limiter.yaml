framework:
    rate_limiter:
        # The second factor is six digits with one step of leeway either way, which is a small space to guess
        # in: three valid codes per million, and a patient attacker who already has the password. Keyed on the
        # pending user rather than the IP, so a botnet does not get one budget per address.
        mfa_verify:
            policy: 'fixed_window'
            limit: 5
            interval: '5 minutes'
        # Public signup mails whoever asks, so both ends are budgeted. Per client, five asks an hour answer 429 past that;
        # per address, one mail in fifteen minutes, and a second ask gets the same 202 with nothing sent.
        signup_client:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'
        signup_address:
            policy: 'fixed_window'
            limit: 1
            interval: '15 minutes'
