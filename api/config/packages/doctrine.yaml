doctrine:
    dbal:
        # Two roles (docs/THREAT-MODEL.md): the application reads and writes rows as its own, which cannot rewrite the
        # journal, run a program on the server or change the schema; the owner of the schema migrates it, as
        # `doctrine:migrations:migrate` (config/packages/doctrine_migrations.yaml), from the migrate service alone. The api and worker are never
        # handed the owner's address, so this connection is only ever opened where it is.
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'

                # "sessions" is owned by the PDO session handler (migration Version20260909000000), not by an entity.
                schema_filter: ~^(?!sessions$)~

                # The recipe's '%kernel.debug%' keeps a backtrace for every query of a request: an import of 1000 rows ran
                # past 128 MB on them alone (docs/SPEC.md § 7, 2026-09-19). The profiler still lists every query and its time.
                profiling_collect_backtrace: false
            owner:
                url: '%env(resolve:DATABASE_MIGRATION_URL)%'
                schema_filter: ~^(?!sessions$)~
                profiling_collect_backtrace: false

        # Value objects stored through custom mapping types (docs/SPEC.md § 3 Architecture style).
        types:
            email: App\Identity\Infrastructure\Doctrine\EmailType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                # Entities live in each context's Domain/ (docs/SPEC.md § 3 Architecture style); the attribute driver
                # scans the whole tree and maps only classes carrying #[ORM\Entity].
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App
        dql:
            string_functions:
                # A list's words, lower case without accents, as its trigram index reads them (docs/SPEC.md § 7).
                SEARCH_TEXT: App\Shared\Infrastructure\Doctrine\SearchText
                JSON_VALUES: App\Shared\Infrastructure\Doctrine\JsonValues
                JSON_HAS_KEY: App\Shared\Infrastructure\Doctrine\JsonHasKey
        filters:
            # docs/SPEC.md § 3 Tenancy: off until CompanyGuard acts for a company, lifted when the request ends.
            company:
                class: App\Shared\Infrastructure\Doctrine\CompanyFilter
                enabled: false

when@test:
    doctrine:
        dbal:
            connections:
                # "TEST_TOKEN" is typically set by ParaTest
                default:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                owner:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
