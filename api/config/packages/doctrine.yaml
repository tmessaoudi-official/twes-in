doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # "sessions" is owned by the PDO session handler (migration Version20260909000000), not by an entity.
        schema_filter: ~^(?!sessions$)~

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # Value objects stored through custom mapping types (docs/SPEC.md § 3 Architecture style).
        types:
            email: App\Identity\Infrastructure\Doctrine\EmailType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                # Entities live in each context's Domain/ (docs/SPEC.md § 3 Architecture style); the attribute driver
                # scans the whole tree and maps only classes carrying #[ORM\Entity].
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App
        filters:
            # docs/SPEC.md § 3 Tenancy: off until CompanyGuard acts for a company, lifted when the request ends.
            company:
                class: App\Shared\Infrastructure\Doctrine\CompanyFilter
                enabled: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
