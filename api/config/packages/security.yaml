security:
    password_hashers:
        # argon2id, tuned: 64 MiB memory, 3 passes, one lane (PHP's default) (PASSWORD_ARGON2ID present on the host and in the
        # FrankenPHP image, checked 2026-09-09). Re-tune in one place; hashes carry their own parameters.
        App\Identity\Infrastructure\Security\SecurityUser:
            algorithm: argon2id
            memory_cost: 65536
            time_cost: 3

    providers:
        # Loads the security snapshot through the Identity repository port (docs/SPEC.md § 3 Architecture style).
        app_user_provider:
            id: App\Identity\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Identity\Infrastructure\Security\UserChecker
            entry_point: App\Identity\Infrastructure\Security\JsonAuthenticationEntryPoint
            # JSON login: {"email": "...", "password": "..."} to POST /api/auth/login. Session id migrates on
            # success (session_fixation_strategy default). Handlers answer JSON and write the audit rows.
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: App\Identity\Infrastructure\Security\LoginSuccessHandler
                failure_handler: App\Identity\Infrastructure\Security\LoginFailureHandler
            # Symfony's default login limiter: max_attempts per account and IP, five times that per IP. Wider than
            # the persisted account lockout (app.auth.lock_after_failures), which is the per-account control.
            login_throttling:
                max_attempts: 10
                interval: '15 minutes'
            logout:
                path: api_auth_logout
                # CSRF for the whole API, login and logout included, is framework.csrf_protection (stateless, header
                # only) asked by App\Identity\Infrastructure\Security\CsrfRequestListener before the firewall.
                enable_csrf: false

    # Only the first matching rule applies. Health stays public: compose --wait and the image healthcheck hit it.
    access_control:
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        # Invitation links are opened from a mail client, so under SameSite=Strict they arrive with no session
        # cookie at all: these two operations are designed logged out (docs/SPEC.md § 3 Auth, onboarding).
        - { path: ^/api/invitations, roles: PUBLIC_ACCESS }
        # The second half of a login: by design no session exists yet, so there is no role to require. What
        # authorises it is the pending marker the password step left in this same session, and the endpoint
        # is rate limited (ruling of 2026-09-10).
        - { path: ^/api/auth/mfa/verify$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hashing is slow by design; tests use the lowest argon2id parameters libsodium accepts (3 passes, 10 KiB).
            App\Identity\Infrastructure\Security\SecurityUser:
                algorithm: argon2id
                memory_cost: 10
                time_cost: 3
