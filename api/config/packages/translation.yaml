framework:
    # French is the product's default (docs/SPEC.md); English is the second language, with parity checked on
    # the SPA side by web/src/app/i18n-parity.spec.ts. These files carry only what the API itself sends: mail.
    default_locale: fr
    enabled_locales: ['fr', 'en']
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks:
            - fr
