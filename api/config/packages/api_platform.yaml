api_platform:
    title: twes-in API
    version: 0.1.0
    # Plain JSON in and out, except a list: a list is paged, and plain JSON has nowhere to say which page it is and how
    # many rows the list holds, so a collection operation answers Hydra (JSON-LD) with `totalItems` and `view`
    # (docs/SPEC.md § 7, lists at scale). JSON-LD is registered here and a collection operation names it as its only
    # `outputFormats`; App\Shared\Infrastructure\ApiPlatform\JsonLdOnlyWhereNamed takes it off every other operation,
    # since a default format list would be merged into the operation's own rather than replace it. Docs formats keep the
    # OpenAPI JSON export and the HTML page.
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    # Errors follow the same decision. The default error_formats still lists jsonld FIRST, and a browser sending
    # "Accept: */*" therefore negotiated a format that is not enabled: every API Platform error answered
    # 500 "Serialization for the format jsonld is not supported" instead of its own status (docs/SPEC.md § 7).
    error_formats:
        jsonproblem: ['application/problem+json']
        json: ['application/json']
    docs_formats:
        json: ['application/json']
        # Every Hydra answer links its API documentation; API Platform serves it even where docs are disabled.
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        # A page holds 25 rows unless the list asks for another size, never more than 100.
        pagination_items_per_page: 25
        pagination_maximum_items_per_page: 100
        pagination_client_items_per_page: true
        # Session-authenticated on the same origin: resources need the session, so nothing here is stateless.
        stateless: false
        cache_headers:
            vary: ['Content-Type', 'Origin']
    # Resources live in each context's Infrastructure/ApiPlatform/ (docs/SPEC.md § 3 Architecture style).
    mapping:
        paths: ['%kernel.project_dir%/src']
    # /api/auth/login and /api/auth/logout are firewall endpoints and /api/health a plain controller, not resources;
    # App\Identity\Infrastructure\ApiPlatform\OpenApiExtras documents them so the generated TypeScript types carry their shapes.

when@prod:
    api_platform:
        # The contract ships inside the TypeScript client; a live docs page in production is one surface too many.
        enable_docs: false
