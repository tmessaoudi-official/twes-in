# API Platform — the REST surface. `CLAUDE.md` § "The Symfony ecosystem is the ONLY vocabulary" names this as the
# MANDATED mechanism (API Resources instead of a `toArray()` per endpoint, its pagination extension instead of a
# hand-rolled limit/offset), so this file is that rule made real.
#
# Every value below is a deliberate CONTRACT decision, and § "The API contract is ours to design" says the contract
# is ours to design and load-bearing once the Flutter client ships to a store. It has not shipped, so these are
# provisional and recorded as such in `docs/plans/reimplementation-strategy.plan.md`. Nothing here inherits an
# Invoice Ninja shape: no unix-second integers, no `double` money, no `_method=put`, no `per_page=999999`.
api_platform:
    title: 'twes-in API'
    description: 'Invoicing and billing. Multi-tenant, tenant-isolated by PostgreSQL row-level security.'

    # The contract is VERSIONED DELIBERATELY, not incidentally. A shipped mobile client updates on app-store
    # timelines, so a field rename is a breaking change with a migration plan.
    version: '0.1.0'

    # WHERE THE RESOURCES LIVE. API Platform scans `src/Entity` and `src/ApiResource` by default; ours are under
    # `src/UI/Http/ApiResource` because § Architecture puts the transport boundary in `UI/` and forbids the
    # framework reaching into `Domain/`. Without this the entrypoint renders with no resources at all -- and that
    # failure is silent, which is the shape this repository refuses.
    mapping:
        paths:
            - '%kernel.project_dir%/src/UI/Http/ApiResource'

    # NOTE the /api prefix is set by the ROUTE IMPORT in `config/routes/api_platform.yaml`, not here: API Platform
    # 4.3 has no `routes` option. Front-ends are served from the same origin by the same FrankenPHP process, which
    # is what keeps `mobile/web/`'s same-origin controls intact -- a cross-origin API would undo them.

    # EVERY REFUSAL THAT IS NOT A SERVER FAULT GETS A STATUS, and the tenancy one is the first entry because it
    # was answering the wrong one. `NoTenantBound` is Wave 1's boundary rule -- no tenant-less path may reach
    # tenant data -- raised from five repositories. Until 2026-08-23 all five raised a bare `\RuntimeException`,
    # so an authorization-shaped refusal arrived as an untyped **500** (round 4, R4S-5 / R4K-11).
    #
    # No data ever leaked: the refusal is fail-closed and always was. What was wrong was the REPORT, in two ways
    # that both cost more than they look. A 500 tells a caller to retry something they must instead authenticate
    # for; and it makes a tenancy control firing indistinguishable, in logs and in monitoring, from any other
    # crash -- so the single signal that would show this boundary working was buried in noise.
    #
    # **401 rather than 403**, and this is the choice a reader is most likely to want to revisit. The request has
    # not proved WHO it is: today the only resolver is the development-only header one, and Wave 7 replaces it
    # with real authentication. 401 is "authenticate and try again", which is exactly the instruction. 403 would
    # say "we know who you are and you may not", which is a claim this code cannot make -- there is no identity to
    # deny. Recorded here rather than in a commit message so Wave 7 can revisit it deliberately.
    exception_to_status:
        Twes\Infrastructure\Tenancy\Exception\NoTenantBound: 401

    defaults:
        # STATELESS. There is no session (see framework.yaml), and a stateless API is what lets FrankenPHP run in
        # worker mode without a request leaking state into the next one.
        stateless: true

        # Pagination ON by default and CLIENT-CONTROLLABLE ONLY WITHIN A BOUND. Upstream's `per_page=999999` is
        # rejected by name in CLAUDE.md; an unbounded page size is a denial-of-service vector and, on a
        # tenant-scoped table, a way to make one request do an unbounded amount of work.
        pagination_enabled: true
        pagination_client_enabled: true
        pagination_client_items_per_page: true
        pagination_items_per_page: 25
        pagination_maximum_items_per_page: 100

    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']

    # PROBLEM DETAILS (RFC 9457) for errors rather than a bespoke envelope. A documented, standard error shape is
    # one fewer thing three clients have to agree about by convention.
    error_formats:
        jsonproblem: ['application/problem+json']

    # The docs and the OpenAPI document are the contract's machine-readable form, which is what
    # `completeness-reviewer` treats as a tier an API change must reach.
    enable_docs: true
    enable_entrypoint: true

    # SWAGGER UI IS ON, and the comment here previously said the opposite for a reason that was WRONG.
    #
    # It read: *"OFF: no SwaggerUI-driven 'try it out' in production, and no ReDoc. They pull remote assets, which is
    # a same-origin and privacy question this project has already ruled on for the Flutter build."* Two errors in one
    # sentence. First, they were not off because of that — they were off because `symfony/twig-bundle` was not
    # installed, so there was no HTML renderer at all and `/api` returned
    # `400 Serialization for the format "html" is not supported` to any browser. Second, the privacy claim is false
    # for Swagger UI and ReDoc: API Platform ships BOTH locally and references them through `asset()`, resolving to
    # `public/bundles/apiplatform/`. [Verified: `swagger-ui/swagger-ui.css`, `swagger-ui/oauth2-redirect.html`,
    # `redoc/redoc.standalone.js` and the Open Sans fonts are all `asset()` calls in the bundle's own template.]
    #
    # **SCALAR IS THE ONE THAT REALLY DOES FETCH FROM A CDN** — `<script src="https://cdn.jsdelivr.net/npm/@scalar/
    # api-reference">`, hardcoded in that template with no asset indirection — so the original objection applies to
    # exactly one of the three, and Scalar stays off. `enable_swagger_ui` and `enable_re_doc` are opt-in per UI, so
    # this is a precise choice rather than an all-or-nothing one.
    enable_swagger_ui: true
    # ReDoc as well: it is local, it costs nothing to enable, and it is the better read-only reference view while
    # Swagger UI is the better "try it out" one. `/api/docs?ui=re_doc` selects it.
    enable_re_doc: true
    swagger:
        versions: [3]

    # `html` IS BACK, and it is what makes `/api` a readable page in a browser while staying a JSON API to every
    # client. Content negotiation picks per request, on the SAME URL:
    #
    #   Accept: text/html                     -> the Swagger UI documentation page
    #   Accept: application/ld+json           -> the Hydra entrypoint (the default for an API client)
    #   Accept: application/vnd.openapi+json  -> the raw OpenAPI document
    #   Accept: application/vnd.openapi+yaml  -> the same in YAML
    #
    # It was REMOVED on 2026-08-04 because `text/html` was being offered with nothing able to render it, which made a
    # browser hitting `/api` get `400 Serialization for the format "html" is not supported`. Removing it was the right
    # call THEN — offering a format we cannot produce is worse than not offering it — and re-adding it is right now
    # that Twig is installed and the renderer exists. The order matters: the renderer first, then the offer.
    docs_formats:
        jsonopenapi: ['application/vnd.openapi+json']
        yamlopenapi: ['application/vnd.openapi+yaml']
        jsonld: ['application/ld+json']
        html: ['text/html']

    openapi:
        contact:
            name: 'Takieddine MESSAOUDI'
        license:
            name: 'AGPL-3.0-or-later OR commercial'
            url: 'https://github.com/tmessaoudi-official/twes-in/blob/master/LICENSING.md'
