# Service wiring. Note what is autowired and what is NOT.
#
# `Twes\Domain\` is deliberately ABSENT from autowiring. The domain has no services -- it is entities, value
# objects and PORT INTERFACES, and CLAUDE.md § Architecture requires it to depend on nothing. Registering it
# here would let the container instantiate domain objects, which is how a framework starts reaching inside a
# layer that is supposed to know nothing about it.
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Application/ and Infrastructure/ and UI/ only. Each is a layer permitted to know the framework.
    Twes\Application\:
        resource: '../src/Application/'

    Twes\Infrastructure\:
        resource: '../src/Infrastructure/'
        exclude:
            # Value objects and mapping data, not services. `TenantId` in particular is a value object that
            # lives in Infrastructure/ by ruling (see CLAUDE.md § Gotchas on tenancy as ambient context), so it
            # must not become an autowired service.
            - '../src/Infrastructure/Tenancy/TenantId.php'
            # Doctrine entities are ROWS, not services -- the container must never construct one.
            - '../src/Infrastructure/Persistence/Doctrine/Entity/'
            # The savepoint-guard WRAPPERS. Each is constructed by the middleware around an object DBAL supplies
            # (a Driver, a driver Connection, a prepared Statement), so none can be autowired and none should be
            # a service: the container listed all three before this exclusion existed, purely because they sit
            # under an autowired namespace. Only the MIDDLEWARE itself is a service -- see its own entry below.
            - '../src/Infrastructure/Tenancy/Doctrine/SavepointTenantBindingDriver.php'
            - '../src/Infrastructure/Tenancy/Doctrine/SavepointTenantBindingConnection.php'
            - '../src/Infrastructure/Tenancy/Doctrine/SavepointTenantBindingStatement.php'
            # `RowHydrator` is a namespace for three static functions, not a service. It has no constructor
            # dependencies and nothing injects it — `DoctrineInvoiceRepository` calls it statically, which is
            # deliberate (see its docblock: a separate class for testability, not for injection).
            - '../src/Infrastructure/Persistence/Doctrine/RowHydrator.php'
            # The provisioning-guard DRIVER, for the same reason as the savepoint wrappers: the middleware constructs
            # it around a Driver that DBAL supplies, so it cannot be autowired and must not be a service.
            - '../src/Infrastructure/Tenancy/Doctrine/ConnectionProvisioningGuardDriver.php'

    Twes\UI\:
        resource: '../src/UI/'
        exclude:
            # API resources are DTOs -- data crossing the transport boundary, not services. Their constructors take
            # scalars, so the container cannot autowire them and must not try; this is the same argument that
            # excludes the Doctrine entities above. The state PROVIDER is a service and stays autowired.
            - '../src/UI/Http/ApiResource/'

    # THE SAVEPOINT TENANT-BINDING GUARD, on the RUNTIME connection only.
    #
    # `autoconfigure: false` is the load-bearing part. DoctrineBundle registers an autoconfiguration for
    # `Doctrine\DBAL\Driver\Middleware` that tags every implementation with a bare `doctrine.middleware`, which
    # means EVERY connection -- and `debug:container` confirmed it: before this entry existed the middleware
    # appeared as both `...SavepointTenantBindingMiddleware.default` and `...owner`. Leaving autoconfiguration on
    # while adding a scoped tag would produce both the scoped and the unscoped registration rather than replacing
    # it.
    #
    # Scoped to `default` because `owner` exists solely so migrations have a credential that is not the
    # application's. A migration is legitimately tenant-less and runs before any tenant exists, so a tenancy guard
    # there guards nothing and would only be able to fail. The security boundary between the two connections is
    # described in doctrine.yaml.
    Twes\Infrastructure\Tenancy\Doctrine\SavepointTenantBindingMiddleware:
        autowire: true
        autoconfigure: false
        tags:
            - { name: 'doctrine.middleware', connection: 'default' }

    # THE INVOICE REPOSITORY PORT → its Doctrine adapter.
    #
    # An EXPLICIT alias, because Symfony will not create one here. Auto-aliasing an interface to its single
    # implementation happens when the INTERFACE is found in an autowired resource, and `Twes\Domain\` is
    # deliberately absent from autowiring — the domain has no services and registering it would let the container
    # instantiate domain objects (see the comment at the top of this file). So without this line the alias simply
    # does not exist, and the first `Application/` handler to ask for `InvoiceRepository` fails to autowire with a
    # message about an unresolvable argument rather than about a missing alias.
    #
    # This is the shape every future domain port will need: the port is in `Domain/`, the adapter in
    # `Infrastructure/`, and the binding between them is configuration.
    Twes\Domain\Document\InvoiceRepository: '@Twes\Infrastructure\Persistence\Doctrine\DoctrineInvoiceRepository'

    # THE CONNECTION PROVISIONING GUARD -- obligations 2, 3 and 4 of Wave 1's connection-lifecycle list.
    #
    # Same scoping and the same `autoconfigure: false` reasoning as the savepoint middleware above: DoctrineBundle
    # tags every `Driver\Middleware` for EVERY connection, and this belongs on the runtime connection only. The
    # `owner` connection is the migrations credential -- it is SUPPOSED to own the tenant tables, so asserting that it
    # cannot would fail by design.
    #
    # THE TTL IS THE STALENESS WINDOW, and it is here rather than hidden in the class because it is the one number a
    # deployment might argue about: it bounds how long an `ALTER ROLE twes BYPASSRLS` can go unnoticed by the runtime
    # check. 300s is chosen against the measurement that made caching necessary at all -- the assertions cost ~10.8 ms,
    # so at 300s a busy process pays them roughly once per five minutes instead of once per request. Lower it and the
    # cost returns; raise it and the window widens. `scripts/gates/schema-tenancy.php` checks the same role attributes,
    # ownership and TRUNCATE at deploy time, which is what makes a runtime window tolerable rather than the only line
    # of defence.
    #
    # `assertRevokedCapabilities` is FALSE outside production on purpose and NOT keyed on `%kernel.environment%`: the
    # real question is whether this database has had its capabilities revoked, and the provisioned test database
    # deliberately grants TEMPORARY because the column-fidelity suite needs a scratch table.
    Twes\Infrastructure\Tenancy\Doctrine\ConnectionProvisioningGuardMiddleware:
        autoconfigure: false
        arguments:
            $isolation: '@Twes\Infrastructure\Tenancy\PostgresRowLevelSecurityIsolation'
            $verifiedProvisioning: '@cache.app'
            $verificationTtl: 300
            $assertRevokedCapabilities: '%env(bool:TWES_ASSERT_REVOKED_CAPABILITIES)%'
        tags:
            - { name: 'doctrine.middleware', connection: 'default' }
