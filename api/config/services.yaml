# Service wiring. Note what is autowired and what is NOT.
#
# `Twes\Domain\` is deliberately ABSENT from autowiring as a RESOURCE. It is mostly entities, value objects and
# PORT INTERFACES, and CLAUDE.md § Architecture requires it to depend on nothing; importing the namespace would let
# the container instantiate anything under it, which is how a framework starts reaching inside a layer that is
# supposed to know nothing about it.
#
# **It is not true that the domain has no services at all, and this comment said so until the invoice write path
# landed.** `DocumentNumberAllocator` is one -- stateless, with a port as its only collaborator -- and it has an
# explicit entry below. The rule that survives is the one that was doing the work: no resource import, and every
# domain class the container may construct is named individually with the argument for it written down.
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Application/ and Infrastructure/ and UI/ only. Each is a layer permitted to know the framework.
    Twes\Application\:
        resource: '../src/Application/'

    Twes\Infrastructure\:
        resource: '../src/Infrastructure/'
        exclude:
            # Value objects and mapping data, not services. `TenantId` in particular is a value object that
            # lives in Infrastructure/ by ruling (see CLAUDE.md § Gotchas on tenancy as ambient context), so it
            # must not become an autowired service.
            - '../src/Infrastructure/Tenancy/TenantId.php'
            # Doctrine entities are ROWS, not services -- the container must never construct one.
            - '../src/Infrastructure/Persistence/Doctrine/Entity/'
            # The savepoint-guard WRAPPERS. Each is constructed by the middleware around an object DBAL supplies
            # (a Driver, a driver Connection, a prepared Statement), so none can be autowired and none should be
            # a service: the container listed all three before this exclusion existed, purely because they sit
            # under an autowired namespace. Only the MIDDLEWARE itself is a service -- see its own entry below.
            - '../src/Infrastructure/Tenancy/Doctrine/SavepointTenantBindingDriver.php'
            - '../src/Infrastructure/Tenancy/Doctrine/SavepointTenantBindingConnection.php'
            - '../src/Infrastructure/Tenancy/Doctrine/SavepointTenantBindingStatement.php'
            # `RowHydrator` is a namespace for three static functions, not a service. It has no constructor
            # dependencies and nothing injects it — `DoctrineInvoiceRepository` calls it statically, which is
            # deliberate (see its docblock: a separate class for testability, not for injection).
            - '../src/Infrastructure/Persistence/Doctrine/RowHydrator.php'
            # The provisioning-guard DRIVER, for the same reason as the savepoint wrappers: the middleware constructs
            # it around a Driver that DBAL supplies, so it cannot be autowired and must not be a service.
            - '../src/Infrastructure/Tenancy/Doctrine/ConnectionProvisioningGuardDriver.php'
            # The TENANT-BINDING wrappers, for the same reason as the savepoint trio above: the middleware constructs
            # each one around an object DBAL supplies, so neither can be autowired and neither must be a service.
            - '../src/Infrastructure/Tenancy/Doctrine/TenantBindingDriver.php'
            - '../src/Infrastructure/Tenancy/Doctrine/TenantBindingConnection.php'

    Twes\UI\:
        resource: '../src/UI/'
        exclude:
            # API resources are DTOs -- data crossing the transport boundary, not services. Their constructors take
            # scalars, so the container cannot autowire them and must not try; this is the same argument that
            # excludes the Doctrine entities above. The state PROVIDER is a service and stays autowired.
            - '../src/UI/Http/ApiResource/'

    # THE SAVEPOINT TENANT-BINDING GUARD, on the RUNTIME connection only.
    #
    # **`connection: 'default'` IS THE LOAD-BEARING PART, and this comment said `autoconfigure: false` was for two
    # commits.** DoctrineBundle registers an autoconfiguration for `Doctrine\DBAL\Driver\Middleware` that tags every
    # implementation with a BARE `doctrine.middleware`, and a bare tag really does mean every connection -- so with
    # NO explicit tag this middleware lands on `owner` as well. That much of the original note was right, and it is
    # what `debug:container` showed when it appeared as both `...SavepointTenantBindingMiddleware.default` and
    # `...owner`.
    #
    # What was WRONG is the next step it took: that leaving autoconfiguration on *while adding a scoped tag* would
    # produce both registrations. It does not. `MiddlewaresPass` builds its connection map by SKIPPING every tag with
    # no `connection` attribute (`continue` at MiddlewaresPass.php:38-44), so the bare autoconfigured tag contributes
    # nothing, the map holds `default` alone, and line 54 then excludes every other connection. [Verified: dropping
    # `autoconfigure: false` leaves the owner connection unwrapped -- `TenantBindingWiringTest` stays green -- while
    # dropping the scoped tag instead turns its owner case red.]
    #
    # `autoconfigure: false` is KEPT for the honest, smaller reason: without it `debug:container --tag` lists a second
    # tag for the same service with an EMPTY connection column, which reads exactly like an unscoped registration. A
    # phantom entry in the one command a reader would use to check this scoping is worth one line to remove.
    #
    # Scoped to `default` because `owner` exists solely so migrations have a credential that is not the
    # application's. A migration is legitimately tenant-less and runs before any tenant exists, so a tenancy guard
    # there guards nothing and would only be able to fail. The security boundary between the two connections is
    # described in doctrine.yaml.
    Twes\Infrastructure\Tenancy\Doctrine\SavepointTenantBindingMiddleware:
        autowire: true
        autoconfigure: false
        tags:
            - { name: 'doctrine.middleware', connection: 'default' }

    # THE TENANT BINDING ITSELF — the call site that did not exist until 2026-08-07.
    #
    # `PostgresRowLevelSecurityIsolation::bind()` was written in Wave 0 and called by NOTHING; the MAXIMAL panel for
    # the Wave 1 boundary found all three mentions of it under `src/` were docblock prose. Without this entry
    # `twes.tenant_id` is never written, so every tenant-owned read returns nothing and every write is refused by
    # row-level security — `POST /api/invoices` answered SQLSTATE 42501 and a tenant's own document 404'd.
    #
    # `connection: default` for the reason the savepoint middleware documents above -- WITHOUT it, DoctrineBundle's
    # bare autoconfigured tag installs this on EVERY connection including `owner`, and migrations run there, are
    # legitimately tenant-less, and must not be bound. `autoconfigure: false` is cosmetic rather than load-bearing;
    # read that comment for the measurement, and note it corrects an earlier version of itself.
    Twes\Infrastructure\Tenancy\Doctrine\TenantBindingMiddleware:
        autowire: true
        autoconfigure: false
        tags:
            - { name: 'doctrine.middleware', connection: 'default' }

    # THE INVOICE REPOSITORY PORT → its Doctrine adapter.
    #
    # An EXPLICIT alias, because Symfony will not create one here. Auto-aliasing an interface to its single
    # implementation happens when the INTERFACE is found in an autowired resource, and `Twes\Domain\` is
    # deliberately absent from autowiring — the domain has no services and registering it would let the container
    # instantiate domain objects (see the comment at the top of this file). So without this line the alias simply
    # does not exist, and the first `Application/` handler to ask for `InvoiceRepository` fails to autowire with a
    # message about an unresolvable argument rather than about a missing alias.
    #
    # This is the shape every future domain port will need: the port is in `Domain/`, the adapter in
    # `Infrastructure/`, and the binding between them is configuration.
    Twes\Domain\Document\InvoiceRepository: '@Twes\Infrastructure\Persistence\Doctrine\DoctrineInvoiceRepository'

    # THE CONNECTION PROVISIONING GUARD -- obligations 2, 3 and 4 of Wave 1's connection-lifecycle list.
    #
    # Same scoping and the same `autoconfigure: false` reasoning as the savepoint middleware above: DoctrineBundle
    # tags every `Driver\Middleware` for EVERY connection, and this belongs on the runtime connection only. The
    # `owner` connection is the migrations credential -- it is SUPPOSED to own the tenant tables, so asserting that it
    # cannot would fail by design.
    #
    # THE TTL IS THE STALENESS WINDOW, and it is here rather than hidden in the class because it is the one number a
    # deployment might argue about: it bounds how long an `ALTER ROLE twes BYPASSRLS` can go unnoticed by the runtime
    # check. 300s is chosen against the measurement that made caching necessary at all -- the assertions cost ~10.8 ms,
    # so at 300s a busy process pays them roughly once per five minutes instead of once per request. Lower it and the
    # cost returns; raise it and the window widens. `scripts/gates/schema-tenancy.php` checks the same role attributes,
    # ownership and TRUNCATE at deploy time, which is what makes a runtime window tolerable rather than the only line
    # of defence.
    #
    # `assertRevokedCapabilities` is FALSE outside production on purpose and NOT keyed on `%kernel.environment%`: the
    # real question is whether this database has had its capabilities revoked, and the provisioned test database
    # deliberately grants TEMPORARY because the column-fidelity suite needs a scratch table.
    Twes\Infrastructure\Tenancy\Doctrine\ConnectionProvisioningGuardMiddleware:
        autoconfigure: false
        arguments:
            $isolation: '@Twes\Infrastructure\Tenancy\PostgresRowLevelSecurityIsolation'
            $verifiedProvisioning: '@cache.app'
            $verificationTtl: 300
            $assertRevokedCapabilities: '%env(bool:TWES_ASSERT_REVOKED_CAPABILITIES)%'
        tags:
            - { name: 'doctrine.middleware', connection: 'default' }

    # THE REQUEST-TENANCY SEAM. Wave 1 scaffolding; Wave 7 replaces the resolver with an authenticated one and
    # DELETES the header adapter, the env variable and the gate together.
    #
    # `HeaderTenantResolver` trusts a caller-supplied header, so it is NOT authentication and is disabled in every
    # committed configuration. Three independent controls, because one would not be enough: it refuses loudly when
    # not permitted, `TWES_TRUST_TENANT_HEADER` is 0 in api/.env AND infra/.env, and
    # `scripts/gates/no-forgeable-tenancy-in-production.sh` refuses any other value in a tracked file.
    Twes\UI\Http\Tenancy\HeaderTenantResolver:
        arguments:
            $permitted: '%env(bool:TWES_TRUST_TENANT_HEADER)%'

    # The PORT → the only adapter that exists today. Explicit rather than auto-aliased so that the day Wave 7 adds
    # a second implementation, the choice of which one is wired is a visible one-line diff here rather than an
    # autowiring accident -- and so that removing the header adapter breaks THIS line loudly.
    Twes\Infrastructure\Tenancy\TenantResolver: '@Twes\UI\Http\Tenancy\HeaderTenantResolver'

    # ==============================================================================================================
    # THE INVOICE WRITE PATH. Three more domain ports, each needing the same explicit alias for the same reason as
    # `InvoiceRepository` above: `Twes\Domain\` is not an autowired resource, so Symfony creates no alias for an
    # interface that lives there. Without these lines the failure is a message about an unresolvable ARGUMENT, which
    # points at the consumer rather than at the missing binding.
    # ==============================================================================================================

    # TIME. `SystemClock` and never `FrozenClock`, which exists for tests -- an ambient `time()` call in `Domain/` is
    # a P0 that `no-ambient-calls-in-domain.php` refuses, so the clock is a port and this line is where the real one
    # is chosen. Explicit rather than auto-aliased because there are TWO implementations, so an auto-alias would be
    # impossible anyway and a wrong choice here is a frozen production clock.
    Twes\Domain\Shared\Clock: '@Twes\Infrastructure\Shared\SystemClock'

    # Identifier generation. UUIDv7, so identifiers sort by creation time -- which is what v7 is FOR, and the reason
    # `symfony/uid` is used rather than a hand-rolled layout that failed to ascend for about half of all consecutive
    # same-millisecond pairs.
    #
    # A UUIDv7 IS AN ORDERING ARTEFACT AND NEVER A SECRET (developer ruling, CLAUDE.md § Gotchas 2026-08-05): the
    # random field is incremented rather than redrawn within a millisecond, and the generator's seed is recoverable
    # from its own output. So a document id may appear in a URL an authenticated tenant can reach, and the Wave 10
    # client portal gets its own `random_bytes(32)` token instead of ever using a primary key as a credential.
    Twes\Domain\Shared\IdGenerator: '@Twes\Infrastructure\Shared\UuidV7Generator'

    # The unit of work. The port is in `Application/` rather than `Domain/` because no domain invariant is expressed
    # in terms of atomicity -- see the interface. The adapter takes the DEFAULT connection: `owner` owns the
    # tenant-owned tables and can DROP POLICY on them, which `no-owner-connection-in-application.php` refuses.
    Twes\Application\Shared\TransactionalScope: '@Twes\Infrastructure\Persistence\Doctrine\DbalTransactionalScope'

    # The gapless counter. A PostgreSQL SEQUENCE is FORBIDDEN as the implementation (CLAUDE.md § Gotchas
    # 2026-07-31): `nextval()` does not roll back, so a failed issue would leave a permanent hole in a legal
    # sequence. The adapter is a counter ROW under SELECT ... FOR UPDATE, and it refuses to run outside a
    # transaction.
    Twes\Domain\Document\DocumentNumberSequence: '@Twes\Infrastructure\Persistence\Doctrine\PostgresDocumentNumberSequence'

    # `DocumentNumberAllocator` is a DOMAIN SERVICE, not a port: it has exactly one implementation by construction,
    # because it holds no state and only turns a counter into a `DocumentNumber`.
    #
    # IT IS THE FIRST ENTRY IN THIS FILE FOR A CONCRETE `Twes\Domain\` CLASS, so the top comment's claim that "the
    # domain has no services" needed amending rather than tiptoeing past -- see it. The distinction that makes this
    # legitimate: what that comment refuses is the RESOURCE IMPORT, which would let the container instantiate
    # anything under `Domain/` including entities and value objects. One explicit entry, argued, is a different act.
    #
    # The alternative -- an application handler doing `new DocumentNumberAllocator($sequence)` -- was rejected
    # because it puts the choice of sequence adapter in the handler's constructor signature, and the whole point of
    # the port is that the handler does not make that choice.
    Twes\Domain\Document\DocumentNumberAllocator:
        arguments:
            $sequence: '@Twes\Domain\Document\DocumentNumberSequence'

    # HOW WIDE A NEW DOCUMENT NUMBER IS RENDERED -- `0000041` at width 7.
    #
    # A placeholder with a deliberate shape: this is per-tenant configuration that Wave 1 has no settings table for,
    # so it is wired here, where changing it is a visible one-line diff, rather than defaulted inside a handler where
    # it would be invisible. It governs NEW numbers only -- an issued document's rendered string is persisted, and
    # re-reading it derives its own pattern from that string, so no later change here can restate a document a client
    # already holds (CLAUDE.md § Gotchas 2026-08-06).
    #
    # AN INT, NOT A REGISTERED `NumberPattern`. A service definition with a `factory:` on the value object would work
    # and is what this file said for one commit, and it contradicts the top comment directly: a value object in the
    # container is precisely what "the container instantiating domain objects" means. The handler builds the pattern
    # in its own constructor instead, so a misconfigured width still fails when the service is first used rather than
    # on the first issue attempt.
    Twes\Application\Document\IssueInvoiceHandler:
        arguments:
            $numberWidth: 7
