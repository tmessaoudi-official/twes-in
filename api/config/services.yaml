# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Empty: production logs go to STDERR (docs/SPEC.md § 7, 2026-09-17).
    env(LOG_DIRECTORY): ''
    # Session limits in seconds: 30 minutes idle, 12 hours absolute (docs/SPEC.md § 3 Auth). Checked when the container is
    # built (SessionBounds): 300 to 1,800 idle and 3,600 to 43,200 in all; the ceilings are the ruled values, which an
    # operator may only shorten.
    app.session.idle_ttl: 1800
    app.session.absolute_ttl: 43200
    # How closely a session's record knows its last use: it is written again at most this often, so a request costs one
    # read and a write only now and then. « Où vous êtes connecté » and the demo's sweep read the use this closely.
    # Checked when the container is built (SessionBounds): PT1M to PT15M.
    app.session.touch_every: 'PT5M'
    # Password lockout: after this many consecutive failures from one address the password is locked from that address
    # for this long; after the account's ceiling, counting each address's first failures alone, it is locked everywhere
    # for as long. Checked when the container is built (LockoutBounds): 3 to 20 failures, the ceiling from twice that to
    # 1000, PT5M to PT24H.
    app.auth.lock_after_failures: 5
    app.auth.account_lock_after_failures: 50
    app.auth.lock_duration: 'PT15M'
    # The rate limiters' budgets, how many over how long (config/packages/rate_limiter.yaml says what each guards), and
    # the sign-in throttling's: Symfony's default login limiter, per account and address, five times that per address.
    # Each is checked when the container is built (RateLimitBounds): 1 to 1,000 tries over one minute to a day, in words.
    app.rate_limit.login.limit: 10
    app.rate_limit.login.interval: '15 minutes'
    app.rate_limit.mfa_verify.limit: 5
    app.rate_limit.mfa_verify.interval: '5 minutes'
    app.rate_limit.passkey_sign_in.limit: 50
    app.rate_limit.passkey_sign_in.interval: '15 minutes'
    app.rate_limit.mfa_confirm.limit: 5
    app.rate_limit.mfa_confirm.interval: '5 minutes'
    app.rate_limit.signup_client.limit: 5
    app.rate_limit.signup_client.interval: '1 hour'
    app.rate_limit.signup_address.limit: 1
    app.rate_limit.signup_address.interval: '15 minutes'
    app.rate_limit.signup_complete.limit: 10
    app.rate_limit.signup_complete.interval: '15 minutes'
    app.rate_limit.password_reset_client.limit: 5
    app.rate_limit.password_reset_client.interval: '1 hour'
    app.rate_limit.password_reset_address.limit: 1
    app.rate_limit.password_reset_address.interval: '15 minutes'
    app.rate_limit.password_reset_use.limit: 20
    app.rate_limit.password_reset_use.interval: '15 minutes'
    app.rate_limit.invitation_link.limit: 20
    app.rate_limit.invitation_link.interval: '15 minutes'
    app.rate_limit.scan_pairing_claim.limit: 10
    app.rate_limit.scan_pairing_claim.interval: '15 minutes'
    app.rate_limit.scan_pairing_phone.limit: 240
    app.rate_limit.scan_pairing_phone.interval: '1 minute'
    app.rate_limit.scan_pairing_photo.limit: 20
    app.rate_limit.scan_pairing_photo.interval: '5 minutes'
    app.rate_limit.notification_mail_stop.limit: 30
    app.rate_limit.notification_mail_stop.interval: '15 minutes'
    app.rate_limit.client_errors.limit: 20
    app.rate_limit.client_errors.interval: '15 minutes'
    # A report of an error in someone's browser (POST /api/client-errors, ClientErrorController): the body refused unread past
    # its bytes, the message and the stack cut to their characters, and the reports one page load sends; the web reads all four
    # from /api/health and cuts a report to them before sending (0 reports: it sends none, and the API logs none it is sent). The CSRF proof, the page kept without its query
    # or fragment and the scrubbing stay code. Checked when the container is built (ClientErrorBounds): 1,024 to 65,536
    # bytes; 100 to 2,000 and 500 to 16,000 characters; 0 to 20 reports.
    app.client_errors.max_body: 16384
    app.client_errors.max_message: 500
    app.client_errors.max_stack: 4000
    app.client_errors.per_page: 5
    app.rate_limit.demo_entry.limit: 10
    app.rate_limit.demo_entry.interval: '1 hour'
    # Invitations: how long a mailed link works, and the page it points at. The URL is built from the same
    # origin the SPA is served from, because the link is opened from a mail client with no session. The duration is
    # checked when the container is built (InvitationBounds): P1D to P30D.
    app.invitation.valid_for: 'P7D'
    # How long the members list keeps an invitation whose link ran out unused, marked expired, to be sent again. Checked
    # when the container is built (InvitationBounds): P1D to P90D.
    app.invitation.expired_shown_for: 'P30D'
    app.invitation.accept_url: '%env(DEFAULT_URI)%/invitations/{token}'
    app.signup.link_url: '%env(DEFAULT_URI)%/signup/{token}'
    app.signup.login_url: '%env(DEFAULT_URI)%/login'
    app.platform_url: '%env(DEFAULT_URI)%/platform'
    # How long a signup link works, said in whole hours in its mail, checked when the container is built (SignupBounds):
    # PT1H to P7D.
    app.signup.valid_for: 'PT24H'
    # Forgot password: the page a reset link opens, and how long it works, checked when the container is built
    # (PasswordResetBounds): PT15M to PT24H.
    app.password_reset.link_url: '%env(DEFAULT_URI)%/reset-password/{token}'
    app.password_reset.valid_for: 'PT1H'
    # The fewest characters a new password needs, every way one is chosen (signing up, an invitation, a change, a reset);
    # the screens read it through GET /api/auth/password/rule. Checked when the container is built (PasswordLengthBounds):
    # 12 to 64, raise only: the floor of twelve is the request's own, which no installation goes under.
    app.password.min_length: 12
    # The keys a notification mail's stop link is signed under: the first signs, every one listed reads, since a stop
    # link never expires; put a new key first and drop the old one once its mails no longer matter. The application
    # secret by default, so rotating APP_SECRET voids the links already sent unless a key of its own is listed here
    # (`'%env(MAIL_STOP_KEY)%'`). Checked when the container is built (MailStopKeysBounds): a list of one key or more, a
    # key written out at least 32 characters.
    app.notification.stop_keys: ['%kernel.secret%']
    # The windows an owner may open the company to support for, in hours, and the one the page offers first. Support
    # stays time-boxed: checked when the container is built (SupportWindowBounds), whole hours from 1 to 72, each once,
    # shortest first, the first offered among them; fewer or shorter windows only.
    app.support.windows_hours: [1, 24, 72]
    app.support.default_window_hours: 24
    # How much of its build /api/health says to anyone: `full` (version, commit, the kernel's mode and the deployment, the
    # footer's build line) or `version` (the release alone, without « -dirty »). Checked when the container is built
    # (HealthBounds).
    app.health.public_build: full
    # A notification's mail: where its button opens the app, and the page its stop link opens, which asks before
    # turning that kind's mail off.
    app.notification.open_url: '%env(DEFAULT_URI)%/'
    app.notification.stop_url: '%env(DEFAULT_URI)%/notifications/stop/{token}'
    # The seconds a request whose work grows with what a person handed in or chose is given (LongRequest): an import,
    # its undo, the restore of what the undo took, a printed selection. The rows a file may hold are the platform's setting
    # (ImportSettings), whose ceiling is the largest file one request bears: 5,000 product rows took 35 s on a developer's
    # machine, release kernel, and 100 drafts printed 37 s; a shop's small computer may take several times that. PHP's own
    # limit is lifted to it on those routes alone, never shortened, and infra/web/nginx.conf waits as long for the answer
    # (LongRequestRoutesTest). Checked when the container is built (LongRequestBounds): 60 to 900.
    app.long_request.max_seconds: 240
    # The hours a key sent with a write that adds is kept, with what the write answered, for a retry to be answered again
    # rather than made again (SubmissionGuard): a lost answer is retried within minutes; the hourly purge forgets the rest.
    # A claim whose work never committed is taken back once it is older than app.long_request.max_seconds.
    app.submissions.kept_hours: 24
    # The minutes the web keeps a write's key while no answer came, for the same write sent again to carry it (the web's
    # SubmissionKeys, told it through /api/health): past them the same values sent again are a new write. Checked when the
    # container is built (SubmissionRetryBounds): from 1 minute to below what the API keeps a key, app.submissions.kept_hours.
    app.submissions.retry_minutes: 15
    # What an imported workbook's parts may inflate to, together (64 MiB): a few kilobytes of zip can hold gigabytes, while
    # 5,000 rows (the row cap's ceiling) of twenty forty-character cells inflate to about 10 MB.
    app.import.max_inflated_bytes: 67108864
    # The most entries a list handed in may hold (ListLimits): a document of 10,000 lines took 15 s to create on a
    # developer's machine and held the worker all that while; 1,000 take under 2 s, more than a shop's longest invoice.
    app.list_limits:
        document.lines: 1000
        # The other written lists, each far above what a business reaches, so the default refuses nothing anyone sends
        # today while a crafted request of millions of entries is refused before the work it would cause.
        record.names: 50
        record.identifiers: 50
        record.taxes: 100
        record.custom_fields: 200
        product.vendors: 100
        product.places: 1000
        stock_map.changes: 5000
        role.permissions: 500
    # The queries and the log records one request keeps for the profiler, in development (BoundedDebugQueries,
    # BoundedDebugLogs): enough for any screen, while an import of thousands of rows would keep them all with their
    # parameters and run out of memory.
    app.debug.queries_kept: 2000
    app.debug.logs_kept: 2000
    # The reasons of a product's « À vérifier » the home's « À surveiller » leaves out (ProductCheckWatch): what clears only
    # product by product, which the products list's filter still finds. An import of 4,100 products lacking both read 4,013.
    app.watch.product_check_left_out: ['barcode_missing', 'category_missing']
    # The hours a draft delivery note with lines waits, unsaved, before « À surveiller » tells whoever may validate it
    # (DeliveryNoteWatch): long enough for a clerk to finish writing it, short enough for the customer still waiting.
    # Checked when the container is built (DraftWatchBounds): 1 to 72.
    app.watch.drafts_to_validate_after_hours: 2
    # Text overrides (docs/plans/text-overrides.plan.md). The screens' texts as shipped: the image's copy of the web's
    # public/i18n, mounted over it in live mode, read from the tree itself in tests.
    app.texts.screen_directory: '%kernel.project_dir%/resources/screen-texts'
    # The longest text an override may say, in characters.
    app.texts.max_length: 2000
    # The texts a page of the writers' catalogue lists unless it asks another number, and the most it may ask.
    app.texts.catalogue_page_size: 50
    app.texts.catalogue_page_max: 200
    # What no override may change, by domain: `*` a whole domain, an exact key, or `prefix.*`. The fiscal texts, and the
    # printed labels a mandatory mention or a legal status prints through (TN Code de la TVA art. 18-II, FR CGI annexe II
    # art. 242 nonies A, docs/fiscal/TN.md § 7, FR.md § 4): the HT and TTC figures, the withholding, what a credit note
    # corrects, the operation's category and date, the marks of a draft, a duplicate or a demo, and the formats.
    app.texts.locked:
        fiscal: ['*']
        pdf: ['format.*', 'invoice.corrects', 'invoice.reason', 'invoice.supply_date', 'invoice.operations', 'invoice.operations_goods', 'invoice.operations_services', 'invoice.operations_both', 'invoice.fingerprint', 'line.unit_price', 'line.net', 'totals.subtotal', 'totals.total_net', 'totals.total_tax', 'totals.total', 'totals.withheld', 'watermark.*', 'demo.*', 'copy.*']
    # The printed labels a company or the operator may word their own way; with the locked ones they class every key of
    # pdf, so a label added is classed in the change that adds it (ShippedTextsTest).
    app.texts.open:
        pdf: ['company.*', 'delivery_note.*', 'purchase_order.*', 'invoice.title', 'invoice.deposit_title', 'invoice.deposit_share_line', 'invoice.deposit_line', 'invoice.deduction_line', 'invoice.late_fee_line', 'invoice.credit_note_title', 'invoice.customer', 'invoice.customer_number', 'invoice.issue_date', 'invoice.due_date', 'invoice.customer_reference', 'invoice.payment', 'invoice.credit_transfer', 'invoice.payment_terms', 'invoice.remarks', 'invoice.received_by', 'quote.*', 'line.discount', 'line.description', 'line.quantity', 'line.unit', 'line.taxes', 'line.section_subtotal', 'totals.document_discount', 'totals.amount_due', 'totals.in_words', 'totals.in_words_credit_note', 'totals.savings', 'totals.quantities', 'totals.currency', 'payment.*', 'stamp.*', 'statement.*']
    # The hour, in the server's time, at which the data checks run each day (CheckDataEveryNight).
    app.data_check.at: '02:30'
    # How long a failed sign-in keeps the address typed and the network address it came from (at least 12 months: the
    # database refuses fewer), and the hour the nightly purge runs (PurgeFailedSignInAddressesEveryNight).
    app.audit.failed_sign_in_months: 12
    app.audit.purge_at: '02:45'
    # The nightly run that deletes the accounts whose days have passed (AccountDeletionSettings).
    app.account.deletion_at: '03:15'
    # The nightly run that removes the closed companies whose retention has ended (RemoveClosedCompanies).
    app.company.removal_at: '03:30'
    # How many days before that night a closed company's owners are told it goes (TellClosedCompaniesNearRemoval).
    # Checked when the container is built (RemovalNoticeBounds): 7 to 90.
    app.company.removal_notice_days: 30
    # How many days before the time a company paid for ends its owners are told (TellLapsingSubscriptions). Checked when
    # the container is built (LapseNoticeBounds): 1 to 30.
    app.subscription.lapse_notice_days: 7
    # Mail the API sends itself.
    app.mail.sender: '%env(MAILER_SENDER)%'
    app.product_name: 'twes-in'
    # The platform's own country until an operator picks another under « Gérer la plateforme » (platform.country): one a
    # fiscal preset is written for (api/config/fiscal), which the phones of the platform's support and legal pages start on.
    app.platform.country: 'TN'
    # The breached-password check reaches Have I Been Pwned over the network. Off in tests, which must never
    # depend on an external service (docs/SPEC.md § 7, 2026-09-09).
    app.password.breach_check_enabled: true
    # Encrypts TOTP secrets at rest (ruling of 2026-09-10). Not APP_SECRET: that one rotates for unrelated
    # reasons, and rotating this one means every enrolled authenticator has to be enrolled again.
    app.mfa.key: '%env(APP_MFA_KEY)%'
    # How long the half-authenticated state between password and second factor survives, and a passkey's options wait
    # for their answer. Checked when the container is built (PendingSecondFactorBounds): PT1M to PT15M.
    app.mfa.pending_ttl: 'PT5M'
    # How long a confirmed step-up opens what the API checks it for (the step-up list, docs/SPEC.md § 7), within the
    # same sign-in, and how many wrong answers a sign-in may give before it ends. A deployment's to set, within bounds
    # checked when the container is built (StepUpBounds): PT1M to PT15M, and 3 to 10.
    app.step_up.valid_for: 'PT5M'
    app.step_up.attempts: 5
    # Whether restoring from « Récemment supprimés » (a delete, an import's undo) asks that proof too; a merge's undo always
    # does. false asks none, as the restore only puts back what the person's own action took. true or false itself, checked
    # when the container is built (RestoreStepUpBounds): it may add a proof, never take one away.
    app.step_up.on_restore: false
    # How many recovery codes a set holds, shown once at enrolment and on each renewal; each code's shape and hashing stay
    # code. Checked when the container is built (RecoveryCodeBounds): 8 to 16.
    app.recovery_codes.per_set: 10
    # How often a page support reads under an owner's grant is written again to the company's activity log: support's
    # entry always is, and PT0M records every read. Checked when the container is built (SupportVisitBounds): PT0M to PT1H.
    app.support.read_recorded_every: 'PT15M'
    # Masks of the operator's own for an error report, each {pattern: a PCRE regular expression, replacement: text},
    # applied after the built-in ones of ScrubPersonalData, which none can change: what a deployment's own data looks like
    # (a branch code, a client's reference). A pattern PHP cannot compile refuses the container (ErrorReportingMasksBounds).
    app.error_reporting.extra_masks: []
    # How long a company an account with several companies has proved itself for stays open to this sign-in: as long as it
    # is used within the idle time, and no longer than the lifetime in all; signing out forgets it at once. Checked when the
    # container is built (CompanyProofBounds): PT5M to PT30M idle and PT1H to PT12H in all; the ceilings are the ruled
    # values, which an operator may only shorten.
    app.company_proof.idle: 'PT30M'
    app.company_proof.lifetime: 'PT12H'
    # How long « Effacer des données » keeps what it took, for its undo; then the copy and the files only it named go.
    # Checked when the container is built (ErasureUndoBounds): PT1H to P7D.
    app.erasure.undoable_for: 'PT24H'
    # How long « Récemment supprimés » keeps a deleted record, for its restore; then the copy goes and the delete is final.
    # Checked when the container is built (RecordUndoBounds): PT1H to P30D.
    app.records.undoable_for: 'PT24H'
    # How many issued documents of one company, at most, each quarter-hourly pass stores the PDF of when it could not be
    # stored at issue: enough to catch up after a renderer outage, few enough that a pass ends well inside its quarter.
    app.documents.pdf_catch_up_batch: 50
    # How many hours at most an operator lets a company's series take a day before their last number's, after its
    # computer's clock ran ahead (app:numbering:allow-earlier-days): long enough to issue the day's documents again.
    # Checked when the container is built (EarlierNumberingDaysBounds): 1 to 72, which an operator may only shorten.
    app.numbering.earlier_days_hours_max: 72
    # How long a demo sandbox may stay half built before it is taken away, its company and owner with it, so its country
    # is queued again: a build takes under a minute, and a stuck one would keep that country's demo closed. Checked when
    # the container is built (DemoBounds): PT10M to PT6H.
    app.demo.build_gives_up_after: 'PT1H'
    # How long a demo's visitor may step away and stay signed in, in seconds (a real account's is app.session.idle_ttl);
    # once that session ends, at sign-out or here, the worker takes its sandbox away. Checked when the container is built
    # (DemoBounds): from 1,800 to app.session.absolute_ttl, which ends a demo's session as it ends anyone's.
    app.demo.idle_ttl: 7200
    # What this installation is: « server », a hosted one, or « onprem », a shop's own computer (compose.onprem.yaml),
    # where the demo stays closed until an operator opens it (DemoSettings). Anything else is refused at the first read.
    app.installation: '%env(APP_INSTALLATION)%'
    # The issuer an authenticator app shows beside the account.
    app.mfa.issuer: '%app.product_name%'
    # Passkeys are bound to a relying party: the registrable domain the SPA is served under, and every exact origin
    # (scheme, host and port) it is served from. Never derived from the request's Host header.
    app.webauthn.rp_id: '%env(APP_WEBAUTHN_RP_ID)%'
    app.webauthn.origins: '%env(csv:APP_WEBAUTHN_ORIGINS)%'
    # Realtime notifications through Centrifugo (docs/SPEC.md § 7, 2026-09-13). The token key signs the browser's
    # connection token and is the same secret Centrifugo holds as client.token.hmac_secret_key; the API key
    # authorises publishing through its HTTP API. The token is short-lived: the browser asks for a new one, which a
    # session ended no longer gets, so a connection that escaped its close hears at most this many seconds more. The
    # lifetime is checked when the container is built (RealtimeTokenBounds): 60 to 300.
    app.realtime.token_key: '%env(REALTIME_TOKEN_KEY)%'
    app.realtime.token_lifetime: 120
    app.realtime.api_url: '%env(REALTIME_API_URL)%'
    app.realtime.api_key: '%env(REALTIME_API_KEY)%'
    app.realtime.push_enabled: true
    # What /platform shows of a company, said to operators on the platform's channel by kind alone: a support grant, the
    # company's standing and approval, an owner invited or joined, its subscription and the payments it declares. The
    # platform's own settings are said to everyone on the installation's channel, which operators hear as well.
    app.realtime.platform_kinds: [company, signup, invitation, membership, support_grant, subscription, payment_declaration, account, platform_setting]
    # How many notifications the centre returns at once; the unread count always covers all of them.
    app.inbox.page_size: 50
    # PDFs are rendered by a Gotenberg container (docs/SPEC.md § 2 PDF).
    app.pdf.gotenberg_url: '%env(GOTENBERG_URL)%'
    # Files live on a local volume through Flysystem, or in an S3-compatible bucket when FILES_STORAGE=s3 (docs/SPEC.md § 2 Files).
    app.files.directory: '%env(resolve:FILES_DIRECTORY)%'
    # How old bytes under a company's folder that no file row names must be before the hourly task removes them: a write
    # cut short between the bytes and the row, by a process killed or a disk that filled, leaves them, and nobody can open
    # them. Far past what any write takes between its bytes and its row, a worker's included, which no request bound holds;
    # the data check reports them once the task should have taken them. Checked when the container is built
    # (UnnamedBytesBounds): PT6H to P30D.
    app.files.unnamed_removed_after: 'PT24H'
    # How long a removed product photo is kept, restorable, before it and its three files go and stop counting in what
    # the company keeps: null keeps it as long as its product (the shipped default), else an ISO 8601 duration from a day
    # to ten years. Checked when the container is built (RemovedPhotosBounds). A removed attachment is not let go here:
    # an expense's receipt is kept with the document it supports, whatever the gallery's time.
    app.products.removed_photos_kept_for: ~
    # Under how many bytes left a disk on which a file the request prepares (a download, an import's working copy) could
    # not be written is read as out of room, and said so (ScratchFiles): the writers say only that they could not write,
    # and the largest file a request prepares, a full export, stays under this.
    app.files.scratch_room_minimum: 67108864
    # What /api/health/deep fails on (docs/START.md § 15): a message due for the worker and waiting longer than this, and
    # less than this share of the disk under the stored files left free. The wait is checked when the container is built
    # (HealthBounds): 60 to 3,600.
    app.health.oldest_waiting_seconds: 600
    app.health.disk_free_minimum: 0.2
    # Where the api's start keeps a start step that failed (infra/api/docker-entrypoint.sh, TWES_START_STEPS_DIR), which
    # the deep health names until a later start runs it through.
    app.health.start_steps_directory: '%kernel.project_dir%/var/start-steps'
    # What a person may attach to a record (docs/SPEC.md § 7, 2026-09-15): a document or a picture of one, read from its
    # bytes. nginx's client_max_body_size and PHP's upload_max_filesize/post_max_size sit just above the size.
    app.files.upload_max_bytes: 10485760
    app.files.attachment_types: ['application/pdf', 'image/png', 'image/jpeg', 'image/webp']
    app.files.attachments_per_subject: 10
    # A product's photos: how many, how large one may be, and the longest side of the two copies the server cuts, small
    # for a line and large for a page. The megapixels bound what one decode costs: a 16 MP picture takes 64 MB of
    # memory, which the API's workers can afford.
    app.products.photos_per_product: 6
    app.products.photo_max_bytes: 5242880
    app.products.photo_max_megapixels: 16
    app.products.photo_small_side: 160
    app.products.photo_large_side: 960

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
        # Domain/ is scanned too: its entities and value objects are never injected and are dropped as unused, while
        # its repository interfaces are the ports the resource aliases to their one adapter (Symfony aliases every
        # interface with a single implementation). Values and tags are attributes on the classes and interfaces that
        # take them (docs/SPEC.md § 7, 2026-10-01); what stays here is what no attribute can say.

    # Domain services take no framework attribute, so their values are named here.
    App\Texts\Domain\Service\TextLocks:
        arguments:
            $locked: '%app.texts.locked%'
    App\Texts\Domain\Service\OverrideRules:
        arguments:
            $maxLength: '%app.texts.max_length%'
    # Nor does an application service.
    App\Identity\Application\Password\NewPasswordPolicy:
        arguments:
            $minLength: '%app.password.min_length%'
    App\Tenancy\Application\Support\SupportWindows:
        arguments:
            $offered: '%app.support.windows_hours%'
            $first: '%app.support.default_window_hours%'
    App\Demo\Application\DemoSettings:
        arguments:
            $installation: '%app.installation%'

    League\Flysystem\FilesystemOperator:
        factory: ['App\Files\Infrastructure\Flysystem\FilesystemFactory', 'create']
        arguments:
            $driver: '%env(FILES_STORAGE)%'
            $directory: '%app.files.directory%'
            $bucket: '%env(FILES_S3_BUCKET)%'
            $endpoint: '%env(FILES_S3_ENDPOINT)%'
            $region: '%env(FILES_S3_REGION)%'
            $accessKey: '%env(FILES_S3_ACCESS_KEY)%'
            $secretKey: '%env(FILES_S3_SECRET_KEY)%'
            $pathStyle: '%env(bool:FILES_S3_PATH_STYLE)%'
            $httpClient: '@Symfony\Contracts\HttpClient\HttpClientInterface'

when@dev:
    parameters:
        # The browser scenarios run on the development target, every scenario of a CI shard from one address, and each
        # invitation accepted spends two of the link's budget (read, then accepted): a shard holding eleven of them crossed
        # twenty within the quarter hour, and a fresh link answered « Trop de tentatives ». The budget guards the table from
        # one client hammering it, never the link, whose 256 random bits do; production keeps twenty.
        app.rate_limit.invitation_link.limit: 200

when@test:
    parameters:
        # The tests read the web's own texts in the tree, which the image copies.
        app.texts.screen_directory: '%kernel.project_dir%/../web/public/i18n'
        # The same rule for the realtime push: the rows are asserted, the push is the adapter's own unit test.
        app.realtime.push_enabled: false
        # No test reaches the network: the check answers "not breached" and the use case is exercised through
        # its port with a fake that returns each of the three answers.
        app.password.breach_check_enabled: false
        # Files a test stores stay out of the development volume.
        app.files.directory: '%kernel.project_dir%/var/test-files'
        # The deep health check measures the machine's real disk, which a test cannot choose (a cloud VM read 0.09): a
        # share is never below 0, so no case fails on the machine it runs on. The floor's two sides are DeepHealth's
        # unit test, at a minimum of its own.
        app.health.disk_free_minimum: 0
    services:
        # Requests reach no Gotenberg either: the fake answers a PDF header followed by the page, which a test can read.
        # FacturXTest's compliant case alone drives the real one, through its adapters built by hand.
        App\Tests\Support\FakePdfRenderer: ~
        App\Shared\Application\PdfRenderer: '@App\Tests\Support\FakePdfRenderer'
        App\Tests\Support\FakeFacturXPdf: ~
        App\Shared\Application\FacturXPdf: '@App\Tests\Support\FakeFacturXPdf'
        # app:platform:reset empties on the owner's connection, outside a case's transaction: in a test it would empty
        # the suite's own database, so no test reaches it; OwnerPlatformContentsTest empties a database of its own.
        App\Tests\Support\RecordingPlatformContents: ~
        App\Tenancy\Infrastructure\Platform\PlatformContents: '@App\Tests\Support\RecordingPlatformContents'
        # A module only the tests declare, needing customers: the dependency refusals go through the API with it.
        App\Tests\Support\RecordedLogs: ~
        App\Tests\Support\Module\LedgerFixtureModule:
            tags: ['app.modules.declarations']
        # FrameworkBundle hardcodes MOCKSESSID for the mock file session storage; the functional tests assert the
        # cookie the browser will actually see, name included, so the test factory carries the real name.
        session.storage.factory.mock_file:
            class: Symfony\Component\HttpFoundation\Session\Storage\MockFileSessionStorageFactory
            arguments:
                - '%kernel.cache_dir%/sessions'
                - '__Host-twes_session'
                - !service
                    class: Symfony\Component\HttpFoundation\Session\Storage\MetadataBag
                    arguments: ['%session.metadata.storage_key%', '%session.metadata.update_threshold%']
