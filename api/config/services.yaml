# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Empty: production logs go to STDERR (docs/SPEC.md § 7, 2026-09-17).
    env(LOG_DIRECTORY): ''
    # Session limits in seconds: 30 minutes idle, 12 hours absolute (docs/SPEC.md § 3 Auth).
    app.session.idle_ttl: 1800
    app.session.absolute_ttl: 43200
    # Account lockout: after this many consecutive failures the account is locked for this long.
    app.auth.lock_after_failures: 5
    app.auth.lock_duration: 'PT15M'
    # Invitations: how long a mailed link works, and the page it points at. The URL is built from the same
    # origin the SPA is served from, because the link is opened from a mail client with no session.
    app.invitation.valid_for: 'P7D'
    app.invitation.accept_url: '%env(DEFAULT_URI)%/invitations/{token}'
    app.signup.link_url: '%env(DEFAULT_URI)%/signup/{token}'
    app.signup.login_url: '%env(DEFAULT_URI)%/login'
    app.platform_url: '%env(DEFAULT_URI)%/platform'
    app.signup.valid_for: 'PT24H'
    # Forgot password: the page a reset link opens, and how long it works.
    app.password_reset.link_url: '%env(DEFAULT_URI)%/reset-password/{token}'
    app.password_reset.valid_for: 'PT1H'
    # A notification's mail: where its button opens the app, and the page its stop link opens, which asks before
    # turning that kind's mail off.
    app.notification.open_url: '%env(DEFAULT_URI)%/'
    app.notification.stop_url: '%env(DEFAULT_URI)%/notifications/stop/{token}'
    # The seconds a request whose work grows with what a person handed in or chose is given (LongRequest): an import,
    # its undo, the restore of what the undo took, a printed selection. The rows a file may hold are the platform's setting
    # (ImportSettings), whose ceiling is the largest file one request bears: 5,000 product rows took 35 s on a developer's
    # machine, release kernel, and 100 drafts printed 37 s; a shop's small computer may take several times that. PHP's own
    # limit is lifted to it on those routes alone, never shortened, and infra/web/nginx.conf waits as long for the answer.
    app.long_request.max_seconds: 240
    # The hours a key sent with a write that adds is kept, with what the write answered, for a retry to be answered again
    # rather than made again (SubmissionGuard): a lost answer is retried within minutes; the hourly purge forgets the rest.
    # A claim whose work never committed is taken back once it is older than app.long_request.max_seconds.
    app.submissions.kept_hours: 24
    # What an imported workbook's parts may inflate to, together (64 MiB): a few kilobytes of zip can hold gigabytes, while
    # 5,000 rows (the row cap's ceiling) of twenty forty-character cells inflate to about 10 MB.
    app.import.max_inflated_bytes: 67108864
    # The most entries a list handed in may hold (ListLimits): a document of 10,000 lines took 15 s to create on a
    # developer's machine and held the worker all that while; 1,000 take under 2 s, more than a shop's longest invoice.
    app.list_limits:
        document.lines: 1000
    # The queries and the log records one request keeps for the profiler, in development (BoundedDebugQueries,
    # BoundedDebugLogs): enough for any screen, while an import of thousands of rows would keep them all with their
    # parameters and run out of memory.
    app.debug.queries_kept: 2000
    app.debug.logs_kept: 2000
    # The reasons of a product's « À vérifier » the home's « À surveiller » leaves out (ProductCheckWatch): what clears only
    # product by product, which the products list's filter still finds. An import of 4,100 products lacking both read 4,013.
    app.watch.product_check_left_out: ['barcode_missing', 'category_missing']
    # Text overrides (docs/plans/text-overrides.plan.md). The screens' texts as shipped: the image's copy of the web's
    # public/i18n, mounted over it in live mode, read from the tree itself in tests.
    app.texts.screen_directory: '%kernel.project_dir%/resources/screen-texts'
    # The longest text an override may say, in characters.
    app.texts.max_length: 2000
    # The texts a page of the writers' catalogue lists unless it asks another number, and the most it may ask.
    app.texts.catalogue_page_size: 50
    app.texts.catalogue_page_max: 200
    # What no override may change, by domain: `*` a whole domain, an exact key, or `prefix.*`. The fiscal texts, and the
    # printed labels a mandatory mention or a legal status prints through (TN Code de la TVA art. 18-II, FR CGI annexe II
    # art. 242 nonies A, docs/fiscal/TN.md § 7, FR.md § 4): the HT and TTC figures, the withholding, what a credit note
    # corrects, the operation's category and date, the marks of a draft, a duplicate or a demo, and the formats.
    app.texts.locked:
        fiscal: ['*']
        pdf: ['format.*', 'invoice.corrects', 'invoice.reason', 'invoice.supply_date', 'invoice.operations', 'invoice.operations_goods', 'invoice.operations_services', 'invoice.operations_both', 'invoice.fingerprint', 'line.unit_price', 'line.net', 'totals.subtotal', 'totals.total_net', 'totals.total_tax', 'totals.total', 'totals.withheld', 'watermark.*', 'demo.*', 'copy.*']
    # The printed labels a company or the operator may word their own way; with the locked ones they class every key of
    # pdf, so a label added is classed in the change that adds it (ShippedTextsTest).
    app.texts.open:
        pdf: ['company.*', 'delivery_note.*', 'purchase_order.*', 'invoice.title', 'invoice.deposit_title', 'invoice.deposit_share_line', 'invoice.deposit_line', 'invoice.deduction_line', 'invoice.late_fee_line', 'invoice.credit_note_title', 'invoice.customer', 'invoice.customer_number', 'invoice.issue_date', 'invoice.due_date', 'invoice.customer_reference', 'invoice.payment', 'invoice.credit_transfer', 'invoice.payment_terms', 'invoice.remarks', 'quote.*', 'line.discount', 'line.description', 'line.quantity', 'line.unit', 'line.taxes', 'line.section_subtotal', 'totals.document_discount', 'totals.amount_due', 'totals.in_words', 'totals.in_words_credit_note', 'totals.savings', 'totals.quantities', 'totals.currency', 'payment.*', 'stamp.*', 'statement.*']
    # The hour, in the server's time, at which the data checks run each day (CheckDataEveryNight).
    app.data_check.at: '02:30'
    # How long a failed sign-in keeps the address typed and the network address it came from (at least 12 months: the
    # database refuses fewer), and the hour the nightly purge runs (PurgeFailedSignInAddressesEveryNight).
    app.audit.failed_sign_in_months: 12
    app.audit.purge_at: '02:45'
    # The nightly run that deletes the accounts whose days have passed (AccountDeletionSettings).
    app.account.deletion_at: '03:15'
    # The nightly run that removes the closed companies whose retention has ended (RemoveClosedCompanies).
    app.company.removal_at: '03:30'
    # Mail the API sends itself.
    app.mail.sender: '%env(MAILER_SENDER)%'
    app.product_name: 'twes-in'
    # The breached-password check reaches Have I Been Pwned over the network. Off in tests, which must never
    # depend on an external service (docs/SPEC.md § 7, 2026-09-09).
    app.password.breach_check_enabled: true
    # Encrypts TOTP secrets at rest (ruling of 2026-09-10). Not APP_SECRET: that one rotates for unrelated
    # reasons, and rotating this one means every enrolled authenticator has to be enrolled again.
    app.mfa.key: '%env(APP_MFA_KEY)%'
    # How long the half-authenticated state between password and second factor survives.
    app.mfa.pending_ttl: 'PT5M'
    # How long a confirmed step-up opens what the API checks it for (the step-up list, docs/SPEC.md § 7), within the
    # same sign-in, and how many wrong answers a sign-in may give before it ends. A deployment's to set, within bounds
    # checked when the container is built (StepUpBounds): PT1M to PT15M, and 3 to 10.
    app.step_up.valid_for: 'PT5M'
    app.step_up.attempts: 5
    # How long « Effacer des données » keeps what it took, for its undo; then the copy and the files only it named go.
    app.erasure.undoable_for: 'PT24H'
    # How long « Récemment supprimés » keeps a deleted record, for its restore; then the copy goes and the delete is final.
    app.records.undoable_for: 'PT24H'
    # How long a demo sandbox may stay half built before it is taken away, its company and owner with it, so its country
    # is queued again: a build takes under a minute, and a stuck one would keep that country's demo closed.
    app.demo.build_gives_up_after: 'PT1H'
    # How long a demo's visitor may step away and stay signed in, in seconds (a real account's is app.session.idle_ttl);
    # once that session ends, at sign-out or here, the worker takes its sandbox away.
    app.demo.idle_ttl: 7200
    # The issuer an authenticator app shows beside the account.
    app.mfa.issuer: '%app.product_name%'
    # Passkeys are bound to a relying party: the registrable domain the SPA is served under, and every exact origin
    # (scheme, host and port) it is served from. Never derived from the request's Host header.
    app.webauthn.rp_id: '%env(APP_WEBAUTHN_RP_ID)%'
    app.webauthn.origins: '%env(csv:APP_WEBAUTHN_ORIGINS)%'
    # Realtime notifications through Centrifugo (docs/SPEC.md § 7, 2026-09-13). The token key signs the browser's
    # connection token and is the same secret Centrifugo holds as client.token.hmac_secret_key; the API key
    # authorises publishing through its HTTP API. The token is short-lived: the browser asks for a new one.
    app.realtime.token_key: '%env(REALTIME_TOKEN_KEY)%'
    app.realtime.token_lifetime: 900
    app.realtime.api_url: '%env(REALTIME_API_URL)%'
    app.realtime.api_key: '%env(REALTIME_API_KEY)%'
    app.realtime.push_enabled: true
    # What /platform shows of a company, said to operators on the platform's channel by kind alone: a support grant, the
    # company's standing and approval, an owner invited or joined, its subscription and the payments it declares.
    app.realtime.platform_kinds: [company, signup, invitation, membership, support_grant, subscription, payment_declaration]
    # How many notifications the centre returns at once; the unread count always covers all of them.
    app.inbox.page_size: 50
    # PDFs are rendered by a Gotenberg container (docs/SPEC.md § 2 PDF).
    app.pdf.gotenberg_url: '%env(GOTENBERG_URL)%'
    # Files live on a local volume through Flysystem, or in an S3-compatible bucket when FILES_STORAGE=s3 (docs/SPEC.md § 2 Files).
    app.files.directory: '%env(resolve:FILES_DIRECTORY)%'
    # What /api/health/deep fails on (docs/START.md § 15): a message due for the worker and waiting longer than this, and
    # less than this share of the disk under the stored files left free.
    app.health.oldest_waiting_seconds: 600
    app.health.disk_free_minimum: 0.2
    # What a person may attach to a record (docs/SPEC.md § 7, 2026-09-15): a document or a picture of one, read from its
    # bytes. nginx's client_max_body_size and PHP's upload_max_filesize/post_max_size sit just above the size.
    app.files.upload_max_bytes: 10485760
    app.files.attachment_types: ['application/pdf', 'image/png', 'image/jpeg', 'image/webp']
    app.files.attachments_per_subject: 10
    # A product's photos: how many, how large one may be, and the longest side of the two copies the server cuts, small
    # for a line and large for a page. The megapixels bound what one decode costs: a 16 MP picture takes 64 MB of
    # memory, which the API's workers can afford.
    app.products.photos_per_product: 6
    app.products.photo_max_bytes: 5242880
    app.products.photo_max_megapixels: 16
    app.products.photo_small_side: 160
    app.products.photo_large_side: 960

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
        # Domain/ is scanned too: its entities and value objects are never injected and are dropped as unused, while
        # its repository interfaces are the ports the resource aliases to their one adapter (Symfony aliases every
        # interface with a single implementation). Values and tags are attributes on the classes and interfaces that
        # take them (docs/SPEC.md § 7, 2026-10-01); what stays here is what no attribute can say.

    # Domain services take no framework attribute, so their values are named here.
    App\Texts\Domain\Service\TextLocks:
        arguments:
            $locked: '%app.texts.locked%'
    App\Texts\Domain\Service\OverrideRules:
        arguments:
            $maxLength: '%app.texts.max_length%'

    League\Flysystem\FilesystemOperator:
        factory: ['App\Files\Infrastructure\Flysystem\FilesystemFactory', 'create']
        arguments:
            $driver: '%env(FILES_STORAGE)%'
            $directory: '%app.files.directory%'
            $bucket: '%env(FILES_S3_BUCKET)%'
            $endpoint: '%env(FILES_S3_ENDPOINT)%'
            $region: '%env(FILES_S3_REGION)%'
            $accessKey: '%env(FILES_S3_ACCESS_KEY)%'
            $secretKey: '%env(FILES_S3_SECRET_KEY)%'
            $pathStyle: '%env(bool:FILES_S3_PATH_STYLE)%'
            $httpClient: '@Symfony\Contracts\HttpClient\HttpClientInterface'

when@test:
    parameters:
        # The tests read the web's own texts in the tree, which the image copies.
        app.texts.screen_directory: '%kernel.project_dir%/../web/public/i18n'
        # The same rule for the realtime push: the rows are asserted, the push is the adapter's own unit test.
        app.realtime.push_enabled: false
        # No test reaches the network: the check answers "not breached" and the use case is exercised through
        # its port with a fake that returns each of the three answers.
        app.password.breach_check_enabled: false
        # Files a test stores stay out of the development volume.
        app.files.directory: '%kernel.project_dir%/var/test-files'
    services:
        # No test reaches Gotenberg either: the fake answers a PDF header followed by the page, which a test can read.
        App\Tests\Support\FakePdfRenderer: ~
        App\Shared\Application\PdfRenderer: '@App\Tests\Support\FakePdfRenderer'
        App\Tests\Support\FakeFacturXPdf: ~
        App\Shared\Application\FacturXPdf: '@App\Tests\Support\FakeFacturXPdf'
        # A module only the tests declare, needing customers: the dependency refusals go through the API with it.
        App\Tests\Support\RecordedLogs: ~
        App\Tests\Support\Module\LedgerFixtureModule:
            tags: ['app.modules.declarations']
        # FrameworkBundle hardcodes MOCKSESSID for the mock file session storage; the functional tests assert the
        # cookie the browser will actually see, name included, so the test factory carries the real name.
        session.storage.factory.mock_file:
            class: Symfony\Component\HttpFoundation\Session\Storage\MockFileSessionStorageFactory
            arguments:
                - '%kernel.cache_dir%/sessions'
                - '__Host-twes_session'
                - !service
                    class: Symfony\Component\HttpFoundation\Session\Storage\MetadataBag
                    arguments: ['%session.metadata.storage_key%', '%session.metadata.update_threshold%']
