# SPDX-License-Identifier: AGPL-3.0-or-later
# France's fiscal preset. Every value is sourced in docs/fiscal/FR.md, where each rule is marked unvalidated:
# change a rule there first, with its source, then here. Validated by App\Fiscal\Infrastructure\Preset.
country: FR
currency: EUR
minor_unit: 2
document_languages: [fr]

rounding:
    mode: half_up
    vat_point: per_rate_group
    tax_basis: exclusive

identifiers:
    - key: siren
      label_key: fiscal.identifier.fr.siren
      pattern: '^[0-9]{9}$'
      required_for: [company, business_customer]
      check: luhn
    - key: siret
      label_key: fiscal.identifier.fr.siret
      pattern: '^[0-9]{14}$'
      required_for: [company]
      check: siret
    - key: vat_number
      label_key: fiscal.identifier.fr.vat_number
      pattern: '^FR[0-9A-Z]{2}[0-9]{9}$'
      required_for: []
      check: fr_vat_key
      # Another member state's number, held by a customer or a supplier there, never by the company: the shapes
      # VIES publishes (docs/fiscal/FR.md § 5a), by the prefix the number starts with. Northern Ireland trades goods
      # under XI.
      foreign_patterns:
          AT: '^ATU[0-9]{8}$'
          BE: '^BE[01][0-9]{9}$'
          BG: '^BG[0-9]{9,10}$'
          CY: '^CY[0-9]{8}[A-Z]$'
          CZ: '^CZ[0-9]{8,10}$'
          DE: '^DE[0-9]{9}$'
          DK: '^DK[0-9]{8}$'
          EE: '^EE[0-9]{9}$'
          EL: '^EL[0-9]{9}$'
          ES: '^ES(?:[0-9A-Z][0-9]{7}[A-Z]|[A-Z][0-9]{7}[0-9])$'
          FI: '^FI[0-9]{8}$'
          HR: '^HR[0-9]{11}$'
          HU: '^HU[0-9]{8}$'
          IE: '^IE(?:[0-9][0-9A-Z+*][0-9]{5}[A-Z]|[0-9]{7}[A-Z]{2})$'
          IT: '^IT[0-9]{11}$'
          LT: '^LT(?:[0-9]{9}|[0-9]{12})$'
          LU: '^LU[0-9]{8}$'
          LV: '^LV[0-9]{11}$'
          MT: '^MT[0-9]{8}$'
          NL: '^NL[0-9A-Z+*]{12}$'
          PL: '^PL[0-9]{10}$'
          PT: '^PT[0-9]{9}$'
          RO: '^RO[0-9]{2,10}$'
          SE: '^SE[0-9]{12}$'
          SI: '^SI[0-9]{8}$'
          SK: '^SK[0-9]{10}$'
          XI: '^XI(?:[0-9]{9}|[0-9]{12}|GD[0-9]{3}|HA[0-9]{3})$'

tax_components:
    - code: TVA20
      names: { fr: 'TVA 20 %', en: 'VAT 20%' }
      kind: percentage_line
      family: vat
      rate: '20'
      is_default: true
    - code: TVA10
      names: { fr: 'TVA 10 %', en: 'VAT 10%' }
      kind: percentage_line
      family: vat
      rate: '10'
    - code: TVA5_5
      names: { fr: 'TVA 5,5 %', en: 'VAT 5.5%' }
      kind: percentage_line
      family: vat
      rate: '5.5'
    - code: TVA2_1
      names: { fr: 'TVA 2,1 %', en: 'VAT 2.1%' }
      kind: percentage_line
      family: vat
      rate: '2.1'

customer_tax_regimes:
    - code: standard
      label_key: fiscal.regime.standard
      excluded_families: []
    - code: exempt
      label_key: fiscal.regime.exempt
      excluded_families: [vat]
      mention_key: fiscal.mention.fr.exempt
    - code: intra_eu
      label_key: fiscal.regime.intra_eu
      excluded_families: [vat]
      mention_key: fiscal.mention.fr.intra_eu
      # EN 16931 BT-151/BT-118 and BT-121 (docs/fiscal/FR.md § 6): intra-community supply, VATEX-EU-IC.
      vat_category: K
      vat_exemption_code: VATEX-EU-IC
    - code: export
      label_key: fiscal.regime.export
      excluded_families: [vat]
      mention_key: fiscal.mention.fr.export
      vat_category: G
      vat_exemption_code: VATEX-EU-G

company_vat_regimes:
    - code: standard
      label_key: fiscal.regime.standard
      excluded_families: []
    - code: franchise
      label_key: fiscal.regime.franchise
      excluded_families: [vat]
      mention_key: fiscal.mention.fr.franchise
      vat_category: E
      vat_exemption_code: VATEX-FR-FRANCHISE

mentions:
    invoice:
        - fiscal.mention.fr.late_payment
        - fiscal.mention.fr.recovery_indemnity
        - fiscal.mention.fr.no_early_discount

# What the law adds to an invoice from 1 September 2026 (CGI ann. II art. 242 nonies A I 8° bis and 11° bis,
# docs/fiscal/FR.md § 4a): whether its operations are goods, services or both, and the mention a company that opted
# to pay VAT on the débits prints.
invoice_fields:
    operation_category: true
    vat_on_debits:
        mention_key: fiscal.mention.fr.vat_on_debits

# The establishment part of a registration number: the five-digit NIC closing a SIRET (docs/fiscal/FR.md § 5).
# The defaults this country gives settings where custom differs by country (docs/fiscal/FR.md § 4).
settings:
    document.amount_in_words: false

establishment:
    default_code: '00001'
    code_pattern: '^[0-9]{5}$'

numbering:
    invoice: { format: 'FA-{YYYY}-{MM}-{SEQ:5}', reset: yearly }
    credit_note: { format: 'AV-{YYYY}-{MM}-{SEQ:5}', reset: yearly }
    delivery_note: { format: 'BL-{YYYY}-{MM}-{SEQ:5}', reset: yearly }
    quote: { format: 'DEV-{YYYY}-{MM}-{SEQ:5}', reset: yearly }

# UN/ECE Recommendation 20 codes, which EN 16931 (BT-130) expects on every invoice line.
units:
    - { code: C62, names: { fr: 'Unité', en: 'Unit' }, decimals: 0 }
    - { code: H87, names: { fr: 'Pièce', en: 'Piece' }, decimals: 0 }
    - { code: HUR, names: { fr: 'Heure', en: 'Hour' }, decimals: 2 }
    - { code: DAY, names: { fr: 'Jour', en: 'Day' }, decimals: 2 }
    - { code: KGM, names: { fr: 'Kilogramme', en: 'Kilogram' }, decimals: 3 }
    - { code: MTR, names: { fr: 'Mètre', en: 'Metre' }, decimals: 3 }
    - { code: MTK, names: { fr: 'Mètre carré', en: 'Square metre' }, decimals: 3 }
    - { code: LTR, names: { fr: 'Litre', en: 'Litre' }, decimals: 3 }
