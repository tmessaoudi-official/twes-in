# twes-in development and CI environment. Ports and the database password come from ./.env (committed defaults).
name: twes-in

# Every service's output is rotated by Docker's log driver, 10 MB × 5 files (docs/SPEC.md § 7, 2026-09-17).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    logging: *logging
    restart: unless-stopped
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: twes
      POSTGRES_USER: twes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twes}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twes -d twes"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    logging: *logging
    # Back after a fault, as in production: a worker that died of one in development stayed down until a make up.
    restart: unless-stopped
    # The default network, and Gotenberg's, which only the api and the workers join.
    networks: [default, pdf]
    build: &api-build
      context: .
      dockerfile: infra/api/Dockerfile
      # The development stage; compose.prod.yaml switches to the production one.
      target: dev
      # The build the image is, from scripts/build-version.sh, which the Makefile and CI run: empty, it says so.
      args:
        BUILD_VERSION: "${API_BUILD_VERSION:-}"
        BUILD_COMMIT: "${API_BUILD_COMMIT:-}"
    environment: &api-environment
      APP_ENV: dev
      # The deployment this is (dev, staging, prod), shown beside the build in the footer when it is not prod.
      DEPLOY_ENV: "${DEPLOY_ENV:-dev}"
      # The application's own role, which reads and writes rows only; the migrate service below gives it its password.
      DATABASE_URL: "postgresql://twes_app:${POSTGRES_APP_PASSWORD:-twes-app}@postgres:5432/twes?serverVersion=18&charset=utf8"
      MAILER_DSN: smtp://mailpit:1025
      MAILER_SENDER: no-reply@twes.local
      # The address mailed links and security.txt name: the LAN door when `make up` found one, so a link opens on a phone
      # as on this computer; else this computer's own.
      DEFAULT_URI: "${LAN_ORIGIN:-http://localhost:${WEB_PORT:-8090}}"
      # Development key. A deployment overrides it; see api/.env.
      APP_MFA_KEY: "${APP_MFA_KEY:-ojCIqjd0KzQ4JrX9wyEpy58LdtCAQ56MTwM8CWA0XOc=}"
      APP_WEBAUTHN_RP_ID: "${APP_WEBAUTHN_RP_ID:-localhost}"
      APP_WEBAUTHN_ORIGINS: "http://localhost:${WEB_PORT:-8090}"
      # The address a phone opens a pairing link at: the lan service's, which `make up` sets; empty, the tab's own.
      PAIRING_ORIGIN: "${LAN_ORIGIN:-}"
      # Development realtime secrets, shared with the centrifugo service below; see api/.env.
      REALTIME_TOKEN_KEY: "${REALTIME_TOKEN_KEY:-twes-in-development-realtime-token-key-0001}"
      REALTIME_API_URL: http://centrifugo:8000/api
      REALTIME_API_KEY: "${REALTIME_API_KEY:-twes-in-development-realtime-api-key}"
      GOTENBERG_URL: http://gotenberg:3000
      FILES_DIRECTORY: /app/var/files
    volumes:
      # Stored files (issued PDFs) outlive the container.
      - api-files:/app/var/files
      # So do the rate limiters' counters and the scheduler's last runs, or a redeploy resets every budget.
      - api-share:/app/var/share
    depends_on:
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    ports:
      - "${API_PORT:-8091}:80"

  # The schema, migrated by its owner (infra/api/migrate.sh), and the application's role given its password and its
  # grants; then it exits. The one service handed the owner's address: the api and the worker connect as the role, so a
  # statement they are tricked into running reaches rows only, never the journal's past, the schema or the server.
  migrate:
    logging: *logging
    restart: "no"  # a job: it migrates, grants and exits
    build: *api-build
    command: ["twes-migrate"]
    environment:
      <<: *api-environment
      DATABASE_MIGRATION_URL: "postgresql://twes:${POSTGRES_PASSWORD:-twes}@postgres:5432/twes?serverVersion=18&charset=utf8"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:-twes-app}"
    # The image's check asks the web server, which this one-shot never runs.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  # The worker (docs/SPEC.md § 7, 2026-10-06 02:44): the api image, reading the queue the API writes to
  # (api/config/packages/messenger.yaml). It starts once the api is up, so the rows a release expects are brought up to
  # date one container at a time. It leaves after an hour, or at 96 MB, under PHP's 128, and is started again: a long-lived PHP process is
  # renewed rather than trusted to free everything. It also runs the schedule
  # (api/src/Shared/Infrastructure/Scheduler/Schedule.php), read as the `scheduler_default` transport: one worker, so
  # each task runs once.
  worker: &worker
    logging: *logging
    networks: [default, pdf]
    build: *api-build
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=96M"]
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - api-files:/app/var/files
      - api-share:/app/var/share
    # The image's check asks the web server, which this container does not run. The consumer is process 1 (the
    # entrypoint execs it), so this says it is still running; `up --wait` needs a check to wait on.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  # The demo sandboxes' builds, on their own transport (api/config/packages/messenger.yaml, `demo`): a consumer handles
  # one message at a time and a build takes a quarter of a minute or more, so read beside the mails, every mail queued
  # behind a build waited for all of it. The same container as the worker otherwise. It starts once the api is up,
  # which has brought the rows up to date, so it leaves those steps to it rather than run them beside the worker's.
  demo-worker:
    <<: *worker
    command: ["php", "bin/console", "messenger:consume", "demo", "--time-limit=3600", "--memory-limit=96M"]
    environment:
      <<: *api-environment
      TWES_RELEASE_STEPS: "api"

  # Realtime notifications (docs/SPEC.md § 7, 2026-09-13). Browsers reach it only through nginx on the web origin
  # (/connection/websocket) and only the api container calls its HTTP API, so no port is published. Connections
  # are subscribed server-side from the token's channels claim; the namespaces are the channel shapes: a person, a company,
  # and a phone paired to a tab as a scanner (docs/SPEC.md § 7, 2026-09-23 09:45).
  centrifugo:
    logging: *logging
    restart: unless-stopped
    image: centrifugo/centrifugo:v6.10.1@sha256:dc233a5bc45392c3717d9c5254b5c89c67e1871335c3ce55538429b9bf25b88b
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "${REALTIME_TOKEN_KEY:-twes-in-development-realtime-token-key-0001}"
      CENTRIFUGO_HTTP_API_KEY: "${REALTIME_API_KEY:-twes-in-development-realtime-api-key}"
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "http://localhost:${WEB_PORT:-8090} http://127.0.0.1:${WEB_PORT:-8090} ${LAN_ORIGIN:-}"
      CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"user"},{"name":"company"},{"name":"scan"}]'
      CENTRIFUGO_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    logging: *logging
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      # The web image generates its TypeScript types from the OpenAPI document the api image exports at build.
      additional_contexts:
        api: service:api
      args:
        BUILD_VERSION: "${WEB_BUILD_VERSION:-}"
        BUILD_COMMIT: "${WEB_BUILD_COMMIT:-}"
    depends_on:
      api:
        condition: service_healthy
      # nginx resolves its upstreams when it starts, so the WebSocket upstream must exist first.
      centrifugo:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:80"

  # The HTTPS door a phone on the local network reaches the stack through (docs/SPEC.md § 7, 2026-09-23 14:08):
  # infra/lan/Caddyfile. Started by `make up`, which detects LAN_HOST and turns the `lan` profile on; a plain
  # `docker compose up` leaves it off. Development only.
  lan:
    logging: *logging
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: [lan]
    restart: unless-stopped
    # The digest of the files it mounts, which `make up` hands compose: a changed Caddyfile recreates it.
    labels:
      twes.mounts-digest: "${TWES_MOUNTS_DIGEST:-}"
    # As the shop's edge starts: the intermediate and the leaves made again from the kept root, so they carry the
    # Caddyfile's lifetimes from the start after it changes; the root stays, and a phone that trusts it keeps trusting.
    entrypoint: [sh, -c]
    command:
      - >-
        rm -f /data/caddy/pki/authorities/local/intermediate.crt /data/caddy/pki/authorities/local/intermediate.key
        && rm -rf /data/caddy/certificates/local && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      LAN_HOST: "${LAN_HOST:-localhost}"
    volumes:
      - ./infra/lan/Caddyfile:/etc/caddy/Caddyfile:ro
      - lan-data:/data
    depends_on:
      - web
    ports:
      - "${LAN_PORT:-8443}:8443"
      - "${LAN_CA_PORT:-8095}:8095"

  # Renders PDFs from HTML (docs/SPEC.md § 2 PDF). Only the api calls it; the host port serves a host-side api process.
  gotenberg:
    logging: *logging
    restart: unless-stopped
    image: gotenberg/gotenberg:8.38.1@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    # Its Chromium renders HTML written from what people typed, so one escaping mistake would hand it markup: shut in,
    # that markup can do nothing. No JavaScript; no URL but its own working files (the logo is a data URI, which is no
    # request); no download or webhook of its own; LibreOffice, which nothing here uses, closed. A wider allow-list would
    # also skip the two IP denials, which Gotenberg warns of at start. scripts/gates/lib/pdf-renderer.sh holds them.
    command:
      - gotenberg
      - --chromium-disable-javascript
      - --chromium-allow-list=^file:///tmp/
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --api-disable-download-from
      - --webhook-disable
      - --libreoffice-disable-routes
    # Alone on its own network with the api and the workers. Here it is an ordinary bridge, so the port below reaches
    # the toolchain, which runs on the host's network; compose.prod.yaml makes it internal, with no way out, and
    # publishes nothing.
    networks: [pdf]
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-8094}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    logging: *logging
    restart: unless-stopped
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8092}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-8093}:1025"

  # The toolchain: every test, gate and console command of this project runs in the next two services, never on the
  # host's PHP, Composer or Node (docs/SPEC.md § 7). Off unless the `tools` profile is named, so `up` never starts them;
  # the Makefile runs them (`make gate`). Three properties are what lets a command behave as it did on the host:
  #  - the working tree is mounted at its OWN host path, so a path a gate hands the Docker socket is one the daemon sees;
  #  - host networking, so 127.0.0.1:5433 (api/.env) and 127.0.0.1:8090 (Playwright) mean what they meant on the host;
  #  - the developer's uid, so a file written into the tree is theirs. HOST_UID, HOST_GID, DOCKER_GID and HOST_REPO
  #    come from the Makefile (docs/START.md § 1); a bare `docker compose` falls back to uid 1000 and the current directory.
  # The repository's git directory is mounted too (HOST_GIT): a linked worktree's `.git` is a file naming a directory
  # outside it, and without that directory every gate asking git which files are tracked or ignored fails there.
  tools:
    logging: *logging
    restart: "no"  # a command run, which exits
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/api/Dockerfile
      target: tools
    image: twes-in-tools
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add: ["${DOCKER_GID:-0}"]
    working_dir: "${HOST_REPO:-${PWD}}"
    environment:
      HOME: /tmp
      IN_TOOLS: "1"
      HOST_REPO: "${HOST_REPO:-${PWD}}"
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      DOCKER_GID: "${DOCKER_GID:-0}"
      # A gate's temporary directory is bind-mounted into containers it starts: it must be a path the daemon sees too, and
      # outside the working tree, whose .gitignore would otherwise hide every fixture a gate builds there from `git`.
      TMPDIR: "${TOOLS_TMP:-/tmp/twes-in-tools}"
      COMPOSER_HOME: "${HOST_REPO:-${PWD}}/var/cache/composer-home"
      COMPOSER_CACHE_DIR: "${HOST_REPO:-${PWD}}/var/cache/composer"
      COMPOSER_ALLOW_SUPERUSER: "0"
    volumes:
      - "${HOST_REPO:-${PWD}}:${HOST_REPO:-${PWD}}"
      - "${HOST_GIT:-${PWD}/.git}:${HOST_GIT:-${PWD}/.git}"
      - "${TOOLS_TMP:-/tmp/twes-in-tools}:${TOOLS_TMP:-/tmp/twes-in-tools}"
      - /var/run/docker.sock:/var/run/docker.sock

  # The web tier's toolchain: Node and Playwright's Chromium (infra/web/tools.Dockerfile). Same properties as `tools`.
  web-tools:
    logging: *logging
    restart: "no"  # a command run, which exits
    profiles: [tools]
    # Built by `make web-tools-image` (docker build, not compose: see the Makefile for why).
    image: twes-in-web-tools
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: "${HOST_REPO:-${PWD}}/web"
    environment:
      HOME: /tmp
      IN_TOOLS: "1"
      TMPDIR: "${TOOLS_TMP:-/tmp/twes-in-tools}"
      npm_config_cache: "${HOST_REPO:-${PWD}}/var/cache/npm"
      # The browser build @playwright/test names, put there by `make playwright-browser` and kept in the tree's gitignored var/.
      # Passed through only when the caller sets it (`BASE_URL=… make e2e`): an empty one would defeat the config's default.
      BASE_URL:
      # The HTTPS door's address, which the Makefile exports: the WebKit scenarios run through it (web/playwright.config.ts).
      LAN_ORIGIN:
      # `make gallery`'s choices (web/e2e-gallery/gallery.spec.ts), passed through the same way.
      GALLERY_AS:
      GALLERY_AXE:
      GALLERY_COMPANY:
      GALLERY_DIR:
      GALLERY_FOCUS:
      GALLERY_LANG:
      GALLERY_ONLY:
      GALLERY_SCHEMES:
      GALLERY_WIDTHS:
      # Every other variable a browser suite reads, passed through the same way (scripts/gates/e2e-environment.sh):
      # CI turns on the configuration's CI mode (forbidOnly, the WebKit door required); MAILPIT_URL and the E2E_*
      # account point a run at another stack's mails and operator; the rest are the design, menu, selection and video
      # recorders' own choices.
      CI:
      MAILPIT_URL:
      E2E_EMAIL:
      E2E_CODES_EMAIL:
      E2E_PASSWORD:
      E2E_TOTP_SECRET:
      PLAYWRIGHT_CHANNEL:
      DESIGN_SHOTS_DIR:
      MENUS_DIR:
      RECORD_COMPANY:
      SCHEME:
      SHOTS:
      VIDEOS_DIR:
      PLAYWRIGHT_BROWSERS_PATH: "${HOST_REPO:-${PWD}}/var/cache/ms-playwright"
    volumes:
      - "${HOST_REPO:-${PWD}}:${HOST_REPO:-${PWD}}"
      - "${HOST_GIT:-${PWD}/.git}:${HOST_GIT:-${PWD}/.git}"
      - "${TOOLS_TMP:-/tmp/twes-in-tools}:${TOOLS_TMP:-/tmp/twes-in-tools}"

networks:
  pdf:

volumes:
  postgres-data:
  api-files:
  api-share:
  # The lan service's local certificate authority, kept so a phone that trusted its root keeps trusting it.
  lan-data:
