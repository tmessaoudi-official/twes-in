# The builds' trust in a proxy that re-terminates TLS, such as a claude.ai cloud session's agent proxy: its CA, the file
# CCS_EXTRA_CA_FILE names (claude-code-setup sets it in the session), is handed to every build as the BuildKit secret
# extra_ca, which each downloading step mounts for itself (infra/**/Dockerfile) and adds to what it already trusts. TLS
# checks stay on. The Makefile adds this file to COMPOSE_FILE only when CCS_EXTRA_CA_FILE names a file that exists, so a
# computer and CI build exactly as before; a secret is in no image layer (scripts/gates/build-extra-ca.sh holds the rest).
# The toolchain's runs (composer install, npm ci, git) go through the same proxy, so they are handed the same file,
# mounted read-only, with the variable each tool reads pointed at it: there every connection is the proxy's, whose CA
# is all they need. git has its own: Debian builds it on GnuTLS, which never reads SSL_CERT_FILE.
# Only services compose.yaml defines are named here: this file also goes with compose.yaml alone (`make up-images`),
# where any other would be built from ./Dockerfile. What live development adds is compose.live-extra-ca.yaml's.
services:
  api:
    build:
      secrets: [extra_ca]
  migrate:
    build:
      secrets: [extra_ca]
  worker:
    build:
      secrets: [extra_ca]
  demo-worker:
    build:
      secrets: [extra_ca]
  web:
    build:
      secrets: [extra_ca]
  tools:
    build:
      secrets: [extra_ca]
    volumes:
      - ${CCS_EXTRA_CA_FILE:?the agent proxy's CA file}:/etc/ccs-ca.crt:ro
    environment:
      SSL_CERT_FILE: /etc/ccs-ca.crt
      NODE_EXTRA_CA_CERTS: /etc/ccs-ca.crt
      COMPOSER_CAFILE: /etc/ccs-ca.crt
      REQUESTS_CA_BUNDLE: /etc/ccs-ca.crt
      GIT_SSL_CAINFO: /etc/ccs-ca.crt
  web-tools:
    volumes:
      - ${CCS_EXTRA_CA_FILE:?the agent proxy's CA file}:/etc/ccs-ca.crt:ro
    environment:
      SSL_CERT_FILE: /etc/ccs-ca.crt
      NODE_EXTRA_CA_CERTS: /etc/ccs-ca.crt
      COMPOSER_CAFILE: /etc/ccs-ca.crt
      REQUESTS_CA_BUNDLE: /etc/ccs-ca.crt
      GIT_SSL_CAINFO: /etc/ccs-ca.crt
secrets:
  extra_ca:
    file: ${CCS_EXTRA_CA_FILE:?the agent proxy's CA file}
