# A shop's installation on its own machine (docs/START.md § 16): the production stack, its backups in its own folder
# (compose.backup-local.yaml, copied off site by compose.backup-offsite.yaml when switched on), behind an edge of its
# own. scripts/onprem/twes starts it, through scripts/deploy/deploy.sh with TWES_INSTALL=onprem in the values:
#   docker compose --env-file <values> -f compose.yaml -f compose.prod.yaml -f compose.backup.yaml \
#     -f compose.backup-local.yaml [-f compose.backup-offsite.yaml] -f compose.onprem.yaml -f compose.release.yaml \
#     up -d --no-build --wait
# Two addresses, and no name to buy: the shop's computer opens https://localhost, where passkeys work (a browser binds a
# passkey to a name, never to an address); a phone or another computer on the shop's network opens
# https://LAN_HOST, this machine's address, which scripts/onprem/twes reads at each start, since a router may hand out
# another. The edge's certificates come from its own authority, which a phone trusts once from http://LAN_HOST/root.crt.
# Mailed links open from any device, so they name the network address. The monitor is optional here: an empty
# SENTRY_DSN reports nothing, and the backups send no heartbeat without MONITOR_URL. Only the edge publishes, on 80 and
# 443. Its secrets, the shop's mail account among them, are compose secrets (compose.prod.yaml says how).
# scripts/gates/onprem-overlay.sh and scripts/gates/secrets-overlay.sh hold each of those promises.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Written out for the api, the worker and the migrations: an anchor in compose.yaml does not reach this file, and the
# worker sends the mails whose links must be the api's.
x-onprem-environment: &onprem-environment
  DEPLOY_ENV: prod
  # A shop's own computer: the API keeps the demo closed here until an operator opens it.
  APP_INSTALLATION: onprem
  # Mailed links and the phone's pairing carry the Tailscale name once the shop's computer has joined its tailnet, which
  # opens from a staff device anywhere, else the network address (docs/SPEC.md § 7, 2026-10-31 21:14, Q6).
  DEFAULT_URI: "https://${TAILNET_HOST:-${LAN_HOST:?set LAN_HOST, this machine's address on the shop's network (scripts/onprem/twes reads it)}}"
  # Passkeys stay bound to localhost until the platform's own switch moves them to the Tailscale name (Q1); the origins
  # list every name the app answers on, the public one with and without the port the router forwards, since a browser
  # names the default port in no origin.
  APP_WEBAUTHN_RP_ID: localhost
  APP_WEBAUTHN_ORIGINS: "https://localhost${TAILNET_HOST:+,https://${TAILNET_HOST}}${PUBLIC_HOST:+,https://${PUBLIC_HOST},https://${PUBLIC_HOST}:${PUBLIC_HTTPS_PORT:-443}}"
  PAIRING_ORIGIN: "https://${TAILNET_HOST:-${LAN_HOST:?set LAN_HOST, this machine's address on the shop's network (scripts/onprem/twes reads it)}}"
  # Where the app is reached from outside, both empty while off: the Tailscale name (TAILNET_HOST, such as
  # shop-pc.tail1234.ts.net) and the public one (PUBLIC_HOST), built and switched off (docs/SPEC.md § 7, 2026-11-01 10:20).
  TAILNET_HOST: "${TAILNET_HOST:-}"
  PUBLIC_HOST: "${PUBLIC_HOST:-}"
  # The Host the API answers (Symfony's own variable): localhost, any IPv4 address, since the network address may change
  # while a container still runs on the one before, and the outside names once given.
  SYMFONY_TRUSTED_HOSTS: '^localhost$$,^[0-9]+(\.[0-9]+){3}$$${TAILNET_HOST:+,^${TAILNET_HOST}$$}${PUBLIC_HOST:+,^${PUBLIC_HOST}$$}'
  # The shop's mail account itself, such as smtp://shop%40gmail.com:app-password@smtp.gmail.com:587, is the secret
  # mailer_dsn.
  MAILER_SENDER: "${MAILER_SENDER:?set MAILER_SENDER, the address mails come from, the account's own for Gmail}"
  FILES_STORAGE: local
  # What an update's health check reads /api/health/deep with (scripts/onprem/twes), and a monitor later, is the secret
  # monitor_token.
  SENTRY_DSN: "${SENTRY_DSN:-}"

services:
  edge:
    logging: *logging
    restart: unless-stopped
    # The digest of the Caddyfile it mounts, which deploy.sh hands compose: an update changing it recreates the edge.
    labels:
      twes.mounts-digest: "${TWES_MOUNTS_DIGEST:-}"
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    # The intermediate and the leaves are made again from the kept root at every start, so they carry the Caddyfile's
    # lifetimes from the start after it changes; the root stays, and the phones that trust it keep trusting the address.
    entrypoint: [sh, -c]
    command:
      - >-
        rm -f /data/caddy/pki/authorities/local/intermediate.crt /data/caddy/pki/authorities/local/intermediate.key
        && rm -rf /data/caddy/certificates/local && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      LAN_HOST: "${LAN_HOST:?set LAN_HOST, this machine's address on the shop's network (scripts/onprem/twes reads it)}"
      # The outside names, empty while off: the edge's sites for them are its own (infra/onprem/Caddyfile).
      TAILNET_HOST: "${TAILNET_HOST:-}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
    volumes:
      - ./infra/onprem/Caddyfile:/etc/caddy/Caddyfile:ro
      # The authority and its certificates: kept, or every phone would have to trust a new one after a restart.
      - edge-data:/data
      - edge-config:/config
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"

  api:
    ports: !reset []
    environment: *onprem-environment
    secrets: &onprem-secrets [monitor_token]
  worker:
    environment: *onprem-environment
    secrets: *onprem-secrets
  demo-worker:
    environment: *onprem-environment
    secrets: *onprem-secrets
  migrate:
    environment: *onprem-environment
    secrets: *onprem-secrets
  postgres:
    ports: !reset []
  # The token a monitor takes heartbeats with, once MONITOR_URL names one; new-instance.sh --onprem makes it.
  backup:
    secrets: [monitor_heartbeat_token]
  centrifugo:
    environment:
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "https://localhost https://${LAN_HOST:?set LAN_HOST, this machine's address on the shop's network (scripts/onprem/twes reads it)}${TAILNET_HOST:+ https://${TAILNET_HOST}}${PUBLIC_HOST:+ https://${PUBLIC_HOST} https://${PUBLIC_HOST}:${PUBLIC_HTTPS_PORT:-443}}"
  web:
    ports: !reset []
  gotenberg:
    ports: !reset []
  # Development's mail catcher: the shop sends through its own account, so it never starts unless asked for by name.
  mailpit:
    profiles: [mailpit]
    ports: !reset []

volumes:
  edge-data:
  edge-config:

secrets:
  monitor_token:
    environment: MONITOR_TOKEN
  monitor_heartbeat_token:
    environment: MONITOR_HEARTBEAT_TOKEN
